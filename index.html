<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Air Maths Board</title>

<style>

/* ============================= */
/* BASIC                         */
/* ============================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05000d;
    font-family: Arial, sans-serif;
}


/* ============================= */
/* CAMERA                        */
/* ============================= */

#camera {

    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    object-fit: cover;

    transform: scaleX(-1);

    opacity: 0.30;

    z-index: 0;
}


/* ============================= */
/* GRID                          */
/* ============================= */

#grid {

    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    z-index: 1;

    pointer-events: none;

    background-image:
        linear-gradient(
            rgba(180, 80, 255, 0.10) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(180, 80, 255, 0.10) 1px,
            transparent 1px
        );

    background-size: 90px 90px;

    opacity: 0.45;

    mask-image:
        radial-gradient(
            ellipse at center,
            black 20%,
            transparent 90%
        );
}


/* ============================= */
/* CANVAS                        */
/* ============================= */

#canvas {

    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    z-index: 2;

    pointer-events: none;
}


/* ============================= */
/* CORNER MARKERS                */
/* ============================= */

.corner {

    position: fixed;

    width: 45px;
    height: 45px;

    border-color: rgba(255, 0, 255, 0.65);

    z-index: 5;

    pointer-events: none;
}

.corner.topLeft {

    top: 18px;
    left: 18px;

    border-top: 2px solid;
    border-left: 2px solid;
}

.corner.topRight {

    top: 18px;
    right: 18px;

    border-top: 2px solid;
    border-right: 2px solid;
}

.corner.bottomLeft {

    bottom: 18px;
    left: 18px;

    border-bottom: 2px solid;
    border-left: 2px solid;
}

.corner.bottomRight {

    bottom: 18px;
    right: 18px;

    border-bottom: 2px solid;
    border-right: 2px solid;
}


/* ============================= */
/* TITLE                         */
/* ============================= */

#title {

    position: fixed;

    top: 22px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 10;

    color: white;

    font-size: 20px;

    font-weight: bold;

    letter-spacing: 4px;

    text-shadow:
        0 0 8px #ff00ff,
        0 0 20px #ff00ff;

    white-space: nowrap;
}


/* ============================= */
/* STATUS                        */
/* ============================= */

#status {

    position: fixed;

    top: 54px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 10;

    color: #ff66ff;

    font-size: 12px;

    letter-spacing: 2px;

    text-shadow:
        0 0 8px #ff00ff;
}


/* ============================= */
/* SYSTEM HUD                    */
/* ============================= */

#systemHUD {

    position: fixed;

    top: 20px;
    left: 20px;

    z-index: 10;

    width: 190px;

    padding: 14px;

    border: 1px solid
        rgba(255, 0, 255, 0.35);

    background:
        rgba(10, 0, 20, 0.55);

    backdrop-filter: blur(8px);

    color: white;

    box-shadow:
        0 0 20px
        rgba(255, 0, 255, 0.15);
}


#hudHeader {

    color: #ff66ff;

    font-size: 11px;

    letter-spacing: 2px;

    margin-bottom: 12px;
}


.hudLine {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-top: 9px;

    font-size: 10px;
}


.hudLabel {

    color: rgba(255,255,255,0.65);

    letter-spacing: 1px;
}


.hudValue {

    color: #ff66ff;

    letter-spacing: 1px;

    text-shadow:
        0 0 8px #ff00ff;
}


#handDot {

    display: inline-block;

    width: 7px;
    height: 7px;

    margin-right: 5px;

    border-radius: 50%;

    background: #555;

    box-shadow:
        0 0 5px #555;
}


/* ============================= */
/* GESTURE STRIP                 */
/* ============================= */

#gestureStrip {

    position: fixed;

    bottom: 25px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 10;

    padding: 10px 18px;

    border: 1px solid
        rgba(255, 0, 255, 0.35);

    background:
        rgba(10, 0, 20, 0.60);

    backdrop-filter: blur(8px);

    color: rgba(255,255,255,0.75);

    font-size: 11px;

    letter-spacing: 1px;

    white-space: nowrap;
}


#instructionHeader {

    color: #ff66ff;

    font-size: 10px;

    margin-bottom: 7px;

    letter-spacing: 2px;
}


/* ============================= */
/* START BUTTON                  */
/* ============================= */

#startButton {

    position: fixed;

    bottom: 95px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 10;

    padding: 12px 25px;

    border: 1px solid #ff00ff;

    background:
        rgba(20, 0, 30, 0.75);

    color: white;

    font-size: 12px;

    letter-spacing: 2px;

    cursor: pointer;

    box-shadow:
        0 0 15px
        rgba(255, 0, 255, 0.35);

    transition: 0.2s;
}


#startButton:active {

    transform:
        translateX(-50%)
        scale(0.96);
}


/* ============================= */
/* CURSOR                        */
/* ============================= */

#cursor {

    position: fixed;

    width: 42px;
    height: 42px;

    border-radius: 50%;

    border: 2px solid #ff00ff;

    transform:
        translate(-50%, -50%);

    z-index: 20;

    pointer-events: none;

    opacity: 0;

    box-shadow:
        0 0 8px #ff00ff,
        0 0 20px #ff00ff,
        inset 0 0 8px #ff00ff;

    transition:
        width 0.08s,
        height 0.08s,
        border-color 0.08s;
}


#cursor.ready {

    opacity: 1;
}


#cursor.drawing {

    width: 48px;
    height: 48px;

    border-color: #ffffff;

    box-shadow:
        0 0 10px #ff00ff,
        0 0 25px #ff00ff,
        0 0 45px #ff00ff,
        inset 0 0 10px #ff00ff;
}


#cursor.pinch {

    width: 30px;
    height: 30px;

    border-color: #ff66ff;

    box-shadow:
        0 0 10px #ff00ff,
        0 0 25px #ff00ff;
}


/* ============================= */
/* CURSOR CENTER                 */
/* ============================= */

#cursorCenter {

    position: absolute;

    top: 50%;
    left: 50%;

    width: 7px;
    height: 7px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px white,
        0 0 15px #ff00ff;
}


/* ============================= */
/* CURSOR MARKS                  */
/* ============================= */

.cursorMark {

    position: absolute;

    width: 7px;
    height: 7px;

    border-color: #ff00ff;
}


#markTop {

    top: -8px;
    left: 50%;

    transform:
        translateX(-50%);

    border-top: 2px solid;
}


#markBottom {

    bottom: -8px;
    left: 50%;

    transform:
        translateX(-50%);

    border-bottom: 2px solid;
}


#markLeft {

    left: -8px;
    top: 50%;

    transform:
        translateY(-50%);

    border-left: 2px solid;
}


#markRight {

    right: -8px;
    top: 50%;

    transform:
        translateY(-50%);

    border-right: 2px solid;
}


/* ============================= */
/* MOBILE                        */
/* ============================= */

@media (max-width: 600px) {

    #title {

        font-size: 15px;

        letter-spacing: 3px;

        top: 17px;
    }


    #status {

        top: 43px;

        font-size: 9px;
    }


    #systemHUD {

        top: 70px;
        left: 12px;

        width: 155px;

        padding: 10px;
    }


    #gestureStrip {

        bottom: 15px;

        font-size: 9px;

        padding:
            8px 12px;
    }


    #startButton {

        bottom: 82px;

        padding:
            10px 18px;

        font-size: 10px;
    }


    #cursor {

        width: 38px;
        height: 38px;
    }


    #cursor.drawing {

        width: 44px;
        height: 44px;
    }


    #cursor.pinch {

        width: 28px;
        height: 28px;
    }
}

</style>

</head>


<body>


<!-- ============================= -->
<!-- CAMERA                        -->
<!-- ============================= -->

<video
    id="camera"
    autoplay
    playsinline>
</video>


<!-- ============================= -->
<!-- GRID                          -->
<!-- ============================= -->

<div id="grid"></div>


<!-- ============================= -->
<!-- DRAWING CANVAS                -->
<!-- ============================= -->

<canvas id="canvas"></canvas>


<!-- ============================= -->
<!-- CORNER MARKERS                -->
<!-- ============================= -->

<div class="corner topLeft"></div>
<div class="corner topRight"></div>
<div class="corner bottomLeft"></div>
<div class="corner bottomRight"></div>


<!-- ============================= -->
<!-- TITLE                         -->
<!-- ============================= -->

<div id="title">
    ✨ AIR MATHS BOARD
</div>


<div id="status">
    Press START
</div>


<!-- ============================= -->
<!-- SYSTEM HUD                    -->
<!-- ============================= -->

<div id="systemHUD">

    <div id="hudHeader">
        ◈ SYSTEM STATUS
    </div>

    <div class="hudLine">

        <span>
            <span id="handDot"></span>
            <span class="hudLabel">HAND</span>
        </span>

        <span
            id="handState"
            class="hudValue">
            SEARCHING
        </span>

    </div>


    <div class="hudLine">

        <span class="hudLabel">
            MODE
        </span>

        <span
            id="modeState"
            class="hudValue">
            STANDBY
        </span>

    </div>


    <div class="hudLine">

        <span class="hudLabel">
            SYSTEM
        </span>

        <span
            id="systemState"
            class="hudValue">
            OFFLINE
        </span>

    </div>

</div>


<!-- ============================= -->
<!-- GESTURE STRIP                 -->
<!-- ============================= -->

<div id="gestureStrip">

    <div id="instructionHeader">
        ◈ GESTURE
    </div>

    ☝️ <b>Draw</b>
    ·
    🤏 <b>Stop</b>
    ·
    ✋ <b>Clear</b>

</div>


<!-- ============================= -->
<!-- START BUTTON                  -->
<!-- ============================= -->

<button id="startButton">
    START CAMERA
</button>


<!-- ============================= -->
<!-- CURSOR                        -->
<!-- ============================= -->

<div id="cursor">

    <div id="cursorCenter"></div>

    <div
        id="markTop"
        class="cursorMark">
    </div>

    <div
        id="markBottom"
        class="cursorMark">
    </div>

    <div
        id="markLeft"
        class="cursorMark">
    </div>

    <div
        id="markRight"
        class="cursorMark">
    </div>

</div>


<!-- ============================= -->
<!-- MEDIAPIPE                    -->
<!-- ============================= -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>


<script>


/* ================================================= */
/* ELEMENTS                                          */
/* ================================================= */

const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const cursor =
    document.getElementById("cursor");

const status =
    document.getElementById("status");

const handState =
    document.getElementById("handState");

const modeState =
    document.getElementById("modeState");

const systemState =
    document.getElementById("systemState");

const handDot =
    document.getElementById("handDot");

const startButton =
    document.getElementById("startButton");


/* ================================================= */
/* CANVAS SIZE                                       */
/* ================================================= */

function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


/* ================================================= */
/* DRAWING ENGINE V3                                 */
/* ================================================= */

let smoothX = null;
let smoothY = null;

let previousX = null;
let previousY = null;

let isDrawing = false;


/*
    Ignore extremely tiny movements.

    This prevents:
    - hand tremor
    - camera noise
    - MediaPipe jitter
*/

const MOVE_THRESHOLD = 2.0;


/*
    A tracking jump larger than this is
    considered suspicious.

    Increased from the previous value so
    fast hand movement is not rejected.
*/

const MAX_DRAW_JUMP = 250;


/* ================================================= */
/* ADAPTIVE SMOOTHING                                */
/* ================================================= */

function smoothPoint(
    targetX,
    targetY
) {

    /*
        First point:
        directly initialize the smoother.
    */

    if (
        smoothX === null ||
        smoothY === null
    ) {

        smoothX = targetX;
        smoothY = targetY;

        return;
    }


    const dx =
        targetX - smoothX;

    const dy =
        targetY - smoothY;


    const movement =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    let smoothing;


    /*
        Very small movement:
        more stabilization.
    */

    if (movement < 5) {

        smoothing = 0.32;

    }


    /*
        Small/medium movement.
    */

    else if (movement < 15) {

        smoothing = 0.52;

    }


    /*
        Medium movement:
        more responsiveness.
    */

    else if (movement < 40) {

        smoothing = 0.70;

    }


    /*
        Fast movement.
    */

    else if (movement < 80) {

        smoothing = 0.82;

    }


    /*
        Very fast movement:
        almost direct tracking.
    */

    else {

        smoothing = 0.92;

    }


    smoothX +=
        dx * smoothing;

    smoothY +=
        dy * smoothing;
}


/* ================================================= */
/* CONTINUOUS LINE DRAWING                           */
/* ================================================= */

function drawContinuousLine(
    x1,
    y1,
    x2,
    y2
) {

    const dx =
        x2 - x1;

    const dy =
        y2 - y1;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    /*
        Ignore tiny movement.
    */

    if (
        distance < MOVE_THRESHOLD
    ) {

        return;
    }


    /*
        Protect against tracking glitches.
    */

    if (
        distance > MAX_DRAW_JUMP
    ) {

        return;
    }


    /*
        Interpolation makes the stroke
        continuous even when MediaPipe
        gives us separated positions.
    */

    const steps =
        Math.max(
            2,
            Math.ceil(
                distance / 3
            )
        );


    for (
        let i = 1;
        i <= steps;
        i++
    ) {

        const t =
            i / steps;


        const px =
            x1 +
            dx * t;

        const py =
            y1 +
            dy * t;


        /*
            OUTER GLOW
        */

        ctx.beginPath();

        ctx.moveTo(
            x1,
            y1
        );

        ctx.lineTo(
            px,
            py
        );

        ctx.lineWidth = 13;

        ctx.lineCap = "round";

        ctx.lineJoin = "round";

        ctx.strokeStyle =
            "rgba(255,0,255,0.35)";

        ctx.shadowColor =
            "#ff00ff";

        ctx.shadowBlur = 25;

        ctx.stroke();


        /*
            INNER NEON
        */

        ctx.beginPath();

        ctx.moveTo(
            x1,
            y1
        );

        ctx.lineTo(
            px,
            py
        );

        ctx.lineWidth = 5;

        ctx.lineCap = "round";

        ctx.lineJoin = "round";

        ctx.strokeStyle =
            "#ff66ff";

        ctx.shadowColor =
            "#ff00ff";

        ctx.shadowBlur = 12;

        ctx.stroke();


        /*
            WHITE CORE
        */

        ctx.beginPath();

        ctx.moveTo(
            x1,
            y1
        );

        ctx.lineTo(
            px,
            py
        );

        ctx.lineWidth = 2;

        ctx.lineCap = "round";

        ctx.lineJoin = "round";

        ctx.strokeStyle =
            "#ffffff";

        ctx.shadowColor =
            "#ffffff";

        ctx.shadowBlur = 5;

        ctx.stroke();
    }


    /*
        Reset shadow after drawing.
    */

    ctx.shadowBlur = 0;
}


/* ================================================= */
/* CLEAR CANVAS                                      */
/* ================================================= */

function clearCanvas() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    /*
        Reset drawing anchor after clear.
    */

    previousX = null;
    previousY = null;
}


/* ================================================= */
/* FINGER DETECTION                                  */
/* ================================================= */

function fingerUp(
    landmarks,
    tip,
    pip
) {

    return (
        landmarks[tip].y <
        landmarks[pip].y
    );
}


/* ================================================= */
/* PINCH DETECTION                                   */
/* ================================================= */

function pinchDistance(
    a,
    b
) {

    const dx =
        a.x - b.x;

    const dy =
        a.y - b.y;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


/*
    Hysteresis:

    Slightly different thresholds
    for starting and stopping.

    This prevents rapid flickering.
*/

const DRAW_START = 0.075;

const DRAW_STOP = 0.055;


/* ================================================= */
/* OPEN HAND CLEAR                                   */
/* ================================================= */

const CLEAR_REQUIRED_FRAMES = 5;

let clearFrames = 0;

let clearCooldown = 0;

const CLEAR_COOLDOWN_FRAMES = 12;


/* ================================================= */
/* MEDIAPIPE                                         */
/* ================================================= */

const hands =
    new Hands({

        locateFile:
        function(file) {

            return (
                "https://cdn.jsdelivr.net/npm/" +
                "@mediapipe/hands/" +
                file
            );
        }

    });


hands.setOptions({

    maxNumHands: 1,

    modelComplexity: 1,

    minDetectionConfidence: 0.6,

    minTrackingConfidence: 0.6

});


/* ================================================= */
/* HAND RESULTS                                      */
/* ================================================= */

hands.onResults(
    function(results) {

        /*
            No hand detected.
        */

        if (
            !results.multiHandLandmarks ||
            results.multiHandLandmarks.length === 0
        ) {

            handState.textContent =
                "SEARCHING";

            handDot.style.background =
                "#555";

            handDot.style.boxShadow =
                "0 0 5px #555";

            cursor.classList.remove(
                "ready",
                "drawing",
                "pinch"
            );

            isDrawing = false;

            previousX = null;
            previousY = null;

            return;
        }


        /*
            Hand detected.
        */

        const landmarks =
            results.multiHandLandmarks[0];


        handState.textContent =
            "DETECTED";

        handDot.style.background =
            "#ff00ff";

        handDot.style.boxShadow =
            "0 0 10px #ff00ff";


        status.textContent =
            "HAND TRACKING ACTIVE";

        systemState.textContent =
            "ONLINE";


        modeState.textContent =
            "AIR DRAW";


        /* ========================================= */
        /* INDEX FINGER                              */
        /* ========================================= */

        const indexTip =
            landmarks[8];

        const indexPIP =
            landmarks[6];


        const indexUp =
            fingerUp(
                landmarks,
                8,
                6
            );


        /* ========================================= */
        /* OTHER FINGERS                             */
        /* ========================================= */

        const middleUp =
            fingerUp(
                landmarks,
                12,
                10
            );


        const ringUp =
            fingerUp(
                landmarks,
                16,
                14
            );


        const pinkyUp =
            fingerUp(
                landmarks,
                20,
                18
            );


        /* ========================================= */
        /* OPEN HAND                                 */
        /* ========================================= */

        const openHand =
            indexUp &&
            middleUp &&
            ringUp &&
            pinkyUp;


        if (clearCooldown > 0) {

            clearCooldown--;
        }


        if (openHand) {

            clearFrames++;

        }

        else {

            clearFrames = 0;
        }


        /*
            Require several frames before clearing.
            This prevents accidental clearing.
        */

        if (
            clearFrames >=
                CLEAR_REQUIRED_FRAMES &&
            clearCooldown === 0
        ) {

            clearCanvas();

            clearFrames = 0;

            clearCooldown =
                CLEAR_COOLDOWN_FRAMES;

            isDrawing = false;

            cursor.classList.remove(
                "drawing"
            );

            cursor.classList.add(
                "ready"
            );

            modeState.textContent =
                "CLEARED";

            return;
        }


        /* ========================================= */
        /* INDEX → SCREEN COORDINATES                */
        /* ========================================= */

        const x =
            (1 - indexTip.x) *
            window.innerWidth;


        const y =
            indexTip.y *
            window.innerHeight;


        /* ========================================= */
        /* SMOOTH POSITION                           */
        /* ========================================= */

        smoothPoint(
            x,
            y
        );


        const drawX =
            smoothX;

        const drawY =
            smoothY;


        /* ========================================= */
        /* CURSOR POSITION                           */
        /* ========================================= */

        cursor.style.left =
            drawX + "px";

        cursor.style.top =
            drawY + "px";


        cursor.classList.add(
            "ready"
        );


        /* ========================================= */
        /* PINCH                                      */
        /* ========================================= */

        const thumbTip =
            landmarks[4];


        const pinch =
            pinchDistance(
                thumbTip,
                indexTip
            );


        /*
            PINCH STOP
        */

        if (
            isDrawing &&
            pinch < DRAW_STOP
        ) {

            isDrawing = false;

            previousX = null;
            previousY = null;

            cursor.classList.remove(
                "drawing"
            );

            cursor.classList.add(
                "pinch"
            );

            modeState.textContent =
                "STOPPED";

            return;
        }


        /*
            If pinched but we were not drawing,
            remain stopped.
        */

        if (
            !isDrawing &&
            pinch < DRAW_START
        ) {

            cursor.classList.remove(
                "drawing"
            );

            cursor.classList.add(
                "pinch"
            );

            modeState.textContent =
                "READY";

            return;
        }


        /* ========================================= */
        /* START DRAWING                             */
        /* ========================================= */

        if (
            !isDrawing &&
            indexUp &&
            pinch > DRAW_START
        ) {

            isDrawing = true;

            previousX = drawX;
            previousY = drawY;

            cursor.classList.remove(
                "pinch"
            );

            cursor.classList.add(
                "drawing"
            );

            modeState.textContent =
                "DRAWING";

            return;
        }


        /* ========================================= */
        /* CONTINUE DRAWING                          */
        /* ========================================= */

        if (
            isDrawing &&
            indexUp &&
            pinch > DRAW_STOP
        ) {

            cursor.classList.remove(
                "pinch"
            );

            cursor.classList.add(
                "drawing"
            );


            if (
                previousX !== null &&
                previousY !== null
            ) {

                const dx =
                    drawX -
                    previousX;


                const dy =
                    drawY -
                    previousY;


                const movement =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                /*
                    Ignore tiny tremors.
                */

                if (
                    movement >=
                    MOVE_THRESHOLD
                ) {

                    /*
                        If tracking suddenly jumps,
                        re-anchor instead of drawing
                        an unwanted giant line.
                    */

                    if (
                        movement >
                        MAX_DRAW_JUMP
                    ) {

                        previousX =
                            drawX;

                        previousY =
                            drawY;

                    }

                    else {

                        drawContinuousLine(
                            previousX,
                            previousY,
                            drawX,
                            drawY
                        );


                        previousX =
                            drawX;

                        previousY =
                            drawY;
                    }
                }
            }


            modeState.textContent =
                "DRAWING";
        }


        /* ========================================= */
        /* INDEX DOWN                                */
        /* ========================================= */

        if (
            isDrawing &&
            !indexUp
        ) {

            isDrawing = false;

            previousX = null;
            previousY = null;

            cursor.classList.remove(
                "drawing"
            );

            cursor.classList.add(
                "ready"
            );

            modeState.textContent =
                "READY";
        }

    }
);


/* ================================================= */
/* START CAMERA                                      */
/* ================================================= */

startButton.addEventListener(
    "click",
    async function() {

        try {

            status.textContent =
                "STARTING CAMERA...";


            systemState.textContent =
                "STARTING";


            const stream =
                await navigator.mediaDevices.getUserMedia({

                    video: {
                        facingMode: "user"
                    },

                    audio: false

                });


            video.srcObject =
                stream;


            await video.play();


            const camera =
                new Camera(
                    video,
                    {

                        onFrame:
                        async function() {

                            await hands.send({
                                image: video
                            });

                        },

                        width: 1280,

                        height: 720

                    }
                );


            camera.start();


            status.textContent =
                "CAMERA READY";


            systemState.textContent =
                "ONLINE";


            modeState.textContent =
                "AIR DRAW";


            startButton.style.display =
                "none";

        }

        catch (error) {

            console.error(error);


            status.textContent =
                "CAMERA ERROR";


            systemState.textContent =
                "ERROR";


            handState.textContent =
                "NOT AVAILABLE";

        }

    }
);


</script>
