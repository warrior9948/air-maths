<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Air Maths Board</title>

<style>

/* =========================================================
   01 — DESIGN SYSTEM
========================================================= */

:root {

    --bg-0: #0d0f11;
    --bg-1: #121416;
    --bg-2: #181b1e;
    --bg-3: #1d2024;

    --line-1: #24282c;
    --line-2: #2c3136;
    --line-3: #383e44;

    --text-1: #e6e9ec;
    --text-2: #b0b6bd;
    --text-3: #7c838a;
    --text-4: #5d646b;

    --accent: #91afd0;
    --accent-bg: rgba(145,175,208,0.10);
    --accent-line: rgba(145,175,208,0.28);

    --success: #8eaa95;
    --warning: #b5a074;
    --danger: #b87878;

    --topbar: 48px;
    --bottombar: 28px;
    --rail: 48px;

    --radius-xs: 3px;
    --radius-sm: 5px;
    --radius-md: 7px;

    --font:
        Inter,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
}


/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: var(--bg-0);

    color: var(--text-1);

    font-family: var(--font);

    -webkit-font-smoothing: antialiased;

    touch-action: none;
}


/* =========================================================
   APPLICATION
========================================================= */

#app {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background: var(--bg-0);
}


/* =========================================================
   CAMERA
========================================================= */

#video {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    object-fit: cover;

    transform: scaleX(-1);

    opacity: 0.045;

    z-index: 0;

    pointer-events: none;

    background: #000;
}


/* =========================================================
   WORKSPACE
========================================================= */

#workspace {

    position: fixed;

    top: var(--topbar);
    left: var(--rail);
    right: 0;
    bottom: var(--bottombar);

    background: var(--bg-1);

    z-index: 1;

    overflow: hidden;
}


/* =========================================================
   GRID
========================================================= */

#grid {

    position: absolute;

    inset: 0;

    opacity: 0.085;

    pointer-events: none;

    background-image:

        linear-gradient(
            rgba(255,255,255,0.055) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,0.055) 1px,
            transparent 1px
        );

    background-size: 64px 64px;
}


/* =========================================================
   CANVAS
========================================================= */

#canvas {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    z-index: 5;

    pointer-events: none;

    display: block;
}


/* =========================================================
   TOP BAR
========================================================= */

#topbar {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: var(--topbar);

    z-index: 30;

    display: flex;

    align-items: center;

    background: var(--bg-2);

    border-bottom: 1px solid var(--line-1);
}


/* =========================================================
   BRAND
========================================================= */

#brand {

    width: var(--rail);
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    border-right: 1px solid var(--line-1);

    color: var(--text-1);

    font-size: 12px;

    font-weight: 700;

    letter-spacing: -0.4px;
}


/* =========================================================
   DOCUMENT
========================================================= */

#document {

    height: 100%;

    display: flex;

    align-items: center;

    gap: 9px;

    padding: 0 14px;
}

#documentName {

    color: var(--text-1);

    font-size: 11px;

    font-weight: 600;
}

#documentType {

    color: var(--text-4);

    font-size: 9px;

    padding-left: 9px;

    border-left: 1px solid var(--line-2);
}


/* =========================================================
   TOP ACTIONS
========================================================= */

#topActions {

    margin-left: 14px;

    display: flex;

    align-items: center;

    gap: 2px;
}

.topButton {

    height: 28px;

    padding: 0 9px;

    border: 1px solid transparent;

    background: transparent;

    color: var(--text-3);

    border-radius: var(--radius-xs);

    font-family: var(--font);

    font-size: 9px;

    cursor: default;
}

.topButton:hover {

    color: var(--text-1);

    background: var(--bg-3);

    border-color: var(--line-2);
}


/* =========================================================
   TOP STATUS
========================================================= */

#topStatus {

    margin-left: auto;

    height: 100%;

    display: flex;

    align-items: center;

    gap: 16px;

    padding: 0 14px;
}

.topStatusItem {

    display: flex;

    align-items: center;

    gap: 6px;

    color: var(--text-4);

    font-size: 8px;

    letter-spacing: 0.35px;
}

.statusDot {

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: var(--text-4);
}

.statusDot.online {
    background: var(--success);
}


/* =========================================================
   LEFT RAIL
========================================================= */

#rail {

    position: fixed;

    top: var(--topbar);
    left: 0;
    bottom: var(--bottombar);

    width: var(--rail);

    z-index: 30;

    display: flex;

    flex-direction: column;

    align-items: center;

    padding-top: 8px;

    background: var(--bg-2);

    border-right: 1px solid var(--line-1);
}

.toolGroup {

    width: 100%;

    padding-bottom: 8px;

    margin-bottom: 8px;

    border-bottom: 1px solid var(--line-1);
}

.toolGroup:last-child {
    border-bottom: none;
}

.tool {

    position: relative;

    width: 36px;
    height: 36px;

    margin: 2px auto;

    display: flex;

    align-items: center;
    justify-content: center;

    border: 1px solid transparent;

    border-radius: var(--radius-sm);

    background: transparent;

    color: var(--text-4);

    font-size: 12px;
}

.tool.active {

    background: var(--accent-bg);

    border-color: var(--accent-line);

    color: var(--accent);
}

.tool.active::before {

    content: "";

    position: absolute;

    left: -7px;

    width: 2px;
    height: 16px;

    background: var(--accent);

    border-radius: 2px;
}


/* =========================================================
   INSPECTOR
========================================================= */

#inspector {

    position: fixed;

    top: calc(var(--topbar) + 12px);

    right: 12px;

    width: 220px;

    z-index: 25;

    background: rgba(24,27,30,0.96);

    border: 1px solid var(--line-2);

    border-radius: var(--radius-md);

    overflow: hidden;
}

.inspectorHeader {

    height: 34px;

    padding: 0 11px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    border-bottom: 1px solid var(--line-1);

    color: var(--text-2);

    font-size: 9px;

    font-weight: 600;

    letter-spacing: 0.4px;

    text-transform: uppercase;
}

.closeInspector {

    color: var(--text-4);

    font-size: 12px;
}

.inspectorSection {

    padding: 10px 11px;

    border-bottom: 1px solid var(--line-1);
}

.inspectorSection:last-child {
    border-bottom: none;
}

.sectionTitle {

    margin-bottom: 8px;

    color: var(--text-4);

    font-size: 8px;

    font-weight: 600;

    letter-spacing: 0.7px;

    text-transform: uppercase;
}

.property {

    min-height: 25px;

    display: flex;

    align-items: center;

    justify-content: space-between;
}

.propertyLabel {
    color: var(--text-3);
    font-size: 9px;
}

.propertyValue {

    color: var(--text-2);

    font-size: 9px;

    font-variant-numeric: tabular-nums;
}


/* =========================================================
   WORKSPACE STATUS
========================================================= */

#workspaceStatus {

    position: fixed;

    top: calc(var(--topbar) + 10px);

    left: calc(
        var(--rail) +
        (100vw - var(--rail)) / 2
    );

    transform: translateX(-50%);

    z-index: 20;

    height: 24px;

    padding: 0 9px;

    display: flex;

    align-items: center;

    background: rgba(18,20,22,0.88);

    border: 1px solid var(--line-1);

    border-radius: var(--radius-xs);

    color: var(--text-4);

    font-size: 8px;

    letter-spacing: 0.35px;
}


/* =========================================================
   START BUTTON
========================================================= */

#startButton {

    position: fixed;

    left: calc(
        var(--rail) +
        (100vw - var(--rail)) / 2
    );

    top: calc(
        var(--topbar) +
        (
            100vh -
            var(--topbar) -
            var(--bottombar)
        ) / 2
    );

    transform: translate(-50%, -50%);

    z-index: 50;

    height: 34px;

    padding: 0 18px;

    background: var(--bg-3);

    border: 1px solid var(--line-3);

    border-radius: var(--radius-sm);

    color: var(--text-1);

    font-family: var(--font);

    font-size: 9px;

    font-weight: 600;

    letter-spacing: 0.5px;

    cursor: pointer;
}

#startButton:hover {
    background: #23272b;
}


/* =========================================================
   CURSOR
========================================================= */

#cursor {

    position: fixed;

    width: 20px;
    height: 20px;

    transform: translate(-50%, -50%);

    z-index: 15;

    border: 1px solid rgba(225,232,238,0.9);

    border-radius: 50%;

    pointer-events: none;

    box-shadow:
        0 0 0 1px
        rgba(0,0,0,0.4);
}

#cursor::before {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 3px;
    height: 3px;

    transform: translate(-50%, -50%);

    background: #edf2f6;

    border-radius: 50%;
}


/* =========================================================
   BOTTOM BAR
========================================================= */

#bottomBar {

    position: fixed;

    left: 0;
    bottom: 0;

    width: 100%;
    height: var(--bottombar);

    z-index: 30;

    display: flex;

    align-items: center;

    padding: 0 10px;

    background: var(--bg-2);

    border-top: 1px solid var(--line-1);

    color: var(--text-4);

    font-size: 8px;
}

.bottomGroup {

    height: 100%;

    display: flex;

    align-items: center;

    gap: 7px;

    padding: 0 12px;

    border-right: 1px solid var(--line-1);
}

.bottomGroup:first-child {
    padding-left: 2px;
}

.bottomGroup:last-child {

    margin-left: auto;

    padding-right: 2px;

    border-right: none;
}

.key {

    min-width: 18px;

    height: 15px;

    padding: 0 4px;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    background: var(--bg-3);

    border: 1px solid var(--line-2);

    border-radius: 3px;

    color: var(--text-3);

    font-size: 7px;
}


/* =========================================================
   HIDDEN
========================================================= */

.hidden {
    display: none !important;
}


/* =========================================================
   MOBILE / PORTRAIT
========================================================= */

@media (max-width: 700px) {

    :root {

        --topbar: 44px;
        --bottombar: 25px;
        --rail: 42px;
    }

    #documentType,
    #topActions {
        display: none;
    }

    #document {
        padding-left: 12px;
    }

    #topStatus {

        gap: 8px;

        padding-right: 9px;
    }

    #topStatus .topStatusItem {
        font-size: 7px;
    }

    #inspector {

        width: 175px;

        top: calc(
            var(--topbar) + 8px
        );

        right: 8px;
    }

    #workspaceStatus {

        top: calc(
            var(--topbar) + 8px
        );
    }

    .tool {

        width: 32px;
        height: 32px;
    }

    .tool.active::before {
        left: -5px;
    }

    .bottomGroup {
        padding: 0 7px;
    }

    .hideMobile {
        display: none;
    }

    #cursor {

        width: 18px;
        height: 18px;
    }
}


/* =========================================================
   LANDSCAPE PHONE
========================================================= */

@media
(max-width: 900px)
and (orientation: landscape) {

    :root {

        --topbar: 40px;
        --bottombar: 24px;
        --rail: 40px;
    }

    #document {
        padding-left: 9px;
    }

    #documentName {
        font-size: 10px;
    }

    #inspector {

        width: 165px;

        top: calc(
            var(--topbar) + 6px
        );

        right: 6px;
    }

    .inspectorSection {
        padding: 7px 9px;
    }

    .property {
        min-height: 21px;
    }

    .tool {

        width: 30px;
        height: 30px;
    }

    #workspaceStatus {

        top: calc(
            var(--topbar) + 7px
        );
    }
}

</style>
</head>

<script>

/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const cursor =
    document.getElementById("cursor");

const startButton =
    document.getElementById("startButton");

const workspaceStatus =
    document.getElementById("workspaceStatus");

const handState =
    document.getElementById("handState");

const modeState =
    document.getElementById("modeState");

const systemState =
    document.getElementById("systemState");

const systemIndicator =
    document.getElementById("systemIndicator");

const topStatusText =
    document.getElementById("topStatusText");


/* =========================================================
   CAMERA / SCREEN GEOMETRY
========================================================= */

let viewportWidth = 0;
let viewportHeight = 0;

let devicePixelRatioValue = 1;


/*
   MediaPipe receives the actual camera frame.

   The video is displayed using:

       object-fit: cover

   Therefore the displayed camera image can be
   cropped on either axis.

   This function calculates that crop exactly.
*/

function getVideoGeometry() {

    const vw =
        video.videoWidth ||
        1280;

    const vh =
        video.videoHeight ||
        720;

    const sw =
        window.innerWidth;

    const sh =
        window.innerHeight;


    const videoAspect =
        vw / vh;

    const screenAspect =
        sw / sh;


    let renderedWidth;
    let renderedHeight;


    if (
        screenAspect >
        videoAspect
    ) {

        renderedWidth =
            sw;

        renderedHeight =
            sw /
            videoAspect;

    }
    else {

        renderedHeight =
            sh;

        renderedWidth =
            sh *
            videoAspect;

    }


    const offsetX =
        (
            sw -
            renderedWidth
        ) / 2;

    const offsetY =
        (
            sh -
            renderedHeight
        ) / 2;


    return {

        videoWidth: vw,

        videoHeight: vh,

        renderedWidth,

        renderedHeight,

        offsetX,

        offsetY

    };
}


/* =========================================================
   CANVAS RESIZE
========================================================= */

function resizeCanvas() {

    viewportWidth =
        window.innerWidth;

    viewportHeight =
        window.innerHeight;


    devicePixelRatioValue =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    /*
       CSS size.
    */

    canvas.style.width =
        viewportWidth + "px";

    canvas.style.height =
        viewportHeight + "px";


    /*
       Internal resolution.

       The drawing engine continues using
       normal CSS-pixel coordinates.
    */

    canvas.width =
        Math.round(
            viewportWidth *
            devicePixelRatioValue
        );

    canvas.height =
        Math.round(
            viewportHeight *
            devicePixelRatioValue
        );


    ctx.setTransform(
        devicePixelRatioValue,
        0,
        0,
        devicePixelRatioValue,
        0,
        0
    );


    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";
}


/* Initial */

resizeCanvas();


window.addEventListener(
    "resize",
    function() {

        resizeCanvas();

        resetDrawingState();

    },
    {
        passive: true
    }
);


window.addEventListener(
    "orientationchange",
    function() {

        /*
           Give the browser a moment to finish
           changing the viewport dimensions.
        */

        setTimeout(
            function() {

                resizeCanvas();

                resetDrawingState();

            },
            150
        );

    },
    {
        passive: true
    }
);


/* =========================================================
   V5 DRAWING ENGINE
========================================================= */

let isDrawing = false;

let previousX = null;
let previousY = null;

let smoothX = null;
let smoothY = null;

let previousRawX = null;
let previousRawY = null;

let previousTime = null;

let currentSpeed = 0;

let currentDirection = null;

let strokeBuffer = [];


const SLOW_SMOOTHING = 0.20;

const FAST_SMOOTHING = 0.88;

const FAST_SPEED = 850;

const MAX_REASONABLE_JUMP = 400;

const MICRO_JITTER_DISTANCE = 0.65;

const MIN_POINT_DISTANCE = 1.0;

const MIN_INK_WIDTH = 2.6;

const MAX_INK_WIDTH = 5.4;

const CURVE_TENSION = 1 / 6;

let clearFrames = 0;

const CLEAR_REQUIRED_FRAMES = 5;

let clearCooldown = 0;

const CLEAR_COOLDOWN_FRAMES = 15;


/* =========================================================
   DISTANCE
========================================================= */

function distanceBetween(
    x1,
    y1,
    x2,
    y2
) {

    const dx =
        x2 - x1;

    const dy =
        y2 - y1;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


/* =========================================================
   ANGLE
========================================================= */

function angleDifference(
    a,
    b
) {

    let difference =
        a - b;

    while (
        difference > Math.PI
    ) {

        difference -=
            Math.PI * 2;
    }

    while (
        difference < -Math.PI
    ) {

        difference +=
            Math.PI * 2;
    }

    return Math.abs(
        difference
    );
}


/* =========================================================
   DIRECTION
========================================================= */

function getDirection(
    p1,
    p2
) {

    if (
        !p1 ||
        !p2
    ) {

        return null;
    }

    return Math.atan2(
        p2.y - p1.y,
        p2.x - p1.x
    );
}


/* =========================================================
   SMOOTHING
========================================================= */

function getSmoothing(
    speed,
    directionChange
) {

    if (
        speed <= 50
    ) {

        return SLOW_SMOOTHING;
    }

    if (
        speed >= FAST_SPEED
    ) {

        return FAST_SMOOTHING;
    }

    const ratio =
        (
            speed - 50
        ) /
        (
            FAST_SPEED - 50
        );

    let smoothing =
        SLOW_SMOOTHING +
        (
            FAST_SMOOTHING -
            SLOW_SMOOTHING
        ) *
        ratio;

    if (
        directionChange > 1.6
    ) {

        smoothing *= 0.78;
    }

    return Math.max(
        0.15,
        Math.min(
            smoothing,
            0.90
        )
    );
}


/* =========================================================
   SMOOTH POINT
========================================================= */

function getSmoothPoint(
    targetX,
    targetY,
    speed,
    directionChange
) {

    if (
        smoothX === null ||
        smoothY === null
    ) {

        smoothX =
            targetX;

        smoothY =
            targetY;

        return {
            x: smoothX,
            y: smoothY
        };
    }

    const smoothing =
        getSmoothing(
            speed,
            directionChange
        );

    smoothX +=
        (
            targetX -
            smoothX
        ) *
        smoothing;

    smoothY +=
        (
            targetY -
            smoothY
        ) *
        smoothing;

    return {
        x: smoothX,
        y: smoothY
    };
}


/* =========================================================
   PEN WIDTH
========================================================= */

function getPenWidth(
    speed,
    directionChange
) {

    const ratio =
        Math.min(
            speed / FAST_SPEED,
            1
        );

    let width =
        MAX_INK_WIDTH -
        (
            MAX_INK_WIDTH -
            MIN_INK_WIDTH
        ) *
        ratio;

    if (
        directionChange > 1.7
    ) {

        width *= 1.06;
    }

    return width;
}


/* =========================================================
   GLOW
========================================================= */

function getGlowAlpha(
    speed
) {

    const ratio =
        Math.min(
            speed / FAST_SPEED,
            1
        );

    return (
        0.23 -
        ratio * 0.09
    );
}


/* =========================================================
   CURVE
========================================================= */

function drawCurve(
    p0,
    p1,
    p2,
    p3,
    speed,
    directionChange
) {

    const cp1x =
        p1.x +
        (
            p2.x -
            p0.x
        ) *
        CURVE_TENSION;

    const cp1y =
        p1.y +
        (
            p2.y -
            p0.y
        ) *
        CURVE_TENSION;

    const cp2x =
        p2.x -
        (
            p3.x -
            p1.x
        ) *
        CURVE_TENSION;

    const cp2y =
        p2.y -
        (
            p3.y -
            p1.y
        ) *
        CURVE_TENSION;

    const width =
        getPenWidth(
            speed,
            directionChange
        );

    const glowAlpha =
        getGlowAlpha(
            speed
        );


    ctx.beginPath();

    ctx.moveTo(
        p1.x,
        p1.y
    );

    ctx.bezierCurveTo(
        cp1x,
        cp1y,
        cp2x,
        cp2y,
        p2.x,
        p2.y
    );

    ctx.strokeStyle =
        `rgba(120,180,225,${glowAlpha})`;

    ctx.lineWidth =
        width * 2.6;

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.shadowColor =
        "rgba(100,170,220,0.45)";

    ctx.shadowBlur =
        18;

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        p1.x,
        p1.y
    );

    ctx.bezierCurveTo(
        cp1x,
        cp1y,
        cp2x,
        cp2y,
        p2.x,
        p2.y
    );

    ctx.strokeStyle =
        "rgba(160,205,235,0.96)";

    ctx.lineWidth =
        width;

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.shadowColor =
        "rgba(100,180,230,0.55)";

    ctx.shadowBlur =
        7;

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        p1.x,
        p1.y
    );

    ctx.bezierCurveTo(
        cp1x,
        cp1y,
        cp2x,
        cp2y,
        p2.x,
        p2.y
    );

    ctx.strokeStyle =
        "rgba(245,248,250,0.88)";

    ctx.lineWidth =
        Math.max(
            1.15,
            width * 0.30
        );

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.shadowColor =
        "rgba(255,255,255,0.30)";

    ctx.shadowBlur =
        3;

    ctx.stroke();

    ctx.shadowBlur = 0;
}


/* =========================================================
   DOT
========================================================= */

function drawDot(point) {

    ctx.beginPath();

    ctx.arc(
        point.x,
        point.y,
        MAX_INK_WIDTH / 2,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "rgba(245,248,250,0.92)";

    ctx.shadowColor =
        "rgba(120,180,225,0.65)";

    ctx.shadowBlur =
        8;

    ctx.fill();

    ctx.shadowBlur = 0;
}


/* =========================================================
   ADD POINT
========================================================= */

function addStrokePoint(point) {

    const last =
        strokeBuffer[
            strokeBuffer.length - 1
        ];

    if (last) {

        const d =
            distanceBetween(
                last.x,
                last.y,
                point.x,
                point.y
            );

        if (
            d <
            MICRO_JITTER_DISTANCE
        ) {
            return;
        }

        if (
            d <
            MIN_POINT_DISTANCE
        ) {
            return;
        }
    }

    strokeBuffer.push(point);

    if (
        strokeBuffer.length === 4
    ) {

        const p0 =
            strokeBuffer[0];

        const p1 =
            strokeBuffer[1];

        const p2 =
            strokeBuffer[2];

        const p3 =
            strokeBuffer[3];

        const direction1 =
            getDirection(
                p0,
                p1
            );

        const direction2 =
            getDirection(
                p1,
                p2
            );

        let corner = 0;

        if (
            direction1 !== null &&
            direction2 !== null
        ) {

            corner =
                angleDifference(
                    direction1,
                    direction2
                );
        }

        drawCurve(
            p0,
            p0,
            p1,
            p2,
            currentSpeed,
            corner
        );

        drawCurve(
            p0,
            p1,
            p2,
            p3,
            currentSpeed,
            corner
        );

        strokeBuffer.shift();
    }
}


/* =========================================================
   FLUSH
========================================================= */

function flushStrokeBuffer() {

    const count =
        strokeBuffer.length;

    if (
        count === 0
    ) {
        return;
    }

    if (
        count === 1
    ) {

        drawDot(
            strokeBuffer[0]
        );

        return;
    }

    if (
        count === 2
    ) {

        const p0 =
            strokeBuffer[0];

        const p1 =
            strokeBuffer[1];

        ctx.beginPath();

        ctx.moveTo(
            p0.x,
            p0.y
        );

        ctx.lineTo(
            p1.x,
            p1.y
        );

        ctx.strokeStyle =
            "rgba(160,205,235,0.96)";

        ctx.lineWidth =
            MAX_INK_WIDTH;

        ctx.lineCap =
            "round";

        ctx.lineJoin =
            "round";

        ctx.stroke();

        return;
    }

    if (
        count === 3
    ) {

        const p0 =
            strokeBuffer[0];

        const p1 =
            strokeBuffer[1];

        const p2 =
            strokeBuffer[2];

        drawCurve(
            p0,
            p0,
            p1,
            p2,
            currentSpeed,
            0
        );

        drawCurve(
            p0,
            p1,
            p2,
            p2,
            currentSpeed,
            0
        );

        return;
    }

    const p0 =
        strokeBuffer[count - 3];

    const p1 =
        strokeBuffer[count - 2];

    const p2 =
        strokeBuffer[count - 1];

    drawCurve(
        p0,
        p1,
        p2,
        p2,
        currentSpeed,
        0
    );
}


/* =========================================================
   RESET
========================================================= */

function resetDrawingState() {

    isDrawing = false;

    previousX = null;
    previousY = null;

    smoothX = null;
    smoothY = null;

    previousRawX = null;
    previousRawY = null;

    previousTime = null;

    currentSpeed = 0;

    currentDirection = null;

    strokeBuffer = [];
}


/* =========================================================
   STOP
========================================================= */

function stopDrawing() {

    if (
        isDrawing
    ) {
        flushStrokeBuffer();
    }

    resetDrawingState();
}


/* =========================================================
   CLEAR
========================================================= */

function clearCanvas() {

    ctx.clearRect(
        0,
        0,
        viewportWidth,
        viewportHeight
    );

    resetDrawingState();
}


/* =========================================================
   DRAW LINE
========================================================= */

function drawLine(
    targetX,
    targetY
) {

    const now =
        performance.now();

    if (
        previousRawX === null
    ) {

        previousRawX =
            targetX;

        previousRawY =
            targetY;

        previousTime =
            now;

        smoothX =
            targetX;

        smoothY =
            targetY;

        previousX =
            targetX;

        previousY =
            targetY;

        strokeBuffer = [
            {
                x: targetX,
                y: targetY
            }
        ];

        isDrawing = true;

        return;
    }


    const rawDistance =
        distanceBetween(
            previousRawX,
            previousRawY,
            targetX,
            targetY
        );


    const deltaTime =
        Math.max(
            now -
            previousTime,
            1
        );


    const instantSpeed =
        (
            rawDistance /
            deltaTime
        ) * 1000;


    currentSpeed =
        currentSpeed * 0.65 +
        instantSpeed * 0.35;


    const newDirection =
        Math.atan2(
            targetY -
            previousRawY,
            targetX -
            previousRawX
        );


    let directionChange = 0;


    if (
        currentDirection !== null
    ) {

        directionChange =
            angleDifference(
                currentDirection,
                newDirection
            );
    }


    currentDirection =
        newDirection;


    previousRawX =
        targetX;

    previousRawY =
        targetY;

    previousTime =
        now;


    if (
        rawDistance >
        MAX_REASONABLE_JUMP
    ) {

        smoothX =
            targetX;

        smoothY =
            targetY;

        previousX =
            targetX;

        previousY =
            targetY;

        strokeBuffer = [
            {
                x: targetX,
                y: targetY
            }
        ];

        return;
    }


    const smoothPoint =
        getSmoothPoint(
            targetX,
            targetY,
            currentSpeed,
            directionChange
        );


    if (
        previousX !== null &&
        previousY !== null
    ) {

        const movement =
            distanceBetween(
                previousX,
                previousY,
                smoothPoint.x,
                smoothPoint.y
            );

        if (
            movement <
            MICRO_JITTER_DISTANCE
        ) {
            return;
        }
    }


    previousX =
        smoothPoint.x;

    previousY =
        smoothPoint.y;


    addStrokePoint({
        x: smoothPoint.x,
        y: smoothPoint.y
    });


    isDrawing = true;
}


/* =========================================================
   CURSOR
========================================================= */

function updateCursor(
    x,
    y
) {

    cursor.style.left =
        x + "px";

    cursor.style.top =
        y + "px";

    cursor.classList.remove(
        "hidden"
    );
}


function hideCursor() {

    cursor.classList.add(
        "hidden"
    );
}


/* =========================================================
   FINGER DETECTION
========================================================= */

function isFingerUp(
    landmarks,
    tip,
    pip
) {

    return (
        landmarks[tip].y <
        landmarks[pip].y
    );
}


/* =========================================================
   MEDIAPIPE
========================================================= */

const hands =
    new Hands({

        locateFile:
        function(file) {

            return (
                "https://cdn.jsdelivr.net/npm/" +
                "@mediapipe/hands/" +
                file
            );
        }

    });


hands.setOptions({

    maxNumHands: 1,

    modelComplexity: 1,

    minDetectionConfidence: 0.6,

    minTrackingConfidence: 0.6

});


/* =========================================================
   NORMALIZED CAMERA → SCREEN COORDINATES
========================================================= */

function mapHandToScreen(
    normalizedX,
    normalizedY
) {

    const geometry =
        getVideoGeometry();


    /*
       MediaPipe coordinates are based on the
       original camera frame.

       object-fit: cover enlarges that frame
       and crops the excess.

       We reproduce that exact transformation.
    */

    const displayedX =
        normalizedX *
        geometry.renderedWidth;

    const displayedY =
        normalizedY *
        geometry.renderedHeight;


    let screenX =
        displayedX +
        geometry.offsetX;

    let screenY =
        displayedY +
        geometry.offsetY;


    /*
       The displayed video is mirrored.

       MediaPipe itself gives us the original
       camera coordinate, so mirror X here.
    */

    screenX =
        window.innerWidth -
        screenX;


    /*
       Keep the coordinate inside the screen.
    */

    screenX =
        Math.max(
            0,
            Math.min(
                window.innerWidth,
                screenX
            )
        );

    screenY =
        Math.max(
            0,
            Math.min(
                window.innerHeight,
                screenY
            )
        );


    return {

        x: screenX,

        y: screenY

    };
}


/* =========================================================
   HAND RESULTS
========================================================= */

hands.onResults(
function(results) {

    if (
        clearCooldown > 0
    ) {
        clearCooldown--;
    }


    if (
        !results.multiHandLandmarks ||
        results.multiHandLandmarks.length === 0
    ) {

        handState.textContent =
            "Searching";

        modeState.textContent =
            "Standby";

        stopDrawing();

        hideCursor();

        clearFrames = 0;

        return;
    }


    const landmarks =
        results.multiHandLandmarks[0];


    const indexUp =
        isFingerUp(
            landmarks,
            8,
            6
        );

    const middleUp =
        isFingerUp(
            landmarks,
            12,
            10
        );

    const ringUp =
        isFingerUp(
            landmarks,
            16,
            14
        );

    const pinkyUp =
        isFingerUp(
            landmarks,
            20,
            18
        );


    const fingersUp =
        Number(indexUp) +
        Number(middleUp) +
        Number(ringUp) +
        Number(pinkyUp);


    const openHand =
        fingersUp >= 3;


    const thumb =
        landmarks[4];

    const indexTip =
        landmarks[8];


    const pinchDistance =
        Math.sqrt(

            Math.pow(
                thumb.x -
                indexTip.x,
                2
            ) +

            Math.pow(
                thumb.y -
                indexTip.y,
                2
            )

        );


    const isPinching =
        pinchDistance < 0.055;


    /*
       IMPORTANT:

       Do NOT directly multiply normalized
       MediaPipe coordinates by window dimensions.

       Use the camera projection function.
    */

    const screenPoint =
        mapHandToScreen(
            indexTip.x,
            indexTip.y
        );


    const x =
        screenPoint.x;

    const y =
        screenPoint.y;


    updateCursor(
        x,
        y
    );


    handState.textContent =
        "Detected";


    if (
        openHand
    ) {

        stopDrawing();

        modeState.textContent =
            "Clearing";

        clearFrames++;


        if (
            clearFrames >=
            CLEAR_REQUIRED_FRAMES
        ) {

            if (
                clearCooldown <= 0
            ) {

                clearCanvas();

                clearCooldown =
                    CLEAR_COOLDOWN_FRAMES;
            }

            clearFrames = 0;
        }

        return;
    }


    clearFrames = 0;


    if (
        isPinching
    ) {

        stopDrawing();

        modeState.textContent =
            "Paused";

        return;
    }


    if (

        indexUp &&
        !middleUp &&
        !ringUp &&
        !pinkyUp &&
        !isPinching

    ) {

        modeState.textContent =
            "Drawing";

        drawLine(
            x,
            y
        );

        return;
    }


    stopDrawing();

    modeState.textContent =
        "Standby";

});


/* =========================================================
   CAMERA
========================================================= */

let cameraInstance = null;

let cameraStarted = false;


/* =========================================================
   START CAMERA
========================================================= */

startButton.addEventListener(
"click",
async function() {

    if (
        cameraStarted
    ) {
        return;
    }


    try {

        workspaceStatus.textContent =
            "INITIALIZING CAMERA";

        systemState.textContent =
            "Starting";

        topStatusText.textContent =
            "STARTING";


        const stream =
            await navigator
            .mediaDevices
            .getUserMedia({

                video: {

                    facingMode: {
                        ideal: "user"
                    },

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }

                },

                audio: false

            });


        video.srcObject =
            stream;


        await video.play();


        /*
           Wait until the browser knows the actual
           camera dimensions.
        */

        if (
            video.readyState <
            2
        ) {

            await new Promise(
                function(resolve) {

                    video.onloadedmetadata =
                        resolve;

                }
            );

        }


        /*
           Recalculate screen/camera geometry.
        */

        resizeCanvas();


        cameraInstance =
            new Camera(
                video,
                {

                    onFrame:
                    async function() {

                        if (
                            video.readyState >= 2
                        ) {

                            await hands.send({
                                image: video
                            });

                        }

                    },

                    width: 1280,

                    height: 720

                }
            );


        cameraInstance.start();


        cameraStarted = true;


        workspaceStatus.textContent =
            "READY";

        systemState.textContent =
            "Online";

        topStatusText.textContent =
            "ONLINE";


        systemIndicator.classList.add(
            "online"
        );


        startButton.style.display =
            "none";

    }

    catch (error) {

        console.error(error);


        workspaceStatus.textContent =
            "CAMERA INITIALIZATION FAILED";

        systemState.textContent =
            "Error";

        topStatusText.textContent =
            "ERROR";


        alert(
            "Failed to start camera.\n\n" +
            error.message
        );

    }

});


/* =========================================================
   KEEP CAMERA GEOMETRY SYNCHRONIZED
========================================================= */

video.addEventListener(
    "loadedmetadata",
    function() {

        resizeCanvas();

    }
);


/* =========================================================
   INITIAL STATE
========================================================= */

workspaceStatus.textContent =
    "PRESS INITIALIZE CAMERA";

systemState.textContent =
    "Offline";

topStatusText.textContent =
    "OFFLINE";

</script>

</body>
</html>
