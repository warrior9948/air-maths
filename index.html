<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Air Maths Board</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    background: #05000a;
    font-family: Arial, sans-serif;
}


/* =========================
   CAMERA
========================= */

#video {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    object-fit: cover;

    transform: scaleX(-1);

    opacity: 0.30;

    z-index: 0;
}


/* =========================
   GRID
========================= */

#grid {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    z-index: 1;

    pointer-events: none;

    background-image:
        linear-gradient(
            rgba(180, 0, 255, 0.08) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(180, 0, 255, 0.08) 1px,
            transparent 1px
        );

    background-size: 90px 90px;

    opacity: 0.45;

    mask-image:
        radial-gradient(
            circle,
            black 20%,
            transparent 90%
        );
}


/* =========================
   CANVAS
========================= */

#canvas {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    z-index: 2;

    pointer-events: none;
}


/* =========================
   TITLE
========================= */

#title {
    position: fixed;

    top: 22px;
    left: 50%;

    transform: translateX(-50%);

    color: #ffffff;

    font-size: 20px;
    font-weight: bold;

    letter-spacing: 2px;

    z-index: 10;

    text-shadow:
        0 0 8px #ff00ff,
        0 0 20px #ff00ff;
}


/* =========================
   STATUS
========================= */

#status {
    position: fixed;

    top: 55px;
    left: 50%;

    transform: translateX(-50%);

    color: #ff66ff;

    font-size: 13px;

    letter-spacing: 1px;

    z-index: 10;
}


/* =========================
   START BUTTON
========================= */

#startButton {
    position: fixed;

    bottom: 30px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 20;

    padding: 13px 25px;

    border: 1px solid #ff00ff;

    border-radius: 30px;

    background: rgba(20,0,30,0.8);

    color: white;

    font-size: 14px;
    font-weight: bold;

    box-shadow:
        0 0 12px #ff00ff,
        inset 0 0 10px rgba(255,0,255,0.25);

    cursor: pointer;
}


/* =========================
   HUD
========================= */

#hud {
    position: fixed;

    top: 100px;
    right: 20px;

    width: 190px;

    padding: 15px;

    z-index: 10;

    border: 1px solid rgba(255,0,255,0.35);

    border-radius: 12px;

    background: rgba(10,0,20,0.55);

    backdrop-filter: blur(5px);

    color: white;

    font-size: 12px;
}


#hudHeader {
    color: #ff66ff;

    margin-bottom: 12px;

    letter-spacing: 1px;
}


.hudLine {
    display: flex;

    justify-content: space-between;

    margin: 8px 0;
}


.hudLabel {
    color: #aaa;
}


.hudValue {
    color: #ffffff;
}


#handDot {
    display: inline-block;

    width: 7px;
    height: 7px;

    margin-right: 5px;

    border-radius: 50%;

    background: #ff00ff;

    box-shadow:
        0 0 8px #ff00ff;
}


/* =========================
   GESTURE STRIP
========================= */

#gesture {
    position: fixed;

    left: 20px;
    bottom: 25px;

    z-index: 10;

    padding: 12px 15px;

    border: 1px solid rgba(255,0,255,0.3);

    border-radius: 10px;

    background: rgba(10,0,20,0.55);

    color: #ddd;

    font-size: 12px;
}


#instructionHeader {
    color: #ff66ff;

    margin-bottom: 8px;

    letter-spacing: 1px;
}


/* =========================
   CURSOR
========================= */

#cursor {
    position: fixed;

    width: 42px;
    height: 42px;

    border-radius: 50%;

    border: 2px solid #ff00ff;

    box-shadow:
        0 0 10px #ff00ff,
        0 0 25px rgba(255,0,255,0.7);

    transform:
        translate(-50%, -50%);

    z-index: 15;

    pointer-events: none;

    display: none;
}


#cursorCenter {
    position: absolute;

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #ffffff;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    box-shadow:
        0 0 8px white;
}


/* =========================
   CURSOR MARKS
========================= */

.cursorMark {
    position: fixed;

    width: 8px;
    height: 8px;

    border-color: #ff00ff;

    z-index: 15;

    pointer-events: none;

    display: none;
}


#markTop {
    border-top: 2px solid;
}


#markBottom {
    border-bottom: 2px solid;
}


#markLeft {
    border-left: 2px solid;
}


#markRight {
    border-right: 2px solid;
}

</style>
</head>


<body>


<!-- =========================
     CAMERA
========================= -->

<video
    id="video"
    autoplay
    playsinline>
</video>


<!-- =========================
     GRID
========================= -->

<div id="grid"></div>


<!-- =========================
     DRAWING CANVAS
========================= -->

<canvas id="canvas"></canvas>


<!-- =========================
     TITLE
========================= -->

<div id="title">
    ✨ AIR MATHS BOARD
</div>


<div id="status">
    Press START
</div>


<!-- =========================
     SYSTEM HUD
========================= -->

<div id="hud">

    <div id="hudHeader">
        ◈ SYSTEM STATUS
    </div>


    <div class="hudLine">

        <span>

            <span id="handDot"></span>

            <span class="hudLabel">
                HAND
            </span>

        </span>


        <span
            id="handState"
            class="hudValue">

            SEARCHING

        </span>

    </div>


    <div class="hudLine">

        <span class="hudLabel">
            MODE
        </span>


        <span
            id="modeState"
            class="hudValue">

            STANDBY

        </span>

    </div>


    <div class="hudLine">

        <span class="hudLabel">
            SYSTEM
        </span>


        <span
            id="systemState"
            class="hudValue">

            OFFLINE

        </span>

    </div>

</div>


<!-- =========================
     GESTURE GUIDE
========================= -->

<div id="gesture">

    <div id="instructionHeader">
        ◈ GESTURE
    </div>

    ☝️ <b>Draw</b>
    ·
    🤏 <b>Stop</b>
    ·
    ✋ <b>Clear</b>

</div>


<!-- =========================
     START BUTTON
========================= -->

<button id="startButton">
    START CAMERA
</button>


<!-- =========================
     CURSOR
========================= -->

<div id="cursor">

    <div id="cursorCenter"></div>

</div>


<div
    id="markTop"
    class="cursorMark">
</div>


<div
    id="markBottom"
    class="cursorMark">
</div>


<div
    id="markLeft"
    class="cursorMark">
</div>


<div
    id="markRight"
    class="cursorMark">
</div>



<!-- =========================
     MEDIAPIPE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>


<script>


/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const startButton =
    document.getElementById("startButton");

const status =
    document.getElementById("status");

const handState =
    document.getElementById("handState");

const modeState =
    document.getElementById("modeState");

const systemState =
    document.getElementById("systemState");

const cursor =
    document.getElementById("cursor");


/* =========================================================
   CANVAS SIZE
========================================================= */

function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

resizeCanvas();


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   V2 DRAWING STATE
========================================================= */

let previousX = null;
let previousY = null;

let smoothX = null;
let smoothY = null;

let isDrawing = false;


/*
    V2 tuning values.

    Smaller smoothing value:
    more stable but more lag.

    Larger value:
    faster but less smooth.
*/

const MIN_SMOOTHING = 0.32;

const MAX_SMOOTHING = 0.88;


/*
    Distance at which we consider
    movement to be very fast.
*/

const FAST_MOVEMENT = 80;


/*
    Distance between generated
    bridge points during very fast
    movement.
*/

const BRIDGE_STEP = 12;


/* =========================================================
   CLEAR STATE
========================================================= */

let clearFrames = 0;

const CLEAR_REQUIRED_FRAMES = 5;

let clearCooldown = 0;

const CLEAR_COOLDOWN_FRAMES = 15;


/* =========================================================
   RESET DRAWING STATE
========================================================= */

function resetDrawingState() {

    previousX = null;
    previousY = null;

    smoothX = null;
    smoothY = null;

    isDrawing = false;

}


/* =========================================================
   GET SMOOTHING
========================================================= */

function getSmoothing(distance) {

    /*
        Slow movement:
        more smoothing.

        Fast movement:
        less smoothing / more responsive.
    */


    if (distance <= 3) {

        return MIN_SMOOTHING;

    }


    if (distance >= FAST_MOVEMENT) {

        return MAX_SMOOTHING;

    }


    /*
        Convert distance into
        a 0 → 1 range.
    */

    const ratio =
        distance /
        FAST_MOVEMENT;


    return (
        MIN_SMOOTHING +

        (
            MAX_SMOOTHING -
            MIN_SMOOTHING
        ) *

        ratio
    );

}


/* =========================================================
   SMOOTH POINT
========================================================= */

function getSmoothPoint(
    targetX,
    targetY
) {


    /*
        First point of a stroke.
    */

    if (
        smoothX === null ||
        smoothY === null
    ) {

        smoothX = targetX;

        smoothY = targetY;

        return;

    }


    const dx =
        targetX - smoothX;

    const dy =
        targetY - smoothY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const smoothing =
        getSmoothing(distance);


    smoothX +=
        dx * smoothing;

    smoothY +=
        dy * smoothing;

}


/* =========================================================
   DRAW BASIC SEGMENT
========================================================= */

function drawSegment(
    x1,
    y1,
    x2,
    y2
) {

    ctx.beginPath();

    ctx.moveTo(
        x1,
        y1
    );

    ctx.lineTo(
        x2,
        y2
    );

    ctx.strokeStyle =
        "rgba(255,0,255,0.35)";

    ctx.lineWidth = 13;

    ctx.lineCap = "round";

    ctx.lineJoin = "round";

    ctx.shadowColor =
        "#ff00ff";

    ctx.shadowBlur = 25;

    ctx.stroke();


    /* NEON CORE */

    ctx.beginPath();

    ctx.moveTo(
        x1,
        y1
    );

    ctx.lineTo(
        x2,
        y2
    );

    ctx.strokeStyle =
        "#ff66ff";

    ctx.lineWidth = 5;

    ctx.lineCap = "round";

    ctx.lineJoin = "round";

    ctx.shadowColor =
        "#ff00ff";

    ctx.shadowBlur = 12;

    ctx.stroke();


    /* WHITE CORE */

    ctx.beginPath();

    ctx.moveTo(
        x1,
        y1
    );

    ctx.lineTo(
        x2,
        y2
    );

    ctx.strokeStyle =
        "#ffffff";

    ctx.lineWidth = 2;

    ctx.lineCap = "round";

    ctx.lineJoin = "round";

    ctx.shadowColor =
        "#ffffff";

    ctx.shadowBlur = 5;

    ctx.stroke();


    ctx.shadowBlur = 0;

}


/* =========================================================
   V2 DRAWING
========================================================= */

function drawLine(
    targetX,
    targetY
) {


    /*
        Initialize the filtered point.
    */

    if (
        smoothX === null ||
        smoothY === null
    ) {

        smoothX = targetX;

        smoothY = targetY;

        previousX = targetX;

        previousY = targetY;

        return;

    }


    /*
        Measure raw movement from
        the current filtered point.
    */

    const rawDX =
        targetX - smoothX;

    const rawDY =
        targetY - smoothY;

    const rawDistance =
        Math.sqrt(
            rawDX * rawDX +
            rawDY * rawDY
        );


    /*
        Update the filtered point.
    */

    getSmoothPoint(
        targetX,
        targetY
    );


    /*
        New filtered position.
    */

    const newX = smoothX;
    const newY = smoothY;


    /*
        Distance from previous
        drawn position.
    */

    const drawDX =
        newX - previousX;

    const drawDY =
        newY - previousY;

    const drawDistance =
        Math.sqrt(
            drawDX * drawDX +
            drawDY * drawDY
        );


    if (drawDistance < 0.8) {

        return;

    }


    /* =====================================================
       FAST MOVEMENT BRIDGE

       If the filtered point has moved
       a long distance in one frame,
       divide the movement into smaller
       segments.

       This reduces broken straight lines.
    ===================================================== */

    if (
        rawDistance > FAST_MOVEMENT &&
        drawDistance > BRIDGE_STEP
    ) {


        const steps =
            Math.ceil(
                drawDistance /
                BRIDGE_STEP
            );


        let lastX =
            previousX;

        let lastY =
            previousY;


        for (
            let i = 1;
            i <= steps;
            i++
        ) {


            const progress =
                i / steps;


            const bridgeX =
                previousX +
                (
                    newX -
                    previousX
                ) *
                progress;


            const bridgeY =
                previousY +
                (
                    newY -
                    previousY
                ) *
                progress;


            drawSegment(
                lastX,
                lastY,
                bridgeX,
                bridgeY
            );


            lastX = bridgeX;

            lastY = bridgeY;

        }


    }
    else {


        drawSegment(
            previousX,
            previousY,
            newX,
            newY
        );

    }


    previousX = newX;

    previousY = newY;

}


/* =========================================================
   STOP DRAWING
========================================================= */

function stopDrawing() {

    resetDrawingState();

}


/* =========================================================
   CLEAR CANVAS
========================================================= */

function clearCanvas() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    resetDrawingState();


    modeState.textContent =
        "CLEARED";

}


/* =========================================================
   CURSOR
========================================================= */

function updateCursor(x, y) {

    cursor.style.display =
        "block";

    cursor.style.left =
        x + "px";

    cursor.style.top =
        y + "px";

}


function hideCursor() {

    cursor.style.display =
        "none";

}


/* =========================================================
   MEDIAPIPE HANDS
========================================================= */

const hands =
    new Hands({

        locateFile:
        function(file) {

            return (

                "https://cdn.jsdelivr.net/npm/" +

                "@mediapipe/hands/" +

                file

            );

        }

    });


hands.setOptions({

    maxNumHands: 1,

    modelComplexity: 1,

    minDetectionConfidence: 0.6,

    minTrackingConfidence: 0.6

});


/* =========================================================
   FINGER DETECTION
========================================================= */

function isFingerUp(
    landmarks,
    tip,
    pip
) {

    return (
        landmarks[tip].y <
        landmarks[pip].y
    );

}


/* =========================================================
   HAND RESULTS
========================================================= */

hands.onResults(
function(results) {


    /* =====================================================
       NO HAND
    ===================================================== */

    if (
        !results.multiHandLandmarks ||

        results.multiHandLandmarks.length === 0
    ) {

        handState.textContent =
            "SEARCHING";


        modeState.textContent =
            "STANDBY";


        hideCursor();


        stopDrawing();


        clearFrames = 0;


        return;

    }


    /* =====================================================
       HAND DETECTED
    ===================================================== */

    const landmarks =
        results.multiHandLandmarks[0];


    handState.textContent =
        "DETECTED";


    /* =====================================================
       FINGERS
    ===================================================== */

    const indexUp =
        isFingerUp(
            landmarks,
            8,
            6
        );


    const middleUp =
        isFingerUp(
            landmarks,
            12,
            10
        );


    const ringUp =
        isFingerUp(
            landmarks,
            16,
            14
        );


    const pinkyUp =
        isFingerUp(
            landmarks,
            20,
            18
        );


    /* =====================================================
       OPEN HAND
    ===================================================== */

    const fingersUp =

        Number(indexUp) +

        Number(middleUp) +

        Number(ringUp) +

        Number(pinkyUp);


    const openHand =
        fingersUp >= 3;


    /* =====================================================
       PINCH
    ===================================================== */

    const indexTip =
        landmarks[8];

    const thumbTip =
        landmarks[4];


    const dx =
        thumbTip.x -
        indexTip.x;


    const dy =
        thumbTip.y -
        indexTip.y;


    const pinchDistance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const isPinching =
        pinchDistance < 0.055;


    /* =====================================================
       RAW INDEX POSITION
    ===================================================== */

    const x =
        (1 - indexTip.x) *
        window.innerWidth;


    const y =
        indexTip.y *
        window.innerHeight;


    /*
        Cursor deliberately uses RAW position.

        This keeps the cursor responsive.
    */

    updateCursor(
        x,
        y
    );


    /* =====================================================
       GESTURE PRIORITY
       
       1. CLEAR
       2. STOP
       3. DRAW
       4. READY
    ===================================================== */


    /* =====================================================
       1. CLEAR
    ===================================================== */

    if (openHand) {


        stopDrawing();


        modeState.textContent =
            "CLEARING";


        clearFrames++;


        if (
            clearFrames >=
            CLEAR_REQUIRED_FRAMES
        ) {


            if (
                clearCooldown <= 0
            ) {

                clearCanvas();


                clearCooldown =
                    CLEAR_COOLDOWN_FRAMES;

            }


            clearFrames = 0;

        }


        return;

    }


    clearFrames = 0;


    if (
        clearCooldown > 0
    ) {

        clearCooldown--;

    }


    /* =====================================================
       2. PINCH = STOP
    ===================================================== */

    if (isPinching) {


        stopDrawing();


        modeState.textContent =
            "STOPPED";


        return;

    }


    /* =====================================================
       3. DRAW
    ===================================================== */

    if (

        indexUp &&

        !middleUp &&

        !ringUp &&

        !pinkyUp &&

        !isPinching

    ) {


        modeState.textContent =
            "DRAWING";


        if (!isDrawing) {


            isDrawing = true;


            /*
                Reset V2 smoothing
                at the beginning of
                every stroke.
            */

            smoothX = x;

            smoothY = y;


            previousX = x;

            previousY = y;


        }
        else {


            drawLine(
                x,
                y
            );


        }


        return;

    }


    /* =====================================================
       4. READY
    ===================================================== */

    stopDrawing();


    modeState.textContent =
        "READY";


});


/* =========================================================
   START CAMERA
========================================================= */

async function startCamera() {

    try {


        status.textContent =
            "Starting camera...";


        const stream =
            await navigator.mediaDevices
            .getUserMedia({

                video: {
                    facingMode: "user"
                },

                audio: false

            });


        video.srcObject =
            stream;


        await video.play();


        systemState.textContent =
            "ONLINE";


        status.textContent =
            "Camera Ready";


        startButton.style.display =
            "none";


        const camera =
            new Camera(

                video,

                {

                    onFrame:
                    async function() {

                        await hands.send({
                            image: video
                        });

                    },

                    width: 1280,

                    height: 720

                }

            );


        camera.start();


    }

    catch(error) {


        console.error(error);


        systemState.textContent =
            "ERROR";


        status.textContent =
            "Camera Failed";


        alert(

            "Could not start camera.\n\n" +

            error.message

        );

    }

}


/* =========================================================
   START BUTTON
========================================================= */

startButton.addEventListener(
    "click",
    startCamera
);


</script>

</body>
</html>
