<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Air Maths Board — V5 Advanced</title>

<style>

/* =========================================================
   BASE
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05000a;
    font-family: Arial, sans-serif;
}


/* =========================================================
   CAMERA
========================================================= */

#video {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);

    opacity: 0.30;

    z-index: 0;
}


/* =========================================================
   GRID
========================================================= */

#grid {
    position: fixed;
    inset: 0;

    z-index: 1;

    pointer-events: none;

    opacity: 0.45;

    background-image:
        linear-gradient(
            rgba(180, 80, 255, 0.12) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(180, 80, 255, 0.12) 1px,
            transparent 1px
        );

    background-size: 90px 90px;

    -webkit-mask-image:
        radial-gradient(
            ellipse at center,
            black 30%,
            transparent 95%
        );

    mask-image:
        radial-gradient(
            ellipse at center,
            black 30%,
            transparent 95%
        );
}


/* =========================================================
   STAGE 2 — TASK 1 ADDITIONS
   FUTURISTIC BACKGROUND
========================================================= */

#ambientGlow {
    position: fixed;

    inset: -20%;

    z-index: 1;

    pointer-events: none;

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(255, 0, 255, 0.12),
            transparent 32%
        );

    animation:
        ambientPulse 7s ease-in-out infinite alternate;
}


/* =========================================================
   PARTICLE FIELD
========================================================= */

#particles {
    position: fixed;

    inset: 0;

    z-index: 1;

    pointer-events: none;

    overflow: hidden;
}


.stage2Particle {
    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background:
        rgba(255, 255, 255, 0.65);

    box-shadow:
        0 0 5px
        rgba(255, 0, 255, 0.8);

    pointer-events: none;

    animation:
        stage2ParticleFloat
        linear infinite;
}


/* =========================================================
   SCAN LINE
========================================================= */

#scanLine {
    position: fixed;

    left: 0;

    width: 100%;

    height: 1px;

    top: -5%;

    z-index: 1;

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255, 0, 255, 0.75),
            transparent
        );

    box-shadow:
        0 0 12px
        rgba(255, 0, 255, 0.5);

    opacity: 0.2;

    animation:
        stage2Scan 9s linear infinite;
}


/* =========================================================
   BACKGROUND VIGNETTE
========================================================= */

#vignette {
    position: fixed;

    inset: 0;

    z-index: 1;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 45%,
            rgba(0, 0, 0, 0.35) 100%
        );
}


/* =========================================================
   STAGE 2 TASK 1 ANIMATIONS
========================================================= */

@keyframes ambientPulse {

    from {
        transform:
            scale(0.96);

        opacity: 0.7;
    }

    to {
        transform:
            scale(1.04);

        opacity: 1;
    }
}


@keyframes stage2ParticleFloat {

    0% {
        transform:
            translate3d(
                0,
                0,
                0
            );

        opacity: 0;
    }

    15% {
        opacity: 0.5;
    }

    50% {
        opacity: 0.8;
    }

    85% {
        opacity: 0.35;
    }

    100% {
        transform:
            translate3d(
                var(--particle-x),
                var(--particle-y),
                0
            );

        opacity: 0;
    }
}


@keyframes stage2Scan {

    0% {
        top: -5%;
        opacity: 0;
    }

    10% {
        opacity: 0.2;
    }

    90% {
        opacity: 0.2;
    }

    100% {
        top: 105%;
        opacity: 0;
    }
}


/* =========================================================
   STAGE 2 TASK 1 — MOBILE ADDITION
========================================================= */

@media (max-width: 600px) {

    #ambientGlow {
        opacity: 0.75;
    }

    #scanLine {
        opacity: 0.12;
    }

    .stage2Particle {
        width: 1.5px;
        height: 1.5px;
    }
}


/* =========================================================
   DRAWING CANVAS
========================================================= */

#canvas {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 2;

    pointer-events: none;
}


/* =========================================================
   TITLE
========================================================= */

#title {
    position: fixed;

    top: 20px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 10;

    color: white;

    font-size: 22px;
    font-weight: bold;

    letter-spacing: 3px;

    text-shadow:
        0 0 8px #ff00ff,
        0 0 18px #ff00ff,
        0 0 30px rgba(255, 0, 255, 0.7);
}


/* =========================================================
   STATUS
========================================================= */

#status {
    position: fixed;

    top: 55px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 10;

    color: #e8b8ff;

    font-size: 12px;

    letter-spacing: 2px;
}


/* =========================================================
   SYSTEM HUD
========================================================= */

#hud {
    position: fixed;

    top: 20px;
    left: 20px;

    z-index: 10;

    min-width: 190px;

    padding: 14px 16px;

    border:
        1px solid
        rgba(255, 0, 255, 0.35);

    border-radius: 12px;

    background:
        rgba(15, 0, 25, 0.65);

    backdrop-filter: blur(10px);

    box-shadow:
        0 0 20px
        rgba(255, 0, 255, 0.12);

    color: white;
}

#hudHeader {
    color: #ff7dff;

    font-size: 11px;

    letter-spacing: 2px;

    margin-bottom: 10px;
}

.hudLine {
    display: flex;

    justify-content: space-between;

    gap: 20px;

    margin-top: 7px;

    font-size: 10px;
}

.hudLabel {
    color: #b78fc9;

    letter-spacing: 1px;
}

.hudValue {
    color: #ffffff;

    letter-spacing: 1px;
}

#handDot {
    display: inline-block;

    width: 7px;
    height: 7px;

    margin-right: 6px;

    border-radius: 50%;

    background: #555;

    box-shadow: 0 0 5px #555;
}


/* =========================================================
   GESTURE PANEL
========================================================= */

#gesture {
    position: fixed;

    bottom: 25px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 10;

    padding: 12px 18px;

    border:
        1px solid
        rgba(255, 0, 255, 0.35);

    border-radius: 12px;

    background:
        rgba(15, 0, 25, 0.65);

    backdrop-filter: blur(10px);

    color: #ddd;

    font-size: 12px;

    letter-spacing: 1px;

    text-align: center;

    white-space: nowrap;
}

#instructionHeader {
    color: #ff7dff;

    font-size: 10px;

    letter-spacing: 2px;

    margin-bottom: 7px;
}


/* =========================================================
   START BUTTON
========================================================= */

#startButton {
    position: fixed;

    bottom: 85px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 10;

    padding: 12px 24px;

    border:
        1px solid
        rgba(255, 0, 255, 0.6);

    border-radius: 30px;

    background:
        rgba(20, 0, 35, 0.8);

    color: white;

    font-size: 12px;

    letter-spacing: 2px;

    cursor: pointer;

    box-shadow:
        0 0 12px
        rgba(255, 0, 255, 0.25);
}


/* =========================================================
   CURSOR
========================================================= */

#cursor {
    position: fixed;

    width: 42px;
    height: 42px;

    border:
        2px solid #ff00ff;

    border-radius: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 8;

    pointer-events: none;

    box-shadow:
        0 0 8px #ff00ff,
        0 0 18px rgba(255, 0, 255, 0.7);
}

#cursor::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 6px;
    height: 6px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: #ffffff;

    box-shadow:
        0 0 8px #ffffff;
}


/* =========================================================
   CURSOR MARKERS
========================================================= */

.cursorMark {
    position: fixed;

    width: 8px;
    height: 8px;

    z-index: 9;

    border-color: #ff00ff;

    pointer-events: none;
}

#markTop {
    border-top: 2px solid;
    border-left: 2px solid;
}

#markBottom {
    border-bottom: 2px solid;
    border-right: 2px solid;
}

#markLeft {
    border-left: 2px solid;
    border-bottom: 2px solid;
}

#markRight {
    border-right: 2px solid;
    border-top: 2px solid;
}

.hidden {
    display: none !important;
}

</style>
</head>


<body>


<!-- =======================================================
     CAMERA
======================================================== -->

<video id="video"
       autoplay
       playsinline>
</video>


<!-- =======================================================
     GRID
======================================================== -->

<div id="grid"></div>


<!-- =======================================================
     STAGE 2 — TASK 1 ADDITIONS
======================================================== -->

<div id="ambientGlow"></div>

<div id="particles"></div>

<div id="scanLine"></div>

<div id="vignette"></div>


<!-- =======================================================
     DRAWING CANVAS
======================================================== -->

<canvas id="canvas"></canvas>


<!-- =======================================================
     CURSOR
======================================================== -->

<div id="cursor"
     class="hidden">
</div>


<!-- =======================================================
     CORNER MARKERS
======================================================== -->

<div id="markTop"
     class="cursorMark hidden">
</div>

<div id="markBottom"
     class="cursorMark hidden">
</div>

<div id="markLeft"
     class="cursorMark hidden">
</div>

<div id="markRight"
     class="cursorMark hidden">
</div>


<!-- =======================================================
     TITLE
======================================================== -->

<div id="title">
    ✨ AIR MATHS BOARD
</div>


<div id="status">
    Press START
</div>


<!-- =======================================================
     HUD
======================================================== -->

<div id="hud">

    <div id="hudHeader">
        ◈ SYSTEM STATUS
    </div>

    <div class="hudLine">

        <span>

            <span id="handDot"></span>

            <span class="hudLabel">
                HAND
            </span>

        </span>

        <span id="handState"
              class="hudValue">
            SEARCHING
        </span>

    </div>


    <div class="hudLine">

        <span class="hudLabel">
            MODE
        </span>

        <span id="modeState"
              class="hudValue">
            STANDBY
        </span>

    </div>


    <div class="hudLine">

        <span class="hudLabel">
            SYSTEM
        </span>

        <span id="systemState"
              class="hudValue">
            OFFLINE
        </span>

    </div>

</div>


<!-- =======================================================
     GESTURE GUIDE
======================================================== -->

<div id="gesture">

    <div id="instructionHeader">
        ◈ GESTURE
    </div>

    ☝️ <b>Draw</b>
    ·
    🤏 <b>Stop</b>
    ·
    ✋ <b>Clear</b>

</div>


<!-- =======================================================
     START
======================================================== -->

<button id="startButton">
    START CAMERA
</button>


<!-- =======================================================
     MEDIAPIPE
======================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const cursor =
    document.getElementById("cursor");

const startButton =
    document.getElementById("startButton");

const statusText =
    document.getElementById("status");

const handState =
    document.getElementById("handState");

const modeState =
    document.getElementById("modeState");

const systemState =
    document.getElementById("systemState");

const handDot =
    document.getElementById("handDot");


/* =========================================================
   CANVAS SETUP
========================================================= */

function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   DRAWING STATE
========================================================= */

let isDrawing = false;

let previousX = null;
let previousY = null;

let smoothX = null;
let smoothY = null;

let previousRawX = null;
let previousRawY = null;

let previousTime = null;

let currentSpeed = 0;

let currentDirection = null;

let strokeBuffer = [];


/* =========================================================
   ADVANCED SETTINGS
========================================================= */


/* Dynamic stabilization */

const SLOW_SMOOTHING = 0.20;

const FAST_SMOOTHING = 0.88;

const FAST_SPEED = 850;


/* Jump protection */

const MAX_REASONABLE_JUMP = 400;


/* Noise filtering */

const MICRO_JITTER_DISTANCE = 0.65;

const MIN_POINT_DISTANCE = 1.0;


/* Ink */

const MIN_INK_WIDTH = 2.6;

const MAX_INK_WIDTH = 5.4;


/* Catmull-Rom → Bezier */

const CURVE_TENSION = 1 / 6;


/* Clear */

let clearFrames = 0;

const CLEAR_REQUIRED_FRAMES = 5;

let clearCooldown = 0;

const CLEAR_COOLDOWN_FRAMES = 15;


/* =========================================================
   DISTANCE
========================================================= */

function distanceBetween(
    x1,
    y1,
    x2,
    y2
) {

    const dx =
        x2 - x1;

    const dy =
        y2 - y1;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


/* =========================================================
   ANGLE DIFFERENCE
========================================================= */

function angleDifference(
    a,
    b
) {

    let difference =
        a - b;


    while (
        difference > Math.PI
    ) {

        difference -=
            Math.PI * 2;
    }


    while (
        difference < -Math.PI
    ) {

        difference +=
            Math.PI * 2;
    }


    return Math.abs(
        difference
    );
}


/* =========================================================
   DIRECTION
========================================================= */

function getDirection(
    p1,
    p2
) {

    if (
        !p1 ||
        !p2
    ) {

        return null;
    }


    return Math.atan2(

        p2.y - p1.y,

        p2.x - p1.x

    );
}


/* =========================================================
   ADAPTIVE SMOOTHING
========================================================= */

function getSmoothing(
    speed,
    directionChange
) {

    if (
        speed <= 50
    ) {

        return SLOW_SMOOTHING;
    }


    if (
        speed >= FAST_SPEED
    ) {

        return FAST_SMOOTHING;
    }


    const ratio =
        (
            speed - 50
        ) /
        (
            FAST_SPEED - 50
        );


    let smoothing =
        SLOW_SMOOTHING +

        (
            FAST_SMOOTHING -
            SLOW_SMOOTHING
        ) *

        ratio;


    /*
        Extra stabilization at sharp
        direction changes.
    */

    if (
        directionChange > 1.6
    ) {

        smoothing *= 0.78;
    }


    return Math.max(
        0.15,
        Math.min(
            smoothing,
            0.90
        )
    );
}


/* =========================================================
   SMOOTH POINT
========================================================= */

function getSmoothPoint(
    targetX,
    targetY,
    speed,
    directionChange
) {

    if (
        smoothX === null ||
        smoothY === null
    ) {

        smoothX =
            targetX;

        smoothY =
            targetY;


        return {
            x: smoothX,
            y: smoothY
        };
    }


    const smoothing =
        getSmoothing(
            speed,
            directionChange
        );


    smoothX +=
        (
            targetX -
            smoothX
        ) *
        smoothing;


    smoothY +=
        (
            targetY -
            smoothY
        ) *
        smoothing;


    return {
        x: smoothX,
        y: smoothY
    };
}


/* =========================================================
   DYNAMIC PEN WIDTH
========================================================= */

function getPenWidth(
    speed,
    directionChange
) {

    const ratio =
        Math.min(
            speed / FAST_SPEED,
            1
        );


    let width =
        MAX_INK_WIDTH -

        (
            MAX_INK_WIDTH -
            MIN_INK_WIDTH
        ) *

        ratio;


    /*
        Slightly strengthen sharp corners.
    */

    if (
        directionChange > 1.7
    ) {

        width *= 1.06;
    }


    return width;
}


/* =========================================================
   NATURAL GLOW
========================================================= */

function getGlowAlpha(
    speed
) {

    const ratio =
        Math.min(
            speed / FAST_SPEED,
            1
        );


    return (
        0.23 -
        ratio * 0.09
    );
}


/* =========================================================
   DRAW CATMULL-ROM / BEZIER CURVE
========================================================= */

function drawCurve(
    p0,
    p1,
    p2,
    p3,
    speed,
    directionChange
) {

    const cp1x =
        p1.x +
        (
            p2.x -
            p0.x
        ) *
        CURVE_TENSION;


    const cp1y =
        p1.y +
        (
            p2.y -
            p0.y
        ) *
        CURVE_TENSION;


    const cp2x =
        p2.x -
        (
            p3.x -
            p1.x
        ) *
        CURVE_TENSION;


    const cp2y =
        p2.y -
        (
            p3.y -
            p1.y
        ) *
        CURVE_TENSION;


    const width =
        getPenWidth(
            speed,
            directionChange
        );


    const glowAlpha =
        getGlowAlpha(
            speed
        );


    /* -----------------------------------------------------
       GLOW
    ----------------------------------------------------- */

    ctx.beginPath();

    ctx.moveTo(
        p1.x,
        p1.y
    );

    ctx.bezierCurveTo(

        cp1x,
        cp1y,

        cp2x,
        cp2y,

        p2.x,
        p2.y

    );


    ctx.strokeStyle =
        `rgba(255,0,255,${glowAlpha})`;

    ctx.lineWidth =
        width * 2.6;

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.shadowColor =
        "rgba(255,0,255,0.60)";

    ctx.shadowBlur =
        20;

    ctx.stroke();


    /* -----------------------------------------------------
       MAIN INK
    ----------------------------------------------------- */

    ctx.beginPath();

    ctx.moveTo(
        p1.x,
        p1.y
    );

    ctx.bezierCurveTo(

        cp1x,
        cp1y,

        cp2x,
        cp2y,

        p2.x,
        p2.y

    );


    ctx.strokeStyle =
        "rgba(255,65,255,0.96)";

    ctx.lineWidth =
        width;

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.shadowColor =
        "rgba(255,0,255,0.85)";

    ctx.shadowBlur =
        9;

    ctx.stroke();


    /* -----------------------------------------------------
       WHITE DIGITAL CORE
    ----------------------------------------------------- */

    ctx.beginPath();

    ctx.moveTo(
        p1.x,
        p1.y
    );

    ctx.bezierCurveTo(

        cp1x,
        cp1y,

        cp2x,
        cp2y,

        p2.x,
        p2.y

    );


    ctx.strokeStyle =
        "rgba(255,255,255,0.88)";

    ctx.lineWidth =
        Math.max(
            1.15,
            width * 0.30
        );

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.shadowColor =
        "rgba(255,255,255,0.45)";

    ctx.shadowBlur =
        3;

    ctx.stroke();


    ctx.shadowBlur = 0;
}


/* =========================================================
   DOT
========================================================= */

function drawDot(
    point
) {

    ctx.beginPath();

    ctx.arc(
        point.x,
        point.y,
        MAX_INK_WIDTH / 2,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "rgba(255,255,255,0.92)";

    ctx.shadowColor =
        "#ff00ff";

    ctx.shadowBlur =
        9;

    ctx.fill();

    ctx.shadowBlur = 0;
}


/* =========================================================
   ADD POINT
========================================================= */

function addStrokePoint(
    point
) {

    const last =
        strokeBuffer[
            strokeBuffer.length - 1
        ];


    if (last) {

        const d =
            distanceBetween(

                last.x,
                last.y,

                point.x,
                point.y
            );


        if (
            d <
            MICRO_JITTER_DISTANCE
        ) {

            return;
        }


        if (
            d <
            MIN_POINT_DISTANCE
        ) {

            return;
        }
    }


    strokeBuffer.push(
        point
    );


    /*
        Four points:

        A B C D

        Draw A→B and B→C.

        Keep B C D.
    */

    if (
        strokeBuffer.length === 4
    ) {

        const p0 =
            strokeBuffer[0];

        const p1 =
            strokeBuffer[1];

        const p2 =
            strokeBuffer[2];

        const p3 =
            strokeBuffer[3];


        const direction1 =
            getDirection(
                p0,
                p1
            );


        const direction2 =
            getDirection(
                p1,
                p2
            );


        let corner =
            0;


        if (
            direction1 !== null &&
            direction2 !== null
        ) {

            corner =
                angleDifference(
                    direction1,
                    direction2
                );
        }


        /*
            Beginning segment.
        */

        drawCurve(

            p0,
            p0,
            p1,
            p2,

            currentSpeed,
            corner

        );


        /*
            Main segment.
        */

        drawCurve(

            p0,
            p1,
            p2,
            p3,

            currentSpeed,
            corner

        );


        strokeBuffer.shift();
    }
}


/* =========================================================
   FLUSH FINAL POINTS
========================================================= */

function flushStrokeBuffer() {

    const count =
        strokeBuffer.length;


    if (
        count === 0
    ) {

        return;
    }


    /*
        Single point.
    */

    if (
        count === 1
    ) {

        drawDot(
            strokeBuffer[0]
        );

        return;
    }


    /*
        Two points.
    */

    if (
        count === 2
    ) {

        const p0 =
            strokeBuffer[0];

        const p1 =
            strokeBuffer[1];


        ctx.beginPath();

        ctx.moveTo(
            p0.x,
            p0.y
        );

        ctx.lineTo(
            p1.x,
            p1.y
        );


        ctx.strokeStyle =
            "rgba(255,65,255,0.96)";

        ctx.lineWidth =
            MAX_INK_WIDTH;

        ctx.lineCap =
            "round";

        ctx.lineJoin =
            "round";

        ctx.shadowColor =
            "rgba(255,0,255,0.80)";

        ctx.shadowBlur =
            9;

        ctx.stroke();

        ctx.shadowBlur = 0;

        return;
    }


    /*
        Three points.

        Complete both remaining curve
        sections.
    */

    if (
        count === 3
    ) {

        const p0 =
            strokeBuffer[0];

        const p1 =
            strokeBuffer[1];

        const p2 =
            strokeBuffer[2];


        drawCurve(

            p0,
            p0,
            p1,
            p2,

            currentSpeed,
            0

        );


        drawCurve(

            p0,
            p1,
            p2,
            p2,

            currentSpeed,
            0

        );


        return;
    }


    /*
        Normally only the final segment
        remains.
    */

    const p0 =
        strokeBuffer[
            count - 3
        ];

    const p1 =
        strokeBuffer[
            count - 2
        ];

    const p2 =
        strokeBuffer[
            count - 1
        ];


    drawCurve(

        p0,
        p1,
        p2,
        p2,

        currentSpeed,
        0

    );
}


/* =========================================================
   RESET
========================================================= */

function resetDrawingState() {

    isDrawing = false;

    previousX = null;
    previousY = null;

    smoothX = null;
    smoothY = null;

    previousRawX = null;
    previousRawY = null;

    previousTime = null;

    currentSpeed = 0;

    currentDirection = null;

    strokeBuffer = [];
}


/* =========================================================
   STOP
========================================================= */

function stopDrawing() {

    if (
        isDrawing
    ) {

        flushStrokeBuffer();
    }


    resetDrawingState();
}


/* =========================================================
   CLEAR CANVAS
========================================================= */

function clearCanvas() {

    ctx.clearRect(

        0,
        0,

        canvas.width,
        canvas.height

    );


    resetDrawingState();
}


/* =========================================================
   MAIN DRAW FUNCTION
========================================================= */

function drawLine(
    targetX,
    targetY
) {

    const now =
        performance.now();


    /*
        First point.
    */

    if (
        previousRawX === null
    ) {

        previousRawX =
            targetX;

        previousRawY =
            targetY;

        previousTime =
            now;


        smoothX =
            targetX;

        smoothY =
            targetY;


        previousX =
            targetX;

        previousY =
            targetY;


        currentDirection =
            null;


        strokeBuffer = [

            {
                x: targetX,
                y: targetY
            }

        ];


        isDrawing = true;

        return;
    }


    /*
        Raw distance.
    */

    const rawDistance =
        distanceBetween(

            previousRawX,
            previousRawY,

            targetX,
            targetY
        );


    /*
        Time.
    */

    const deltaTime =
        Math.max(

            now -
            previousTime,

            1
        );


    /*
        Instant speed.
    */

    const instantSpeed =
        (
            rawDistance /
            deltaTime
        ) *
        1000;


    /*
        Smoothed speed.
    */

    currentSpeed =

        currentSpeed *
        0.65 +

        instantSpeed *
        0.35;


    /*
        Calculate direction BEFORE
        replacing raw position.
    */

    const newDirection =
        Math.atan2(

            targetY -
            previousRawY,

            targetX -
            previousRawX

        );


    let directionChange = 0;


    if (
        currentDirection !== null
    ) {

        directionChange =
            angleDifference(

                currentDirection,
                newDirection

            );
    }


    currentDirection =
        newDirection;


    /*
        Update raw position.
    */

    previousRawX =
        targetX;

    previousRawY =
        targetY;

    previousTime =
        now;


    /*
        Jump protection.
    */

    if (
        rawDistance >
        MAX_REASONABLE_JUMP
    ) {

        smoothX =
            targetX;

        smoothY =
            targetY;


        previousX =
            targetX;

        previousY =
            targetY;


        strokeBuffer = [

            {
                x: targetX,
                y: targetY
            }

        ];


        return;
    }


    /*
        Dynamic stabilization.
    */

    const smoothPoint =
        getSmoothPoint(

            targetX,
            targetY,

            currentSpeed,
            directionChange
        );


    /*
        Micro-jitter suppression.
    */

    if (
        previousX !== null &&
        previousY !== null
    ) {

        const movement =
            distanceBetween(

                previousX,
                previousY,

                smoothPoint.x,
                smoothPoint.y

            );


        if (
            movement <
            MICRO_JITTER_DISTANCE
        ) {

            return;
        }
    }


    previousX =
        smoothPoint.x;

    previousY =
        smoothPoint.y;


    /*
        Add filtered point.
    */

    addStrokePoint({

        x: smoothPoint.x,

        y: smoothPoint.y

    });


    isDrawing = true;
}


/* =========================================================
   CURSOR
========================================================= */

function updateCursor(
    x,
    y
) {

    cursor.style.left =
        x + "px";

    cursor.style.top =
        y + "px";


    cursor.classList.remove(
        "hidden"
    );
}


function hideCursor() {

    cursor.classList.add(
        "hidden"
    );
}


/* =========================================================
   FINGER DETECTION
========================================================= */

function isFingerUp(
    landmarks,
    tip,
    pip
) {

    return (
        landmarks[tip].y <
        landmarks[pip].y
    );
}


/* =========================================================
   MEDIAPIPE HANDS
========================================================= */

const hands =
    new Hands({

        locateFile:
        function(file) {

            return (

                "https://cdn.jsdelivr.net/npm/" +
                "@mediapipe/hands/" +
                file

            );
        }

    });


hands.setOptions({

    maxNumHands: 1,

    modelComplexity: 1,

    minDetectionConfidence: 0.6,

    minTrackingConfidence: 0.6

});


/* =========================================================
   HAND RESULTS
========================================================= */

hands.onResults(
function(results) {


    /*
        Cooldown.
    */

    if (
        clearCooldown > 0
    ) {

        clearCooldown--;
    }


    /*
        NO HAND
    */

    if (

        !results.multiHandLandmarks ||

        results.multiHandLandmarks.length === 0

    ) {

        handState.textContent =
            "SEARCHING";


        modeState.textContent =
            "STANDBY";


        handDot.style.background =
            "#555";


        handDot.style.boxShadow =
            "0 0 5px #555";


        stopDrawing();


        hideCursor();


        clearFrames = 0;


        return;
    }


    const landmarks =
        results.multiHandLandmarks[0];


    /*
        INDEX
    */

    const indexUp =
        isFingerUp(
            landmarks,
            8,
            6
        );


    /*
        MIDDLE
    */

    const middleUp =
        isFingerUp(
            landmarks,
            12,
            10
        );


    /*
        RING
    */

    const ringUp =
        isFingerUp(
            landmarks,
            16,
            14
        );


    /*
        PINKY
    */

    const pinkyUp =
        isFingerUp(
            landmarks,
            20,
            18
        );


    /*
        OPEN HAND
    */

    const fingersUp =

        Number(indexUp) +
        Number(middleUp) +
        Number(ringUp) +
        Number(pinkyUp);


    const openHand =
        fingersUp >= 3;


    /*
        PINCH
    */

    const thumb =
        landmarks[4];

    const indexTip =
        landmarks[8];


    const pinchDistance =
        Math.sqrt(

            Math.pow(
                thumb.x -
                indexTip.x,
                2
            ) +

            Math.pow(
                thumb.y -
                indexTip.y,
                2
            )

        );


    const isPinching =
        pinchDistance < 0.055;


    /*
        CURSOR POSITION
    */

    const x =
        (
            1 -
            indexTip.x
        ) *
        window.innerWidth;


    const y =
        indexTip.y *
        window.innerHeight;


    updateCursor(
        x,
        y
    );


    handState.textContent =
        "DETECTED";


    handDot.style.background =
        "#ff00ff";


    handDot.style.boxShadow =
        "0 0 8px #ff00ff";


    /* =====================================================
       CLEAR
       HIGHEST PRIORITY
    ===================================================== */

    if (
        openHand
    ) {

        stopDrawing();


        modeState.textContent =
            "CLEARING";


        clearFrames++;


        if (
            clearFrames >=
            CLEAR_REQUIRED_FRAMES
        ) {

            if (
                clearCooldown <= 0
            ) {

                clearCanvas();


                clearCooldown =
                    CLEAR_COOLDOWN_FRAMES;
            }


            clearFrames = 0;
        }


        return;
    }


    clearFrames = 0;


    /* =====================================================
       PINCH
       STOP DRAWING
    ===================================================== */

    if (
        isPinching
    ) {

        stopDrawing();


        modeState.textContent =
            "STOP";


        return;
    }


    /* =====================================================
       INDEX ONLY
       DRAW
    ===================================================== */

    if (

        indexUp &&

        !middleUp &&

        !ringUp &&

        !pinkyUp &&

        !isPinching

    ) {

        modeState.textContent =
            "DRAW";


        drawLine(
            x,
            y
        );


        return;
    }


    /*
        Unknown pose.
    */

    stopDrawing();


    modeState.textContent =
        "STANDBY";

});


/* =========================================================
   START CAMERA
========================================================= */

startButton.addEventListener(
"click",
async function() {

    try {

        statusText.textContent =
            "Starting camera...";


        systemState.textContent =
            "STARTING";


        const stream =
            await navigator
            .mediaDevices
            .getUserMedia({

                video: {

                    facingMode:
                        "user"

                },

                audio: false

            });


        video.srcObject =
            stream;


        const camera =
            new Camera(

                video,

                {

                    onFrame:
                    async function() {

                        await hands.send({

                            image:
                                video

                        });

                    },


                    width: 1280,

                    height: 720

                }

            );


        camera.start();


        statusText.textContent =
            "SYSTEM READY";


        systemState.textContent =
            "ONLINE";


        startButton.style.display =
            "none";

    }
    catch (error) {

        console.error(
            error
        );


        statusText.textContent =
            "CAMERA ERROR";


        systemState.textContent =
            "ERROR";


        alert(

            "Failed to start camera.\n\n" +
            error.message

        );
    }

});


/* =========================================================
   STAGE 2 — TASK 1 ADDITION
   PARTICLE SYSTEM
========================================================= */

const stage2Particles =
    document.getElementById("particles");


function createStage2Particles() {

    stage2Particles.innerHTML = "";


    const particleCount =
        window.innerWidth < 600
            ? 18
            : 30;


    for (
        let i = 0;
        i < particleCount;
        i++
    ) {

        const particle =
            document.createElement("div");


        particle.className =
            "stage2Particle";


        particle.style.left =
            Math.random() * 100 + "%";


        particle.style.top =
            Math.random() * 100 + "%";


        particle.style.setProperty(
            "--particle-x",
            (
                Math.random() * 160 - 80
            ) + "px"
        );


        particle.style.setProperty(
            "--particle-y",
            (
                Math.random() * -180 - 30
            ) + "px"
        );


        particle.style.animationDuration =
            (
                6 +
                Math.random() * 10
            ) + "s";


        particle.style.animationDelay =
            (
                Math.random() * -12
            ) + "s";


        stage2Particles.appendChild(
            particle
        );
    }
}


createStage2Particles();


window.addEventListener(
    "resize",
    createStage2Particles
);

</script>
