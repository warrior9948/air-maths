<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Air Maths Board</title>

<style>

/* ============================= */
/* BASIC                         */
/* ============================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #05000d;

    font-family: Arial, sans-serif;
}


/* ============================= */
/* CAMERA                        */
/* ============================= */

#camera {

    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    object-fit: cover;

    transform: scaleX(-1);

    opacity: 0.30;

    z-index: 0;
}


/* ============================= */
/* GRID                          */
/* ============================= */

#grid {

    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    z-index: 1;

    pointer-events: none;

    background-image:

        linear-gradient(
            rgba(180, 80, 255, 0.10) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(180, 80, 255, 0.10) 1px,
            transparent 1px
        );

    background-size: 90px 90px;

    opacity: 0.45;

    mask-image:

        radial-gradient(
            ellipse at center,
            black 20%,
            transparent 90%
        );
}


/* ============================= */
/* CANVAS                        */
/* ============================= */

#canvas {

    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    z-index: 2;

    pointer-events: none;
}


/* ============================= */
/* CORNER MARKERS                */
/* ============================= */

.corner {

    position: fixed;

    width: 45px;
    height: 45px;

    border-color:
        rgba(255, 0, 255, 0.65);

    z-index: 5;

    pointer-events: none;
}


.corner.topLeft {

    top: 18px;
    left: 18px;

    border-top: 2px solid;
    border-left: 2px solid;
}


.corner.topRight {

    top: 18px;
    right: 18px;

    border-top: 2px solid;
    border-right: 2px solid;
}


.corner.bottomLeft {

    bottom: 18px;
    left: 18px;

    border-bottom: 2px solid;
    border-left: 2px solid;
}


.corner.bottomRight {

    bottom: 18px;
    right: 18px;

    border-bottom: 2px solid;
    border-right: 2px solid;
}


/* ============================= */
/* TITLE                         */
/* ============================= */

#title {

    position: fixed;

    top: 22px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 10;

    color: white;

    font-size: 20px;

    font-weight: bold;

    letter-spacing: 4px;

    text-shadow:
        0 0 8px #ff00ff,
        0 0 20px #ff00ff;

    white-space: nowrap;
}


/* ============================= */
/* STATUS                        */
/* ============================= */

#status {

    position: fixed;

    top: 54px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 10;

    color: #ff66ff;

    font-size: 12px;

    letter-spacing: 2px;

    text-shadow:
        0 0 8px #ff00ff;
}


/* ============================= */
/* SYSTEM HUD                    */
/* ============================= */

#systemHUD {

    position: fixed;

    top: 20px;
    left: 20px;

    z-index: 10;

    width: 190px;

    padding: 14px;

    border:
        1px solid
        rgba(255, 0, 255, 0.35);

    background:
        rgba(10, 0, 20, 0.55);

    backdrop-filter: blur(8px);

    color: white;

    box-shadow:
        0 0 20px
        rgba(255, 0, 255, 0.15);
}


#hudHeader {

    color: #ff66ff;

    font-size: 11px;

    letter-spacing: 2px;

    margin-bottom: 12px;
}


.hudLine {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-top: 9px;

    font-size: 10px;
}


.hudLabel {

    color:
        rgba(255,255,255,0.65);

    letter-spacing: 1px;
}


.hudValue {

    color: #ff66ff;

    letter-spacing: 1px;

    text-shadow:
        0 0 8px #ff00ff;
}


#handDot {

    display: inline-block;

    width: 7px;
    height: 7px;

    margin-right: 5px;

    border-radius: 50%;

    background: #555;

    box-shadow:
        0 0 5px #555;
}


/* ============================= */
/* GESTURE STRIP                 */
/* ============================= */

#gestureStrip {

    position: fixed;

    bottom: 25px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 10;

    padding: 10px 18px;

    border:
        1px solid
        rgba(255, 0, 255, 0.35);

    background:
        rgba(10, 0, 20, 0.60);

    backdrop-filter: blur(8px);

    color:
        rgba(255,255,255,0.75);

    font-size: 11px;

    letter-spacing: 1px;

    white-space: nowrap;
}


#instructionHeader {

    color: #ff66ff;

    font-size: 10px;

    margin-bottom: 7px;

    letter-spacing: 2px;
}


/* ============================= */
/* START BUTTON                  */
/* ============================= */

#startButton {

    position: fixed;

    bottom: 95px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 10;

    padding: 12px 25px;

    border:
        1px solid #ff00ff;

    background:
        rgba(20, 0, 30, 0.75);

    color: white;

    font-size: 12px;

    letter-spacing: 2px;

    cursor: pointer;

    box-shadow:
        0 0 15px
        rgba(255, 0, 255, 0.35);

    transition: 0.2s;
}


#startButton:active {

    transform:
        translateX(-50%)
        scale(0.96);
}
