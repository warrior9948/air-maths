<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>Air Maths Board</title>

<style>

/* =========================================================
   CORE
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;

    background:#020205;
    color:#f5f5f7;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

/* =========================================================
   CAMERA
========================================================= */

#camera{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);

    opacity:.30;

    z-index:0;
}

/* =========================================================
   NEGLIGIBLE GRID
========================================================= */

#grid{
    position:fixed;
    inset:0;

    z-index:1;
    pointer-events:none;

    background-image:
        linear-gradient(
            rgba(217,70,239,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(217,70,239,.025) 1px,
            transparent 1px
        );

    background-size:80px 80px;

    opacity:.45;

    mask-image:
        radial-gradient(
            ellipse at center,
            black 0%,
            rgba(0,0,0,.5) 45%,
            transparent 82%
        );

    -webkit-mask-image:
        radial-gradient(
            ellipse at center,
            black 0%,
            rgba(0,0,0,.5) 45%,
            transparent 82%
        );
}

/* =========================================================
   DRAWING CANVAS
========================================================= */

#canvas{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    z-index:2;

    pointer-events:none;
}

/* =========================================================
   CORNER MARKERS
========================================================= */

.corner{
    position:fixed;

    width:42px;
    height:42px;

    z-index:4;

    pointer-events:none;

    opacity:.42;

    animation:cornerPulse 5s ease-in-out infinite;
}

.corner::before,
.corner::after{
    content:"";

    position:absolute;

    background:rgba(217,70,239,.75);
}

.corner::before{
    width:30px;
    height:1px;
}

.corner::after{
    width:1px;
    height:30px;
}

.top-left{
    top:14px;
    left:14px;
}

.top-left::before,
.top-left::after{
    top:0;
    left:0;
}

.top-right{
    top:14px;
    right:14px;
}

.top-right::before{
    top:0;
    right:0;
}

.top-right::after{
    top:0;
    right:0;
}

.bottom-left{
    bottom:14px;
    left:14px;
}

.bottom-left::before{
    bottom:0;
    left:0;
}

.bottom-left::after{
    bottom:0;
    left:0;
}

.bottom-right{
    bottom:14px;
    right:14px;
}

.bottom-right::before{
    bottom:0;
    right:0;
}

.bottom-right::after{
    bottom:0;
    right:0;
}

@keyframes cornerPulse{

    0%,100%{
        opacity:.28;
    }

    50%{
        opacity:.50;
    }
}

/* =========================================================
   TOP BAR
========================================================= */

#topHUD{
    position:fixed;

    top:20px;
    left:50%;

    transform:translateX(-50%);

    width:calc(100% - 110px);

    max-width:900px;

    height:42px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 15px;

    z-index:5;

    background:
        linear-gradient(
            90deg,
            rgba(5,5,10,.82),
            rgba(9,8,14,.64),
            rgba(5,5,10,.82)
        );

    border-top:1px solid rgba(255,255,255,.08);
    border-bottom:1px solid rgba(255,255,255,.06);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
}

/* tiny accent line */

#topHUD::before{
    content:"";

    position:absolute;

    left:0;
    top:-1px;

    width:46px;
    height:1px;

    background:#d946ef;

    box-shadow:
        0 0 10px rgba(217,70,239,.35);
}

#title{
    font-size:11px;

    font-weight:700;

    letter-spacing:2.2px;

    color:#f4f4f5;
}

#status{
    font-size:8px;

    letter-spacing:1.2px;

    color:#8f8f99;

    white-space:nowrap;
}

/* =========================================================
   COMPACT SYSTEM HUD
========================================================= */

#systemHUD{

    position:fixed;

    top:72px;
    right:24px;

    z-index:5;

    display:flex;
    align-items:center;

    height:31px;

    padding:0 10px;

    background:rgba(5,5,10,.72);

    border:1px solid rgba(255,255,255,.075);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    box-shadow:
        0 8px 24px rgba(0,0,0,.22);
}

#systemHeader{
    display:none;
}

.systemRow{

    display:flex;
    align-items:center;

    gap:5px;

    padding:0 9px;

    min-height:auto;

    border:none;

    border-right:1px solid rgba(255,255,255,.08);
}

.systemRow:last-child{
    border-right:none;
}

.systemLabel{

    font-size:7px;

    font-weight:700;

    letter-spacing:1.3px;

    color:#686872;
}

.systemValue{

    display:flex;
    align-items:center;

    gap:5px;

    font-size:8px;

    font-weight:700;

    letter-spacing:.9px;

    color:#d4d4d8;
}

#handDot{

    width:5px;
    height:5px;

    border-radius:50%;

    background:#4a4a52;

    transition:
        background .25s ease,
        box-shadow .25s ease;
}

#handDot.active{

    background:#d946ef;

    box-shadow:
        0 0 7px rgba(217,70,239,.7);
}

#handState{
    color:#a1a1aa;
}

#modeState{
    color:#e879f9;
}

#systemState{
    color:#a7f3d0;
}

/* =========================================================
   GESTURE STRIP
========================================================= */

#instructions{

    position:fixed;

    left:50%;
    bottom:20px;

    transform:translateX(-50%);

    z-index:5;

    display:flex;
    align-items:center;

    padding:7px 11px;

    background:rgba(4,4,9,.70);

    border:1px solid rgba(255,255,255,.065);

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);

    white-space:nowrap;
}

#instructionsHeader{
    display:none;
}

.instruction{

    display:flex;
    align-items:center;

    min-height:auto;

    padding:0 9px;

    font-size:8px;

    letter-spacing:.7px;

    color:#85858e;

    border:none;

    border-right:1px solid rgba(255,255,255,.08);
}

.instruction:last-child{
    border-right:none;
}

.instruction span{

    margin-right:5px;

    font-size:10px;
}

/* =========================================================
   START BUTTON
========================================================= */

#startButton{

    position:fixed;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:10;

    padding:14px 24px;

    border:1px solid rgba(217,70,239,.7);

    border-radius:7px;

    background:
        linear-gradient(
            135deg,
            rgba(20,12,25,.96),
            rgba(5,5,10,.96)
        );

    color:#f5f5f7;

    font-size:10px;

    font-weight:700;

    letter-spacing:2px;

    cursor:pointer;

    box-shadow:
        0 12px 30px rgba(0,0,0,.45),
        0 0 18px rgba(217,70,239,.14);

    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
}

#startButton:hover{

    transform:
        translate(-50%,-50%)
        translateY(-2px);

    border-color:#e879f9;

    box-shadow:
        0 14px 35px rgba(0,0,0,.5),
        0 0 24px rgba(217,70,239,.22);
}

#startButton:active{

    transform:
        translate(-50%,-50%);
}

/* =========================================================
   CURSOR
========================================================= */

#cursor{

    position:fixed;

    width:42px;
    height:42px;

    border:2px solid #ff66ff;

    border-radius:50%;

    transform:translate(-50%,-50%);

    pointer-events:none;

    z-index:8;

    display:none;

    box-shadow:
        0 0 8px rgba(255,0,255,.7),
        0 0 20px rgba(255,0,255,.45);
}

#cursor::before{

    content:"";

    position:absolute;

    width:7px;
    height:7px;

    background:#ff66ff;

    border-radius:50%;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    box-shadow:0 0 10px #ff66ff;
}

#cursor::after{

    content:"";

    position:absolute;

    inset:8px;

    border:1px solid rgba(255,255,255,.35);

    border-radius:50%;
}

#cursor.ready{

    border-color:#ff66ff;

    box-shadow:
        0 0 8px rgba(255,0,255,.55),
        0 0 18px rgba(255,0,255,.3);
}

#cursor.drawing{

    border-color:white;

    box-shadow:
        0 0 8px #ff66ff,
        0 0 22px rgba(255,0,255,.7);

    animation:cursorPulse 1.2s ease-in-out infinite;
}

#cursor.pinch{

    border-color:#d946ef;

    box-shadow:
        0 0 7px rgba(217,70,239,.55);
}

@keyframes cursorPulse{

    0%,100%{
        transform:translate(-50%,-50%) scale(1);
    }

    50%{
        transform:translate(-50%,-50%) scale(1.08);
    }
}

/* =========================================================
   CLEAR FLASH
========================================================= */

#clearFlash{

    position:fixed;
    inset:0;

    z-index:7;

    pointer-events:none;

    opacity:0;

    background:
        radial-gradient(
            circle at center,
            rgba(255,0,255,.30),
            rgba(255,0,255,.08) 35%,
            transparent 70%
        );
}

#clearFlash.active{
    animation:clearFlash .55s ease-out;
}

@keyframes clearFlash{

    0%{
        opacity:0;
    }

    20%{
        opacity:1;
    }

    100%{
        opacity:0;
    }
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    #topHUD{

        top:14px;

        width:calc(100% - 74px);

        height:36px;

        padding:0 11px;
    }

    #title{

        font-size:9px;

        letter-spacing:1.6px;
    }

    #status{

        font-size:7px;

        letter-spacing:.7px;
    }

    #systemHUD{

        top:58px;
        right:10px;

        height:27px;

        padding:0 5px;
    }

    .systemRow{

        padding:0 6px;

        gap:4px;
    }

    .systemLabel{

        font-size:6px;

        letter-spacing:1px;
    }

    .systemValue{

        font-size:7px;

        letter-spacing:.5px;
    }

    #instructions{

        bottom:12px;

        max-width:
            calc(100% - 30px);

        padding:6px 5px;
    }

    .instruction{

        padding:0 6px;

        font-size:7px;
    }

    .instruction span{

        font-size:9px;

        margin-right:3px;
    }

    .corner{

        width:30px;
        height:30px;

        opacity:.35;
    }

    .corner::before{

        width:22px;
    }

    .corner::after{

        height:22px;
    }

    .top-left{
        top:8px;
        left:8px;
    }

    .top-right{
        top:8px;
        right:8px;
    }

    .bottom-left{
        bottom:8px;
        left:8px;
    }

    .bottom-right{
        bottom:8px;
        right:8px;
    }
}

@media(max-width:430px){

    #topHUD{

        width:calc(100% - 60px);
    }

    #title{

        font-size:8px;

        letter-spacing:1.2px;
    }

    #status{

        font-size:6px;
    }

    #systemHUD{

        right:7px;

        height:25px;
    }

    .systemRow{

        padding:0 4px;
    }

    .systemLabel{

        display:none;
    }

    .systemValue{

        font-size:6.5px;
    }

    #instructions{

        bottom:9px;
    }

    .instruction{

        padding:0 4px;

        font-size:6.5px;
    }
}

@media(max-height:650px){

    #topHUD{
        top:10px;
    }

    #systemHUD{
        top:49px;
    }

    #instructions{
        bottom:8px;
    }
}

</style>
</head>

<body>

<!-- CAMERA -->
<video id="camera" autoplay playsinline></video>

<!-- NEGLIGIBLE GRID -->
<div id="grid"></div>

<!-- DRAWING -->
<canvas id="canvas"></canvas>

<!-- CORNERS -->
<div class="corner top-left"></div>
<div class="corner top-right"></div>
<div class="corner bottom-left"></div>
<div class="corner bottom-right"></div>

<!-- TOP HUD -->
<div id="topHUD">

    <div id="title">
        AIR MATHS
    </div>

    <div id="status">
        🖐️ PRESS START
    </div>

</div>

<!-- COMPACT SYSTEM HUD -->
<div id="systemHUD">

    <div id="systemHeader">
        SYSTEM
    </div>

    <div class="systemRow">

        <div class="systemLabel">
            HAND
        </div>

        <div class="systemValue">

            <div id="handDot"></div>

            <div id="handState">
                SEARCHING
            </div>

        </div>

    </div>

    <div class="systemRow">

        <div class="systemLabel">
            MODE
        </div>

        <div class="systemValue">

            <div id="modeState">
                STANDBY
            </div>

        </div>

    </div>

    <div class="systemRow">

        <div class="systemLabel">
            SYSTEM
        </div>

        <div class="systemValue">

            <div id="systemState">
                OFFLINE
            </div>

        </div>

    </div>

</div>

<!-- GESTURES -->
<div id="instructions">

    <div id="instructionsHeader">
        GESTURES
    </div>

    <div class="instruction">
        <span>☝️</span>
        DRAW
    </div>

    <div class="instruction">
        <span>🤏</span>
        STOP
    </div>

    <div class="instruction">
        <span>✋</span>
        CLEAR
    </div>

</div>

<!-- CURSOR -->
<div id="cursor"></div>

<!-- CLEAR FLASH -->
<div id="clearFlash"></div>

<!-- START -->
<button id="startButton">
    START CAMERA
</button>

<!-- MEDIAPIPE -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>

const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const cursor =
    document.getElementById("cursor");

const clearFlash =
    document.getElementById("clearFlash");

const startButton =
    document.getElementById("startButton");

const handDot =
    document.getElementById("handDot");

const handState =
    document.getElementById("handState");

const modeState =
    document.getElementById("modeState");

const systemState =
    document.getElementById("systemState");

const status =
    document.getElementById("status");


let previousX = null;
let previousY = null;

let smoothX = null;
let smoothY = null;


/* =========================================================
   SMOOTHING
========================================================= */

function smoothPoint(targetX,targetY){

    if(smoothX === null){

        smoothX = targetX;
        smoothY = targetY;

        return {
            x:smoothX,
            y:smoothY
        };
    }

    const dx =
        targetX - smoothX;

    const dy =
        targetY - smoothY;

    const dist =
        Math.sqrt(dx*dx + dy*dy);

    let smoothing;

    if(dist < 5){

        smoothing = 0.75;

    }
    else if(dist < 20){

        smoothing = 0.90;

    }
    else{

        smoothing = 0.97;
    }

    smoothX += dx * smoothing;
    smoothY += dy * smoothing;

    return {
        x:smoothX,
        y:smoothY
    };
}


/* =========================================================
   RESIZE
========================================================= */

function resizeCanvas(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* =========================================================
   CLEAR
========================================================= */

function clearCanvas(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    clearFlash.classList.remove(
        "active"
    );

    void clearFlash.offsetWidth;

    clearFlash.classList.add(
        "active"
    );
}


/* =========================================================
   DISTANCE
========================================================= */

function distance(a,b){

    const dx =
        a.x - b.x;

    const dy =
        a.y - b.y;

    return Math.sqrt(
        dx*dx + dy*dy
    );
}


/* =========================================================
   FINGER DETECTION
========================================================= */

function fingerUp(
    landmarks,
    tip,
    joint
){

    return (
        landmarks[tip].y <
        landmarks[joint].y
    );
}


/* =========================================================
   CURSOR
========================================================= */

function showCursor(x,y){

    cursor.style.left =
        x + "px";

    cursor.style.top =
        y + "px";

    cursor.style.display =
        "block";

    if(
        !cursor.classList.contains("drawing") &&
        !cursor.classList.contains("pinch")
    ){

        cursor.classList.add(
            "ready"
        );
    }
}

function hideCursor(){

    cursor.style.display =
        "none";

    cursor.classList.remove(
        "ready",
        "drawing",
        "pinch"
    );
}


/* =========================================================
   HAND HUD
========================================================= */

function setHandDetected(){

    handDot.classList.add(
        "active"
    );

    handState.textContent =
        "DETECTED";
}

function setHandSearching(){

    handDot.classList.remove(
        "active"
    );

    handState.textContent =
        "SEARCHING";
}


/* =========================================================
   DRAWING
========================================================= */

function drawContinuousLine(
    x1,
    y1,
    x2,
    y2
){

    const dx =
        x2 - x1;

    const dy =
        y2 - y1;

    const dist =
        Math.sqrt(
            dx*dx + dy*dy
        );

    const steps =
        Math.max(
            1,
            Math.ceil(dist / 3)
        );

    for(
        let i = 1;
        i <= steps;
        i++
    ){

        const t =
            i / steps;

        const x =
            x1 + dx * t;

        const y =
            y1 + dy * t;


        /* OUTER GLOW */

        ctx.beginPath();

        ctx.moveTo(
            x1,
            y1
        );

        ctx.lineTo(
            x,
            y
        );

        ctx.lineWidth = 13;

        ctx.lineCap =
            "round";

        ctx.strokeStyle =
            "rgba(255,0,255,0.35)";

        ctx.shadowColor =
            "rgba(255,0,255,0.8)";

        ctx.shadowBlur = 25;

        ctx.stroke();


        /* INNER NEON */

        ctx.beginPath();

        ctx.moveTo(
            x1,
            y1
        );

        ctx.lineTo(
            x,
            y
        );

        ctx.lineWidth = 5;

        ctx.lineCap =
            "round";

        ctx.strokeStyle =
            "#ff66ff";

        ctx.shadowColor =
            "#ff00ff";

        ctx.shadowBlur = 12;

        ctx.stroke();


        /* WHITE CORE */

        ctx.beginPath();

        ctx.moveTo(
            x1,
            y1
        );

        ctx.lineTo(
            x,
            y
        );

        ctx.lineWidth = 2;

        ctx.lineCap =
            "round";

        ctx.strokeStyle =
            "white";

        ctx.shadowColor =
            "white";

        ctx.shadowBlur = 5;

        ctx.stroke();


        x1 = x;
        y1 = y;
    }

    ctx.shadowBlur = 0;
}


/* =========================================================
   MEDIAPIPE
========================================================= */

const hands =
    new Hands({

        locateFile:(file)=>{

            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }

    });


hands.setOptions({

    maxNumHands:1,

    modelComplexity:1,

    minDetectionConfidence:0.6,

    minTrackingConfidence:0.6

});


/* =========================================================
   RESULTS
========================================================= */

hands.onResults(
    results=>{

        if(
            !results.multiHandLandmarks ||
            results.multiHandLandmarks.length === 0
        ){

            previousX = null;
            previousY = null;

            smoothX = null;
            smoothY = null;

            hideCursor();

            setHandSearching();

            modeState.textContent =
                "STANDBY";

            status.textContent =
                "🖐️ SHOW YOUR HAND";

            return;
        }


        const landmarks =
            results.multiHandLandmarks[0];

        setHandDetected();


        const indexUp =
            fingerUp(
                landmarks,
                8,
                6
            );

        const middleUp =
            fingerUp(
                landmarks,
                12,
                10
            );

        const ringUp =
            fingerUp(
                landmarks,
                16,
                14
            );

        const pinkyUp =
            fingerUp(
                landmarks,
                20,
                18
            );


        const targetX =
            (1 - landmarks[8].x) *
            canvas.width;

        const targetY =
            landmarks[8].y *
            canvas.height;


        const point =
            smoothPoint(
                targetX,
                targetY
            );


        const x =
            point.x;

        const y =
            point.y;


        showCursor(
            x,
            y
        );


        const openHand =
            indexUp &&
            middleUp &&
            ringUp &&
            pinkyUp;


        if(openHand){

            clearCanvas();

            previousX = null;
            previousY = null;

            hideCursor();

            modeState.textContent =
                "CLEAR";

            status.textContent =
                "✋ BOARD CLEARED";

            return;
        }


        const pinch =
            distance(
                landmarks[4],
                landmarks[8]
            );


        if(
            indexUp &&
            pinch > 0.07
        ){

            cursor.classList.add(
                "drawing"
            );

            cursor.classList.remove(
                "pinch",
                "ready"
            );

            modeState.textContent =
                "DRAW";

            status.textContent =
                "☝️ ✨ DRAWING IN AIR";


            if(
                previousX !== null &&
                previousY !== null
            ){

                drawContinuousLine(
                    previousX,
                    previousY,
                    x,
                    y
                );
            }


            previousX = x;
            previousY = y;

        }

        else{

            cursor.classList.remove(
                "drawing",
                "ready"
            );

            cursor.classList.add(
                "pinch"
            );

            previousX = null;
            previousY = null;

            modeState.textContent =
                "READY";

            status.textContent =
                "🤏 PINCH TO STOP • ☝️ POINT TO DRAW";
        }

    }
);


/* =========================================================
   CAMERA
========================================================= */

async function startCamera(){

    try{

        const stream =
            await navigator.mediaDevices
            .getUserMedia({

                video:{
                    facingMode:"user"
                },

                audio:false
            });


        video.srcObject =
            stream;


        const camera =
            new Camera(
                video,
                {

                    onFrame:
                        async()=>{

                            await hands.send({
                                image:video
                            });

                        },

                    width:1280,

                    height:720

                }
            );


        camera.start();


        startButton.style.display =
            "none";


        systemState.textContent =
            "ONLINE";


        status.textContent =
            "🖐️ SHOW YOUR HAND";

    }

    catch(error){

        systemState.textContent =
            "ERROR";

        status.textContent =
            "🔴 CAMERA PERMISSION DENIED";

        alert(
            "Camera permission is required."
        );
    }
}


startButton.addEventListener(
    "click",
    startCamera
);

</script>
