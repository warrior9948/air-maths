<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Air Maths Board</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#020208;
    color:white;
}

/* =========================================================
   CAMERA
========================================================= */

#camera{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
    opacity:.30;
    z-index:0;
}

/* =========================================================
   GRID
========================================================= */

#grid{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;

    background-image:
        linear-gradient(rgba(217,70,239,.08) 1px,transparent 1px),
        linear-gradient(90deg,rgba(217,70,239,.08) 1px,transparent 1px);

    background-size:55px 55px;

    mask-image:radial-gradient(
        ellipse at center,
        black 0%,
        rgba(0,0,0,.85) 50%,
        transparent 100%
    );

    -webkit-mask-image:radial-gradient(
        ellipse at center,
        black 0%,
        rgba(0,0,0,.85) 50%,
        transparent 100%
    );

    opacity:.75;
}

/* =========================================================
   DRAWING CANVAS
========================================================= */

#canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:2;
    pointer-events:none;
}

/* =========================================================
   FUTURISTIC CORNERS
========================================================= */

.corner{
    position:fixed;
    width:58px;
    height:58px;
    z-index:4;
    pointer-events:none;
    opacity:.72;
    animation:cornerPulse 4.5s ease-in-out infinite;
}

.corner::before,
.corner::after{
    content:"";
    position:absolute;
    background:rgba(232,121,249,.75);
}

.corner::before{
    width:42px;
    height:1px;
}

.corner::after{
    width:1px;
    height:42px;
}

.top-left{
    top:18px;
    left:18px;
}

.top-left::before{top:0;left:0;}
.top-left::after{top:0;left:0;}

.top-right{
    top:18px;
    right:18px;
}

.top-right::before{top:0;right:0;}
.top-right::after{top:0;right:0;}

.bottom-left{
    bottom:18px;
    left:18px;
}

.bottom-left::before{bottom:0;left:0;}
.bottom-left::after{bottom:0;left:0;}

.bottom-right{
    bottom:18px;
    right:18px;
}

.bottom-right::before{bottom:0;right:0;}
.bottom-right::after{bottom:0;right:0;}

@keyframes cornerPulse{
    0%,100%{opacity:.48;}
    50%{opacity:.78;}
}

/* =========================================================
   TOP HUD
========================================================= */

#topHUD{
    position:fixed;
    top:28px;
    left:50%;
    transform:translateX(-50%);

    width:min(520px,calc(100% - 150px));

    min-height:64px;

    padding:14px 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;

    background:
        linear-gradient(
            135deg,
            rgba(17,17,27,.90),
            rgba(7,7,14,.78)
        );

    border:1px solid rgba(255,255,255,.10);
    border-left:2px solid rgba(217,70,239,.75);

    border-radius:12px;

    box-shadow:
        0 14px 35px rgba(0,0,0,.32),
        inset 0 1px 0 rgba(255,255,255,.045);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    z-index:5;
}

#topHUD::after{
    content:"";
    position:absolute;
    left:18px;
    bottom:-5px;

    width:46px;
    height:1px;

    background:rgba(217,70,239,.65);
}

#title{
    font-size:clamp(13px,2vw,17px);
    font-weight:700;
    letter-spacing:2px;
    white-space:nowrap;
    color:#f4f4f5;
}

#status{
    font-size:10px;
    letter-spacing:1.2px;
    color:#a1a1aa;
    text-align:right;
    white-space:nowrap;
}

/* =========================================================
   SYSTEM HUD
========================================================= */

#systemHUD{
    position:fixed;
    top:112px;
    right:28px;

    width:214px;

    padding:15px 16px;

    background:
        linear-gradient(
            145deg,
            rgba(17,17,27,.92),
            rgba(6,6,13,.82)
        );

    border:1px solid rgba(255,255,255,.10);
    border-radius:12px;

    box-shadow:
        0 16px 38px rgba(0,0,0,.36),
        inset 0 1px 0 rgba(255,255,255,.04);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    z-index:5;
}

#systemHUD::before{
    content:"";
    position:absolute;
    left:-1px;
    top:16px;
    bottom:16px;

    width:2px;

    background:linear-gradient(
        to bottom,
        transparent,
        rgba(217,70,239,.85),
        transparent
    );
}

#systemHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding-bottom:11px;
    margin-bottom:4px;

    border-bottom:1px solid rgba(255,255,255,.07);

    color:#d4d4d8;

    font-size:9px;
    font-weight:700;
    letter-spacing:1.8px;
}

#systemHeader::after{
    content:"";
    width:5px;
    height:5px;
    border-radius:50%;
    background:#d946ef;
    box-shadow:0 0 8px rgba(217,70,239,.45);
}

.systemRow{
    min-height:31px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:1px solid rgba(255,255,255,.045);
}

.systemRow:last-child{
    border-bottom:none;
}

.systemLabel{
    font-size:8px;
    font-weight:700;
    letter-spacing:1.5px;
    color:#71717a;
}

.systemValue{
    display:flex;
    align-items:center;
    gap:7px;

    font-size:9px;
    font-weight:700;
    letter-spacing:1.1px;

    color:#e4e4e7;
}

/* =========================================================
   HAND STATUS
========================================================= */

#handDot{
    width:6px;
    height:6px;
    border-radius:50%;

    background:#52525b;

    transition:
        background .25s ease,
        box-shadow .25s ease;
}

#handDot.active{
    background:#d946ef;
    box-shadow:
        0 0 0 3px rgba(217,70,239,.08),
        0 0 10px rgba(217,70,239,.65);
}

#handState{
    color:#a1a1aa;
}

#modeState,
#systemState{
    color:#d4d4d8;
}

#modeState{
    color:#e879f9;
}

#systemState{
    color:#a7f3d0;
}

/* =========================================================
   INSTRUCTIONS
========================================================= */

#instructions{
    position:fixed;

    left:28px;
    bottom:30px;

    width:220px;

    padding:15px 17px;

    background:
        linear-gradient(
            145deg,
            rgba(17,17,27,.90),
            rgba(6,6,13,.80)
        );

    border:1px solid rgba(255,255,255,.09);
    border-radius:12px;

    box-shadow:
        0 16px 38px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.04);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    z-index:5;
}

#instructions::before{
    content:"";
    position:absolute;

    top:-1px;
    left:17px;

    width:38px;
    height:1px;

    background:#d946ef;
}

#instructionsHeader{
    margin-bottom:12px;

    color:#d4d4d8;

    font-size:9px;
    font-weight:700;
    letter-spacing:1.7px;
}

.instruction{
    display:flex;
    align-items:center;

    min-height:28px;

    font-size:10px;
    color:#a1a1aa;

    border-bottom:1px solid rgba(255,255,255,.045);
}

.instruction:last-child{
    border-bottom:none;
}

.instruction span{
    color:#f4f4f5;
    margin-right:7px;
}

/* =========================================================
   START BUTTON
========================================================= */

#startButton{
    position:fixed;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:10;

    padding:15px 27px;

    border:1px solid rgba(232,121,249,.75);
    border-radius:9px;

    background:
        linear-gradient(
            135deg,
            rgba(30,18,35,.96),
            rgba(10,10,17,.96)
        );

    color:#f5f5f5;

    font-size:11px;
    font-weight:700;
    letter-spacing:2px;

    cursor:pointer;

    box-shadow:
        0 0 0 1px rgba(217,70,239,.08),
        0 10px 30px rgba(0,0,0,.45),
        0 0 22px rgba(217,70,239,.16);

    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
}

#startButton:hover{
    transform:translate(-50%,-50%) translateY(-2px);

    border-color:rgba(232,121,249,.95);

    box-shadow:
        0 0 0 1px rgba(217,70,239,.12),
        0 12px 34px rgba(0,0,0,.5),
        0 0 28px rgba(217,70,239,.22);
}

#startButton:active{
    transform:translate(-50%,-50%);
}

/* =========================================================
   CURSOR
   KEPT VISUALLY FUTURISTIC
========================================================= */

#cursor{
    position:fixed;

    width:42px;
    height:42px;

    border:2px solid #ff66ff;
    border-radius:50%;

    transform:translate(-50%,-50%);

    pointer-events:none;

    z-index:8;

    display:none;

    box-shadow:
        0 0 8px rgba(255,0,255,.7),
        0 0 20px rgba(255,0,255,.45);
}

#cursor::before{
    content:"";
    position:absolute;

    width:7px;
    height:7px;

    background:#ff66ff;
    border-radius:50%;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    box-shadow:0 0 10px #ff66ff;
}

#cursor::after{
    content:"";
    position:absolute;

    inset:8px;

    border:1px solid rgba(255,255,255,.35);
    border-radius:50%;
}

#cursor.ready{
    border-color:#ff66ff;
    box-shadow:
        0 0 8px rgba(255,0,255,.55),
        0 0 18px rgba(255,0,255,.3);
}

#cursor.drawing{
    border-color:white;

    box-shadow:
        0 0 8px #ff66ff,
        0 0 22px rgba(255,0,255,.7);

    animation:cursorPulse 1.2s ease-in-out infinite;
}

#cursor.pinch{
    border-color:#d946ef;

    box-shadow:
        0 0 7px rgba(217,70,239,.55);
}

@keyframes cursorPulse{
    0%,100%{
        transform:translate(-50%,-50%) scale(1);
    }

    50%{
        transform:translate(-50%,-50%) scale(1.08);
    }
}

/* =========================================================
   CLEAR FLASH
   KEPT UNTOUCHED
========================================================= */

#clearFlash{
    position:fixed;
    inset:0;

    z-index:7;

    pointer-events:none;

    opacity:0;

    background:
        radial-gradient(
            circle at center,
            rgba(255,0,255,.30),
            rgba(255,0,255,.08) 35%,
            transparent 70%
        );
}

#clearFlash.active{
    animation:clearFlash .55s ease-out;
}

@keyframes clearFlash{
    0%{
        opacity:0;
    }

    20%{
        opacity:1;
    }

    100%{
        opacity:0;
    }
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    #topHUD{
        top:18px;
        width:calc(100% - 104px);
        min-height:58px;

        padding:12px 14px;

        gap:10px;

        border-radius:10px;
    }

    #title{
        font-size:11px;
        letter-spacing:1.5px;
    }

    #status{
        font-size:8px;
        letter-spacing:.7px;
    }

    #systemHUD{
        top:88px;
        right:14px;

        width:172px;

        padding:12px 13px;

        border-radius:10px;
    }

    #systemHeader{
        font-size:8px;
        letter-spacing:1.4px;
    }

    .systemRow{
        min-height:28px;
    }

    .systemLabel{
        font-size:7px;
    }

    .systemValue{
        font-size:8px;
        letter-spacing:.8px;
    }

    #instructions{
        left:14px;
        bottom:18px;

        width:184px;

        padding:12px 13px;

        border-radius:10px;
    }

    #instructionsHeader{
        font-size:8px;
        margin-bottom:8px;
    }

    .instruction{
        min-height:25px;
        font-size:8px;
    }

    .corner{
        width:42px;
        height:42px;
    }

    .corner::before{
        width:30px;
    }

    .corner::after{
        height:30px;
    }

    .top-left{
        top:12px;
        left:12px;
    }

    .top-right{
        top:12px;
        right:12px;
    }

    .bottom-left{
        bottom:12px;
        left:12px;
    }

    .bottom-right{
        bottom:12px;
        right:12px;
    }

    #startButton{
        padding:13px 22px;
        font-size:10px;
    }
}

@media(max-width:430px){

    #topHUD{
        width:calc(100% - 86px);
    }

    #title{
        font-size:9px;
        letter-spacing:1px;
    }

    #status{
        font-size:7px;
    }

    #systemHUD{
        width:158px;
    }

    #instructions{
        width:170px;
    }

    .instruction{
        font-size:7.5px;
    }
}

@media(max-height:650px){

    #systemHUD{
        top:78px;
    }

    #instructions{
        bottom:12px;
    }

    #instructionsHeader{
        margin-bottom:5px;
    }

    .instruction{
        min-height:22px;
    }
}
</style>
</head>

<body>

<!-- CAMERA -->
<video id="camera" autoplay playsinline></video>

<!-- GRID -->
<div id="grid"></div>

<!-- DRAWING -->
<canvas id="canvas"></canvas>

<!-- FUTURISTIC CORNERS -->
<div class="corner top-left"></div>
<div class="corner top-right"></div>
<div class="corner bottom-left"></div>
<div class="corner bottom-right"></div>

<!-- TOP HUD -->
<div id="topHUD">
    <div id="title">✨ AIR MATHS BOARD</div>
    <div id="status">🖐️ PRESS START</div>
</div>

<!-- SYSTEM HUD -->
<div id="systemHUD">

    <div id="systemHeader">
        ◈ SYSTEM STATUS
    </div>

    <div class="systemRow">
        <div class="systemLabel">HAND</div>

        <div class="systemValue">
            <div id="handDot"></div>
            <div id="handState">SEARCHING</div>
        </div>
    </div>

    <div class="systemRow">
        <div class="systemLabel">MODE</div>

        <div class="systemValue">
            <div id="modeState">STANDBY</div>
        </div>
    </div>

    <div class="systemRow">
        <div class="systemLabel">SYSTEM</div>

        <div class="systemValue">
            <div id="systemState">OFFLINE</div>
        </div>
    </div>

</div>

<!-- INSTRUCTIONS -->
<div id="instructions">

    <div id="instructionsHeader">
        ◈ GESTURE CONTROL
    </div>

    <div class="instruction">
        <span>☝️</span>
        Index → Draw
    </div>

    <div class="instruction">
        <span>🤏</span>
        Pinch → Stop
    </div>

    <div class="instruction">
        <span>✋</span>
        Open Hand → Clear
    </div>

</div>

<!-- CURSOR -->
<div id="cursor"></div>

<!-- CLEAR FLASH -->
<div id="clearFlash"></div>

<!-- START -->
<button id="startButton">START CAMERA</button>

<!-- MEDIAPIPE -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>

const video = document.getElementById("camera");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const cursor = document.getElementById("cursor");
const clearFlash = document.getElementById("clearFlash");

const startButton = document.getElementById("startButton");

const handDot = document.getElementById("handDot");
const handState = document.getElementById("handState");
const modeState = document.getElementById("modeState");
const systemState = document.getElementById("systemState");
const status = document.getElementById("status");

let previousX = null;
let previousY = null;


/* =========================================================
   SMOOTHING
========================================================= */

let smoothX = null;
let smoothY = null;

function smoothPoint(targetX,targetY){

    if(smoothX === null){
        smoothX = targetX;
        smoothY = targetY;
        return {x:smoothX,y:smoothY};
    }

    const dx = targetX - smoothX;
    const dy = targetY - smoothY;

    const dist = Math.sqrt(dx*dx + dy*dy);

    let smoothing;

    if(dist < 5){
        smoothing = 0.75;
    }
    else if(dist < 20){
        smoothing = 0.90;
    }
    else{
        smoothing = 0.97;
    }

    smoothX += dx * smoothing;
    smoothY += dy * smoothing;

    return {
        x:smoothX,
        y:smoothY
    };
}


/* =========================================================
   RESIZE
========================================================= */

function resizeCanvas(){

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

window.addEventListener("resize",resizeCanvas);

resizeCanvas();


/* =========================================================
   CLEAR
========================================================= */

function clearCanvas(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    clearFlash.classList.remove("active");

    void clearFlash.offsetWidth;

    clearFlash.classList.add("active");
}


/* =========================================================
   DISTANCE
========================================================= */

function distance(a,b){

    const dx = a.x - b.x;
    const dy = a.y - b.y;

    return Math.sqrt(dx*dx + dy*dy);
}


/* =========================================================
   FINGER DETECTION
========================================================= */

function fingerUp(landmarks,tip,joint){

    return landmarks[tip].y < landmarks[joint].y;
}


/* =========================================================
   CURSOR
========================================================= */

function showCursor(x,y){

    cursor.style.left = x + "px";
    cursor.style.top = y + "px";

    cursor.style.display = "block";

    if(
        !cursor.classList.contains("drawing") &&
        !cursor.classList.contains("pinch")
    ){
        cursor.classList.add("ready");
    }
}

function hideCursor(){

    cursor.style.display = "none";

    cursor.classList.remove(
        "ready",
        "drawing",
        "pinch"
    );
}


/* =========================================================
   HAND HUD
========================================================= */

function setHandDetected(){

    handDot.classList.add("active");

    handState.textContent = "DETECTED";
}

function setHandSearching(){

    handDot.classList.remove("active");

    handState.textContent = "SEARCHING";
}


/* =========================================================
   DRAWING
========================================================= */

function drawContinuousLine(x1,y1,x2,y2){

    const dx = x2 - x1;
    const dy = y2 - y1;

    const dist = Math.sqrt(dx*dx + dy*dy);

    const steps = Math.max(1,Math.ceil(dist / 3));

    for(let i=1;i<=steps;i++){

        const t = i / steps;

        const x = x1 + dx * t;
        const y = y1 + dy * t;

        /* outer glow */

        ctx.beginPath();

        ctx.moveTo(x1,y1);
        ctx.lineTo(x,y);

        ctx.lineWidth = 13;
        ctx.lineCap = "round";

        ctx.strokeStyle =
            "rgba(255,0,255,0.35)";

        ctx.shadowColor =
            "rgba(255,0,255,0.8)";

        ctx.shadowBlur = 25;

        ctx.stroke();


        /* inner neon */

        ctx.beginPath();

        ctx.moveTo(x1,y1);
        ctx.lineTo(x,y);

        ctx.lineWidth = 5;
        ctx.lineCap = "round";

        ctx.strokeStyle = "#ff66ff";

        ctx.shadowColor = "#ff00ff";
        ctx.shadowBlur = 12;

        ctx.stroke();


        /* white core */

        ctx.beginPath();

        ctx.moveTo(x1,y1);
        ctx.lineTo(x,y);

        ctx.lineWidth = 2;
        ctx.lineCap = "round";

        ctx.strokeStyle = "white";

        ctx.shadowColor = "white";
        ctx.shadowBlur = 5;

        ctx.stroke();

        x1 = x;
        y1 = y;
    }

    ctx.shadowBlur = 0;
}


/* =========================================================
   MEDIAPIPE
========================================================= */

const hands = new Hands({
    locateFile:(file)=>{
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }
});

hands.setOptions({

    maxNumHands:1,

    modelComplexity:1,

    minDetectionConfidence:0.6,

    minTrackingConfidence:0.6
});


/* =========================================================
   RESULTS
========================================================= */

hands.onResults(results=>{

    if(
        !results.multiHandLandmarks ||
        results.multiHandLandmarks.length === 0
    ){

        previousX = null;
        previousY = null;

        smoothX = null;
        smoothY = null;

        hideCursor();

        setHandSearching();

        modeState.textContent = "STANDBY";

        status.textContent =
            "🖐️ SHOW YOUR HAND";

        return;
    }


    const landmarks =
        results.multiHandLandmarks[0];

    setHandDetected();


    /* INDEX */

    const indexUp =
        fingerUp(landmarks,8,6);

    const middleUp =
        fingerUp(landmarks,12,10);

    const ringUp =
        fingerUp(landmarks,16,14);

    const pinkyUp =
        fingerUp(landmarks,20,18);


    /* CURSOR */

    const targetX =
        (1 - landmarks[8].x) *
        canvas.width;

    const targetY =
        landmarks[8].y *
        canvas.height;

    const point =
        smoothPoint(targetX,targetY);

    const x = point.x;
    const y = point.y;

    showCursor(x,y);


    /* OPEN HAND */

    const openHand =
        indexUp &&
        middleUp &&
        ringUp &&
        pinkyUp;


    if(openHand){

        clearCanvas();

        previousX = null;
        previousY = null;

        hideCursor();

        modeState.textContent = "CLEAR";

        status.textContent =
            "✋ BOARD CLEARED";

        return;
    }


    /* PINCH */

    const pinch =
        distance(
            landmarks[4],
            landmarks[8]
        );


    /* DRAW */

    if(
        indexUp &&
        pinch > 0.07
    ){

        cursor.classList.add("drawing");
        cursor.classList.remove("pinch","ready");

        modeState.textContent = "DRAW";

        status.textContent =
            "☝️ ✨ DRAWING IN AIR";


        if(
            previousX !== null &&
            previousY !== null
        ){

            drawContinuousLine(
                previousX,
                previousY,
                x,
                y
            );
        }


        previousX = x;
        previousY = y;

    }

    else{

        cursor.classList.remove(
            "drawing",
            "ready"
        );

        cursor.classList.add("pinch");

        previousX = null;
        previousY = null;

        modeState.textContent = "READY";

        status.textContent =
            "🤏 PINCH TO STOP • ☝️ POINT TO DRAW";
    }

});


/* =========================================================
   CAMERA
========================================================= */

async function startCamera(){

    try{

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"user"
                },

                audio:false
            });


        video.srcObject = stream;


        const camera =
            new Camera(
                video,
                {
                    onFrame:async()=>{

                        await hands.send({
                            image:video
                        });

                    },

                    width:1280,
                    height:720
                }
            );


        camera.start();


        startButton.style.display = "none";

        systemState.textContent = "ONLINE";

        status.textContent =
            "🖐️ SHOW YOUR HAND";

    }

    catch(error){

        systemState.textContent = "ERROR";

        status.textContent =
            "🔴 CAMERA PERMISSION DENIED";

        alert(
            "Camera permission is required."
        );
    }
}


startButton.addEventListener(
    "click",
    startCamera
);

</script>
