<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Air Maths Board V5</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05000a;
    font-family: Arial, sans-serif;
}

/* CAMERA */
#video {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);

    opacity: 0.30;

    z-index: 0;
}

/* GRID */
#grid {
    position: fixed;
    inset: 0;

    z-index: 1;
    pointer-events: none;

    opacity: 0.45;

    background-image:
        linear-gradient(
            rgba(180, 80, 255, 0.12) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(180, 80, 255, 0.12) 1px,
            transparent 1px
        );

    background-size: 90px 90px;

    -webkit-mask-image:
        radial-gradient(
            ellipse at center,
            black 30%,
            transparent 95%
        );

    mask-image:
        radial-gradient(
            ellipse at center,
            black 30%,
            transparent 95%
        );
}

/* DRAWING CANVAS */
#canvas {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 2;

    pointer-events: none;
}

/* TITLE */
#title {
    position: fixed;

    top: 20px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 10;

    color: white;

    font-size: 22px;
    font-weight: bold;

    letter-spacing: 3px;

    text-shadow:
        0 0 8px #ff00ff,
        0 0 18px #ff00ff,
        0 0 30px rgba(255, 0, 255, 0.7);
}

/* STATUS */
#status {
    position: fixed;

    top: 55px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 10;

    color: #e8b8ff;

    font-size: 12px;

    letter-spacing: 2px;
}

/* HUD */
#hud {
    position: fixed;

    top: 20px;
    left: 20px;

    z-index: 10;

    min-width: 190px;

    padding: 14px 16px;

    border: 1px solid rgba(255, 0, 255, 0.35);

    border-radius: 12px;

    background:
        rgba(15, 0, 25, 0.65);

    backdrop-filter: blur(10px);

    box-shadow:
        0 0 20px rgba(255, 0, 255, 0.12);

    color: white;
}

#hudHeader {
    color: #ff7dff;

    font-size: 11px;

    letter-spacing: 2px;

    margin-bottom: 10px;
}

.hudLine {
    display: flex;

    justify-content: space-between;

    gap: 20px;

    margin-top: 7px;

    font-size: 10px;
}

.hudLabel {
    color: #b78fc9;

    letter-spacing: 1px;
}

.hudValue {
    color: #ffffff;

    letter-spacing: 1px;
}

#handDot {
    display: inline-block;

    width: 7px;
    height: 7px;

    margin-right: 6px;

    border-radius: 50%;

    background: #555;

    box-shadow: 0 0 5px #555;
}

/* GESTURE PANEL */
#gesture {
    position: fixed;

    bottom: 25px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 10;

    padding: 12px 18px;

    border:
        1px solid rgba(255, 0, 255, 0.35);

    border-radius: 12px;

    background:
        rgba(15, 0, 25, 0.65);

    backdrop-filter: blur(10px);

    color: #ddd;

    font-size: 12px;

    letter-spacing: 1px;

    text-align: center;

    white-space: nowrap;
}

#instructionHeader {
    color: #ff7dff;

    font-size: 10px;

    letter-spacing: 2px;

    margin-bottom: 7px;
}

/* START BUTTON */
#startButton {
    position: fixed;

    bottom: 85px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 10;

    padding: 12px 24px;

    border:
        1px solid rgba(255, 0, 255, 0.6);

    border-radius: 30px;

    background:
        rgba(20, 0, 35, 0.8);

    color: white;

    font-size: 12px;

    letter-spacing: 2px;

    cursor: pointer;

    box-shadow:
        0 0 12px rgba(255, 0, 255, 0.25);
}

/* CURSOR */
#cursor {
    position: fixed;

    width: 42px;
    height: 42px;

    border:
        2px solid #ff00ff;

    border-radius: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 8;

    pointer-events: none;

    box-shadow:
        0 0 8px #ff00ff,
        0 0 18px rgba(255, 0, 255, 0.7);
}

#cursor::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 6px;
    height: 6px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: #ffffff;

    box-shadow:
        0 0 8px #ffffff;
}

/* CORNER MARKERS */
.cursorMark {
    position: fixed;

    width: 8px;
    height: 8px;

    z-index: 9;

    border-color: #ff00ff;

    pointer-events: none;
}

#markTop {
    border-top: 2px solid;
    border-left: 2px solid;
}

#markBottom {
    border-bottom: 2px solid;
    border-right: 2px solid;
}

#markLeft {
    border-left: 2px solid;
    border-bottom: 2px solid;
}

#markRight {
    border-right: 2px solid;
    border-top: 2px solid;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<video id="video"
       autoplay
       playsinline>
</video>

<div id="grid"></div>

<canvas id="canvas"></canvas>

<div id="cursor"
     class="hidden">
</div>

<div id="markTop"
     class="cursorMark hidden"></div>

<div id="markBottom"
     class="cursorMark hidden"></div>

<div id="markLeft"
     class="cursorMark hidden"></div>

<div id="markRight"
     class="cursorMark hidden"></div>

<div id="title">
    ✨ AIR MATHS BOARD
</div>

<div id="status">
    Press START
</div>

<div id="hud">

    <div id="hudHeader">
        ◈ SYSTEM STATUS
    </div>

    <div class="hudLine">

        <span>
            <span id="handDot"></span>
            <span class="hudLabel">
                HAND
            </span>
        </span>

        <span id="handState"
              class="hudValue">
            SEARCHING
        </span>

    </div>

    <div class="hudLine">

        <span class="hudLabel">
            MODE
        </span>

        <span id="modeState"
              class="hudValue">
            STANDBY
        </span>

    </div>

    <div class="hudLine">

        <span class="hudLabel">
            SYSTEM
        </span>

        <span id="systemState"
              class="hudValue">
            OFFLINE
        </span>

    </div>

</div>

<div id="gesture">

    <div id="instructionHeader">
        ◈ GESTURE
    </div>

    ☝️ <b>Draw</b>
    ·
    🤏 <b>Stop</b>
    ·
    ✋ <b>Clear</b>

</div>

<button id="startButton">
    START CAMERA
</button>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>

/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const cursor =
    document.getElementById("cursor");

const startButton =
    document.getElementById("startButton");

const statusText =
    document.getElementById("status");

const handState =
    document.getElementById("handState");

const modeState =
    document.getElementById("modeState");

const systemState =
    document.getElementById("systemState");

const handDot =
    document.getElementById("handDot");


/* =========================================================
   CANVAS
========================================================= */

function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   V5 DRAWING ENGINE
========================================================= */

let isDrawing = false;

let previousX = null;
let previousY = null;

let smoothX = null;
let smoothY = null;

let previousRawX = null;
let previousRawY = null;

let previousTime = null;

let currentSpeed = 0;


/*
    Recent curve points.

    V5 uses the V4 Catmull-Rom style
    curve engine, but renders the stroke
    with a more natural pen model.
*/

let strokeBuffer = [];


/* =========================================================
   V5 SETTINGS
========================================================= */

/*
    Slow movement:
    More stabilization.
*/

const SLOW_SMOOTHING = 0.22;


/*
    Fast movement:
    Less stabilization = lower latency.
*/

const FAST_SMOOTHING = 0.86;


/*
    Speed at which maximum responsiveness
    is reached.
*/

const FAST_SPEED = 850;


/*
    Prevents huge tracking jumps.
*/

const MAX_REASONABLE_JUMP = 380;


/*
    Ignore microscopic movement.
*/

const MIN_POINT_DISTANCE = 1.15;


/*
    Dynamic pen width.
*/

const MIN_INK_WIDTH = 2.8;
const MAX_INK_WIDTH = 5.2;


/*
    Glow width relative to ink.
*/

const GLOW_MULTIPLIER = 2.5;


/* =========================================================
   GESTURE SETTINGS
========================================================= */

let clearFrames = 0;

const CLEAR_REQUIRED_FRAMES = 5;

let clearCooldown = 0;

const CLEAR_COOLDOWN_FRAMES = 15;


/* =========================================================
   DISTANCE
========================================================= */

function distanceBetween(
    x1,
    y1,
    x2,
    y2
) {

    const dx =
        x2 - x1;

    const dy =
        y2 - y1;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


/* =========================================================
   DYNAMIC SMOOTHING
========================================================= */

function getSmoothing(speed) {

    if (speed <= 50) {
        return SLOW_SMOOTHING;
    }

    if (speed >= FAST_SPEED) {
        return FAST_SMOOTHING;
    }

    const ratio =
        (speed - 50) /
        (FAST_SPEED - 50);

    return (
        SLOW_SMOOTHING +
        (
            FAST_SMOOTHING -
            SLOW_SMOOTHING
        ) * ratio
    );
}


/* =========================================================
   SMOOTH POINT
========================================================= */

function getSmoothPoint(
    targetX,
    targetY,
    speed
) {

    if (
        smoothX === null ||
        smoothY === null
    ) {

        smoothX = targetX;
        smoothY = targetY;

        return {
            x: smoothX,
            y: smoothY
        };
    }

    const smoothing =
        getSmoothing(speed);

    smoothX +=
        (targetX - smoothX) *
        smoothing;

    smoothY +=
        (targetY - smoothY) *
        smoothing;

    return {
        x: smoothX,
        y: smoothY
    };
}


/* =========================================================
   DYNAMIC PEN WIDTH
========================================================= */

function getPenWidth(speed) {

    /*
        Slow = slightly thicker and stable.

        Fast = slightly thinner and cleaner.
    */

    const ratio =
        Math.min(
            speed / FAST_SPEED,
            1
        );

    return (
        MAX_INK_WIDTH -
        (
            MAX_INK_WIDTH -
            MIN_INK_WIDTH
        ) * ratio
    );
}


/* =========================================================
   NATURAL GLOW STRENGTH
========================================================= */

function getGlowAlpha(speed) {

    /*
        Slow writing:
        stronger visible glow.

        Fast writing:
        slightly reduced glow,
        making it feel more like ink.
    */

    const ratio =
        Math.min(
            speed / FAST_SPEED,
            1
        );

    return (
        0.22 -
        ratio * 0.08
    );
}


/* =========================================================
   NATURAL CURVE
   Catmull-Rom → Cubic Bezier
========================================================= */

function drawCurve(
    p0,
    p1,
    p2,
    p3,
    speed
) {

    const cp1x =
        p1.x +
        (p2.x - p0.x) / 6;

    const cp1y =
        p1.y +
        (p2.y - p0.y) / 6;

    const cp2x =
        p2.x -
        (p3.x - p1.x) / 6;

    const cp2y =
        p2.y -
        (p3.y - p1.y) / 6;


    const inkWidth =
        getPenWidth(speed);

    const glowAlpha =
        getGlowAlpha(speed);


    /*
        --------------------------------------------------
        LAYER 1
        Soft atmospheric glow
        --------------------------------------------------
    */

    ctx.beginPath();

    ctx.moveTo(
        p1.x,
        p1.y
    );

    ctx.bezierCurveTo(
        cp1x,
        cp1y,
        cp2x,
        cp2y,
        p2.x,
        p2.y
    );

    ctx.strokeStyle =
        `rgba(255,0,255,${glowAlpha})`;

    ctx.lineWidth =
        inkWidth *
        GLOW_MULTIPLIER;

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.shadowColor =
        "rgba(255,0,255,0.65)";

    ctx.shadowBlur =
        22;

    ctx.stroke();


    /*
        --------------------------------------------------
        LAYER 2
        Main neon ink
        --------------------------------------------------
    */

    ctx.beginPath();

    ctx.moveTo(
        p1.x,
        p1.y
    );

    ctx.bezierCurveTo(
        cp1x,
        cp1y,
        cp2x,
        cp2y,
        p2.x,
        p2.y
    );

    ctx.strokeStyle =
        "rgba(255,70,255,0.96)";

    ctx.lineWidth =
        inkWidth;

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.shadowColor =
        "rgba(255,0,255,0.85)";

    ctx.shadowBlur =
        10;

    ctx.stroke();


    /*
        --------------------------------------------------
        LAYER 3
        Fine digital-ink core
        --------------------------------------------------
    */

    ctx.beginPath();

    ctx.moveTo(
        p1.x,
        p1.y
    );

    ctx.bezierCurveTo(
        cp1x,
        cp1y,
        cp2x,
        cp2y,
        p2.x,
        p2.y
    );

    ctx.strokeStyle =
        "rgba(255,255,255,0.90)";

    ctx.lineWidth =
        Math.max(
            1.2,
            inkWidth * 0.32
        );

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.shadowColor =
        "rgba(255,255,255,0.45)";

    ctx.shadowBlur =
        4;

    ctx.stroke();


    /*
        Reset shadow so UI/canvas rendering
        doesn't inherit it.
    */

    ctx.shadowBlur = 0;
}


/* =========================================================
   SMALL STROKE / DOT
========================================================= */

function drawDot(
    x,
    y
) {

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        MIN_INK_WIDTH / 2,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#ffffff";

    ctx.shadowColor =
        "#ff00ff";

    ctx.shadowBlur =
        8;

    ctx.fill();

    ctx.shadowBlur = 0;
}


/* =========================================================
   FLUSH STROKE
========================================================= */

function flushStrokeBuffer() {

    const count =
        strokeBuffer.length;


    if (count === 0) {
        return;
    }


    /*
        One point:
        make a tiny natural pen mark.
    */

    if (count === 1) {

        drawDot(
            strokeBuffer[0].x,
            strokeBuffer[0].y
        );

        return;
    }


    /*
        Two points:
        simple rounded line.
    */

    if (count === 2) {

        const p0 =
            strokeBuffer[0];

        const p1 =
            strokeBuffer[1];

        ctx.beginPath();

        ctx.moveTo(
            p0.x,
            p0.y
        );

        ctx.lineTo(
            p1.x,
            p1.y
        );

        ctx.strokeStyle =
            "rgba(255,70,255,0.96)";

        ctx.lineWidth =
            MAX_INK_WIDTH;

        ctx.lineCap =
            "round";

        ctx.lineJoin =
            "round";

        ctx.shadowColor =
            "rgba(255,0,255,0.8)";

        ctx.shadowBlur =
            10;

        ctx.stroke();

        ctx.shadowBlur = 0;

        return;
    }


    /*
        Three points:
        complete the short curve.
    */

    if (count === 3) {

        const p0 =
            strokeBuffer[0];

        const p1 =
            strokeBuffer[1];

        const p2 =
            strokeBuffer[2];


        drawCurve(
            p0,
            p0,
            p1,
            p2,
            currentSpeed
        );

        drawCurve(
            p0,
            p1,
            p2,
            p2,
            currentSpeed
        );

        return;
    }


    /*
        Normal V5 stroke.

        Streaming drawing has already rendered
        everything except the final segment.
    */

    const p0 =
        strokeBuffer[count - 3];

    const p1 =
        strokeBuffer[count - 2];

    const p2 =
        strokeBuffer[count - 1];


    drawCurve(
        p0,
        p1,
        p2,
        p2,
        currentSpeed
    );
}


/* =========================================================
   RESET DRAWING STATE
========================================================= */

function resetDrawingState() {

    isDrawing = false;

    previousX = null;
    previousY = null;

    smoothX = null;
    smoothY = null;

    previousRawX = null;
    previousRawY = null;

    previousTime = null;

    currentSpeed = 0;

    strokeBuffer = [];
}


/* =========================================================
   STOP DRAWING
========================================================= */

function stopDrawing() {

    if (isDrawing) {

        /*
            Finish the final curve segment
            before resetting.
        */

        flushStrokeBuffer();
    }

    resetDrawingState();
}


/* =========================================================
   CLEAR CANVAS
========================================================= */

function clearCanvas() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    resetDrawingState();
}


/* =========================================================
   ADD POINT TO V5 BUFFER
========================================================= */

function addStrokePoint(
    x,
    y
) {

    const last =
        strokeBuffer[
            strokeBuffer.length - 1
        ];


    /*
        Ignore microscopic movements.
    */

    if (last) {

        const d =
            distanceBetween(
                last.x,
                last.y,
                x,
                y
            );

        if (
            d <
            MIN_POINT_DISTANCE
        ) {
            return;
        }
    }


    strokeBuffer.push({
        x: x,
        y: y
    });


    /*
        Once we have four points:

        A B C D

        Draw:
        A → B
        B → C

        Then retain:
        B C D

        The next point produces:
        B C D E

        and draws C → D.
    */

    if (
        strokeBuffer.length === 4
    ) {

        const p0 =
            strokeBuffer[0];

        const p1 =
            strokeBuffer[1];

        const p2 =
            strokeBuffer[2];

        const p3 =
            strokeBuffer[3];


        /*
            Start of stroke.
        */

        drawCurve(
            p0,
            p0,
            p1,
            p2,
            currentSpeed
        );


        /*
            Main curve.
        */

        drawCurve(
            p0,
            p1,
            p2,
            p3,
            currentSpeed
        );


        /*
            Keep the last three points.
        */

        strokeBuffer.shift();
    }
}


/* =========================================================
   MAIN V5 DRAW FUNCTION
========================================================= */

function drawLine(
    targetX,
    targetY
) {

    const now =
        performance.now();


    /*
        First point of a stroke.
    */

    if (
        previousRawX === null ||
        previousRawY === null
    ) {

        previousRawX =
            targetX;

        previousRawY =
            targetY;

        previousTime =
            now;

        smoothX =
            targetX;

        smoothY =
            targetY;

        previousX =
            targetX;

        previousY =
            targetY;

        strokeBuffer = [
            {
                x: targetX,
                y: targetY
            }
        ];

        isDrawing = true;

        return;
    }


    const rawDistance =
        distanceBetween(
            previousRawX,
            previousRawY,
            targetX,
            targetY
        );


    const deltaTime =
        Math.max(
            now - previousTime,
            1
        );


    /*
        Calculate hand velocity.
    */

    const speed =
        (
            rawDistance /
            deltaTime
        ) * 1000;


    currentSpeed =
        currentSpeed * 0.65 +
        speed * 0.35;


    /*
        Update raw tracking.
    */

    previousRawX =
        targetX;

    previousRawY =
        targetY;

    previousTime =
        now;


    /*
        Jump protection.

        If tracking suddenly teleports,
        start a fresh anchor instead of
        drawing a giant unwanted line.
    */

    if (
        rawDistance >
        MAX_REASONABLE_JUMP
    ) {

        smoothX =
            targetX;

        smoothY =
            targetY;

        previousX =
            targetX;

        previousY =
            targetY;

        strokeBuffer = [
            {
                x: targetX,
                y: targetY
            }
        ];

        return;
    }


    /*
        Dynamic V5 stabilization.
    */

    const smoothPoint =
        getSmoothPoint(
            targetX,
            targetY,
            currentSpeed
        );


    /*
        Prevent tiny jitter.
    */

    if (
        previousX !== null &&
        previousY !== null
    ) {

        const movement =
            distanceBetween(
                previousX,
                previousY,
                smoothPoint.x,
                smoothPoint.y
            );

        if (
            movement <
            MIN_POINT_DISTANCE
        ) {
            return;
        }
    }


    previousX =
        smoothPoint.x;

    previousY =
        smoothPoint.y;


    addStrokePoint(
        smoothPoint.x,
        smoothPoint.y
    );


    isDrawing = true;
}


/* =========================================================
   CURSOR
========================================================= */

function updateCursor(
    x,
    y
) {

    cursor.style.left =
        x + "px";

    cursor.style.top =
        y + "px";

    cursor.classList.remove(
        "hidden"
    );
}


function hideCursor() {

    cursor.classList.add(
        "hidden"
    );
}


/* =========================================================
   FINGER DETECTION
========================================================= */

function isFingerUp(
    landmarks,
    tip,
    pip
) {

    return (
        landmarks[tip].y <
        landmarks[pip].y
    );
}


/* =========================================================
   MEDIAPIPE
========================================================= */

const hands =
    new Hands({
        locateFile:
        function(file) {

            return (
                "https://cdn.jsdelivr.net/npm/" +
                "@mediapipe/hands/" +
                file
            );
        }
    });


hands.setOptions({

    maxNumHands: 1,

    modelComplexity: 1,

    minDetectionConfidence: 0.6,

    minTrackingConfidence: 0.6

});


/* =========================================================
   RESULTS
========================================================= */

hands.onResults(
    function(results) {

        if (
            clearCooldown > 0
        ) {

            clearCooldown--;
        }


        /*
            NO HAND
        */

        if (
            !results.multiHandLandmarks ||
            results.multiHandLandmarks.length === 0
        ) {

            handState.textContent =
                "SEARCHING";

            modeState.textContent =
                "STANDBY";

            handDot.style.background =
                "#555";

            handDot.style.boxShadow =
                "0 0 5px #555";

            stopDrawing();

            hideCursor();

            clearFrames = 0;

            return;
        }


        const landmarks =
            results.multiHandLandmarks[0];


        /*
            INDEX
        */

        const indexUp =
            isFingerUp(
                landmarks,
                8,
                6
            );


        /*
            MIDDLE
        */

        const middleUp =
            isFingerUp(
                landmarks,
                12,
                10
            );


        /*
            RING
        */

        const ringUp =
            isFingerUp(
                landmarks,
                16,
                14
            );


        /*
            PINKY
        */

        const pinkyUp =
            isFingerUp(
                landmarks,
                20,
                18
            );


        /*
            OPEN HAND
        */

        const fingersUp =
            Number(indexUp) +
            Number(middleUp) +
            Number(ringUp) +
            Number(pinkyUp);


        const openHand =
            fingersUp >= 3;


        /*
            PINCH
        */

        const thumb =
            landmarks[4];

        const indexTip =
            landmarks[8];


        const pinchDistance =
            Math.sqrt(
                Math.pow(
                    thumb.x -
                    indexTip.x,
                    2
                ) +
                Math.pow(
                    thumb.y -
                    indexTip.y,
                    2
                )
            );


        const isPinching =
            pinchDistance < 0.055;


        /*
            CURSOR
        */

        const x =
            (1 - indexTip.x) *
            window.innerWidth;

        const y =
            indexTip.y *
            window.innerHeight;


        updateCursor(
            x,
            y
        );


        handState.textContent =
            "DETECTED";

        handDot.style.background =
            "#ff00ff";

        handDot.style.boxShadow =
            "0 0 8px #ff00ff";


        /* =================================================
           CLEAR HAS HIGHEST PRIORITY
        ================================================= */

        if (openHand) {

            stopDrawing();

            modeState.textContent =
                "CLEARING";

            clearFrames++;


            if (
                clearFrames >=
                CLEAR_REQUIRED_FRAMES
            ) {

                if (
                    clearCooldown <= 0
                ) {

                    clearCanvas();

                    clearCooldown =
                        CLEAR_COOLDOWN_FRAMES;
                }

                clearFrames = 0;
            }

            return;
        }


        clearFrames = 0;


        /* =================================================
           PINCH = STOP
        ================================================= */

        if (isPinching) {

            stopDrawing();

            modeState.textContent =
                "STOP";

            return;
        }


        /* =================================================
           INDEX ONLY = DRAW
        ================================================= */

        if (
            indexUp &&
            !middleUp &&
            !ringUp &&
            !pinkyUp &&
            !isPinching
        ) {

            modeState.textContent =
                "DRAW";

            drawLine(
                x,
                y
            );

            return;
        }


        /*
            Unknown hand pose.
        */

        stopDrawing();

        modeState.textContent =
            "STANDBY";
    }
);


/* =========================================================
   START CAMERA
========================================================= */

startButton.addEventListener(
    "click",
    async function() {

        try {

            statusText.textContent =
                "Starting camera...";

            systemState.textContent =
                "STARTING";

            const stream =
                await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "user"
                    },
                    audio: false
                });


            video.srcObject =
                stream;


            const camera =
                new Camera(
                    video,
                    {

                        onFrame:
                        async function() {

                            await hands.send({
                                image: video
                            });

                        },

                        width: 1280,

                        height: 720

                    }
                );


            camera.start();


            statusText.textContent =
                "SYSTEM READY";

            systemState.textContent =
                "ONLINE";

            startButton.style.display =
                "none";

        }
        catch (error) {

            console.error(
                error
            );

            statusText.textContent =
                "CAMERA ERROR";

            systemState.textContent =
                "ERROR";

            alert(
                "Failed to start camera.\n\n" +
                error.message
            );
        }
    }
);

</script>
