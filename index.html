<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Air Maths Board - Stage 2</title>

<style>

/* =====================================
   GLOBAL
===================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: #020008;
    font-family: Arial, sans-serif;
}


/* =====================================
   CAMERA
===================================== */

#camera {
    position: fixed;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    transform: scaleX(-1);
    opacity: 0.30;
    z-index: 0;
}


/* =====================================
   FUTURISTIC GRID
===================================== */

#grid {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;

    background-image:
        linear-gradient(
            rgba(255, 0, 255, 0.13) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255, 0, 255, 0.13) 1px,
            transparent 1px
        );

    background-size: 55px 55px;

    opacity: 0.28;

    mask-image:
        radial-gradient(
            ellipse at center,
            black 25%,
            transparent 90%
        );
}


/* =====================================
   DRAWING CANVAS
===================================== */

#canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 2;
    pointer-events: none;
}


/* =====================================
   CORNER HUD
===================================== */

.corner {
    position: fixed;
    width: 55px;
    height: 55px;
    z-index: 6;
    pointer-events: none;
    opacity: 0.8;

    animation:
        cornerPulse 3s ease-in-out infinite;
}

.corner::before,
.corner::after {
    content: "";
    position: absolute;
    background: #ff00ff;

    box-shadow:
        0 0 7px #ff00ff,
        0 0 16px #ff00ff;
}


/* TOP LEFT */

.topLeft {
    top: 12px;
    left: 12px;
}

.topLeft::before {
    width: 42px;
    height: 2px;
    top: 0;
    left: 0;
}

.topLeft::after {
    width: 2px;
    height: 42px;
    top: 0;
    left: 0;
}


/* TOP RIGHT */

.topRight {
    top: 12px;
    right: 12px;
}

.topRight::before {
    width: 42px;
    height: 2px;
    top: 0;
    right: 0;
}

.topRight::after {
    width: 2px;
    height: 42px;
    top: 0;
    right: 0;
}


/* BOTTOM LEFT */

.bottomLeft {
    bottom: 12px;
    left: 12px;
}

.bottomLeft::before {
    width: 42px;
    height: 2px;
    bottom: 0;
    left: 0;
}

.bottomLeft::after {
    width: 2px;
    height: 42px;
    bottom: 0;
    left: 0;
}


/* BOTTOM RIGHT */

.bottomRight {
    bottom: 12px;
    right: 12px;
}

.bottomRight::before {
    width: 42px;
    height: 2px;
    bottom: 0;
    right: 0;
}

.bottomRight::after {
    width: 2px;
    height: 42px;
    bottom: 0;
    right: 0;
}


@keyframes cornerPulse {

    0%, 100% {
        opacity: 0.55;
    }

    50% {
        opacity: 1;
    }
}


/* =====================================
   TOP HUD
===================================== */

#topHUD {
    position: fixed;

    top: 18px;
    left: 72px;

    z-index: 10;

    padding: 11px 18px;

    min-width: 275px;

    color: white;

    background:
        rgba(5, 0, 18, 0.70);

    border:
        1px solid rgba(255, 0, 255, 0.55);

    border-left:
        3px solid #ff00ff;

    border-radius: 10px;

    box-shadow:
        0 0 15px rgba(255, 0, 255, 0.25),
        inset 0 0 20px rgba(255, 0, 255, 0.08);

    backdrop-filter:
        blur(10px);

    pointer-events: none;
}


/* =====================================
   TITLE
===================================== */

#title {
    color: white;

    font-size: 24px;

    font-weight: bold;

    letter-spacing: 1.5px;

    text-shadow:
        0 0 7px #ff00ff,
        0 0 17px #ff00ff,
        0 0 30px #ff00ff;
}


/* =====================================
   STATUS
===================================== */

#status {

    margin-top: 6px;

    color: #eeeeee;

    font-size: 13px;

    letter-spacing: 0.3px;

    text-shadow:
        0 0 8px #ff00ff;
}


/* =====================================
   SYSTEM HUD
===================================== */

#systemHUD {

    position: fixed;

    left: 18px;
    top: 125px;

    z-index: 10;

    width: 205px;

    padding: 13px 15px;

    color: white;

    background:
        linear-gradient(
            135deg,
            rgba(15, 0, 30, 0.78),
            rgba(4, 0, 15, 0.58)
        );

    border:
        1px solid rgba(255, 0, 255, 0.45);

    border-left:
        3px solid #ff00ff;

    border-radius: 9px;

    box-shadow:
        0 0 18px rgba(255, 0, 255, 0.25),
        inset 0 0 20px rgba(255, 0, 255, 0.07);

    backdrop-filter:
        blur(10px);

    font-size: 11px;

    letter-spacing: 0.7px;
}


/* HUD HEADER */

#hudHeader {

    margin-bottom: 9px;

    color: #ff66ff;

    font-size: 10px;

    font-weight: bold;

    letter-spacing: 2px;

    text-shadow:
        0 0 8px #ff00ff;
}


/* HUD LINE */

.hudLine {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 5px 0;

    border-bottom:
        1px solid
        rgba(255, 0, 255, 0.10);
}

.hudLine:last-child {
    border-bottom: none;
}


.hudLabel {
    opacity: 0.55;
}


.hudValue {

    color: #ff66ff;

    font-weight: bold;

    text-shadow:
        0 0 7px #ff00ff;
}


/* =====================================
   HAND STATUS
===================================== */

#handDot {

    display: inline-block;

    width: 7px;
    height: 7px;

    margin-right: 6px;

    border-radius: 50%;

    background: #777;

    transition: 0.2s;
}

#handDot.active {

    background: #ff00ff;

    box-shadow:
        0 0 6px #ff00ff,
        0 0 14px #ff00ff;

    animation:
        dotPulse 1.3s infinite;
}


@keyframes dotPulse {

    0%, 100% {
        opacity: 0.55;
    }

    50% {
        opacity: 1;
    }
}


/* =====================================
   INSTRUCTIONS
===================================== */

#instructions {

    position: fixed;

    right: 22px;
    top: 22px;

    z-index: 10;

    width: 205px;

    padding: 15px 17px;

    color: white;

    background:
        linear-gradient(
            135deg,
            rgba(12, 0, 28, 0.82),
            rgba(3, 0, 12, 0.68)
        );

    border:
        1px solid rgba(255, 0, 255, 0.55);

    border-radius: 12px;

    box-shadow:
        0 0 18px rgba(255, 0, 255, 0.25),
        inset 0 0 18px rgba(255, 0, 255, 0.08);

    backdrop-filter:
        blur(10px);

    font-size: 12px;

    line-height: 1.8;
}


/* INSTRUCTION HEADER */

#instructionHeader {

    margin-bottom: 6px;

    color: #ff66ff;

    font-size: 10px;

    font-weight: bold;

    letter-spacing: 2px;

    text-shadow:
        0 0 8px #ff00ff;
}


/* =====================================
   START BUTTON
===================================== */

#startButton {

    position: fixed;

    z-index: 20;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    padding: 18px 32px;

    border:
        2px solid #ff00ff;

    border-radius: 15px;

    background:
        rgba(255, 0, 255, 0.13);

    color: white;

    font-size: 19px;

    font-weight: bold;

    letter-spacing: 1.5px;

    box-shadow:
        0 0 10px #ff00ff,
        0 0 25px #ff00ff,
        inset 0 0 18px rgba(255, 0, 255, 0.18);

    backdrop-filter:
        blur(10px);

    cursor: pointer;

    animation:
        startPulse 2s ease-in-out infinite;

    transition:
        transform 0.15s,
        box-shadow 0.15s,
        background 0.15s;
}


#startButton:hover {

    transform:
        translate(-50%, -50%)
        scale(1.06);

    background:
        rgba(255, 0, 255, 0.25);

    box-shadow:
        0 0 15px #ff00ff,
        0 0 40px #ff00ff,
        inset 0 0 25px rgba(255, 0, 255, 0.25);
}


#startButton:active {

    transform:
        translate(-50%, -50%)
        scale(0.94);
}


@keyframes startPulse {

    0%, 100% {
        box-shadow:
            0 0 10px #ff00ff,
            0 0 25px #ff00ff,
            inset 0 0 18px rgba(255, 0, 255, 0.18);
    }

    50% {
        box-shadow:
            0 0 15px #ff00ff,
            0 0 40px #ff00ff,
            inset 0 0 25px rgba(255, 0, 255, 0.25);
    }
}


/* =====================================
   CURSOR
===================================== */

#cursor {

    position: fixed;

    width: 42px;
    height: 42px;

    border:
        3px solid #ff00ff;

    border-radius: 50%;

    pointer-events: none;

    z-index: 99999;

    display: none;

    transform:
        translate(-50%, -50%);

    background:
        rgba(255, 0, 255, 0.08);

    box-shadow:
        0 0 8px #ff00ff,
        0 0 18px #ff00ff,
        0 0 35px #ff00ff,
        inset 0 0 12px #ff00ff;

    transition:
        border-color 0.10s,
        box-shadow 0.10s;
}


/* DRAWING */

#cursor.drawing {

    border-color: white;

    box-shadow:
        0 0 8px white,
        0 0 18px #ff00ff,
        0 0 40px #ff00ff,
        inset 0 0 15px #ff00ff;
}


/* PINCH */

#cursor.pinch {

    border-color: #ff66ff;

    box-shadow:
        0 0 8px #ff66ff,
        0 0 22px #ff00ff,
        0 0 45px #ff00ff;
}


/* =====================================
   CURSOR CENTER
===================================== */

#cursor::after {

    content: "";

    position: absolute;

    width: 7px;
    height: 7px;

    background: white;

    border-radius: 50%;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    box-shadow:
        0 0 8px white,
        0 0 15px #ff00ff;
}


/* =====================================
   CURSOR MARKS
===================================== */

.cursorMark {

    position: absolute;

    background: #ff66ff;

    box-shadow:
        0 0 8px #ff00ff;
}


#markTop {
    width: 3px;
    height: 10px;
    left: 50%;
    top: -13px;
    transform: translateX(-50%);
}

#markBottom {
    width: 3px;
    height: 10px;
    left: 50%;
    bottom: -13px;
    transform: translateX(-50%);
}

#markLeft {
    width: 10px;
    height: 3px;
    left: -13px;
    top: 50%;
    transform: translateY(-50%);
}

#markRight {
    width: 10px;
    height: 3px;
    right: -13px;
    top: 50%;
    transform: translateY(-50%);
}


/* =====================================
   CLEAR FLASH
===================================== */

#clearFlash {

    position: fixed;

    inset: 0;

    z-index: 9999;

    pointer-events: none;

    opacity: 0;

    background:
        radial-gradient(
            circle at center,
            rgba(255, 0, 255, 0.45),
            rgba(255, 0, 255, 0.08) 35%,
            transparent 72%
        );
}


#clearFlash.active {

    animation:
        clearAnimation 0.55s ease-out;
}


@keyframes clearAnimation {

    0% {
        opacity: 0;
        transform: scale(0.8);
    }

    20% {
        opacity: 0.85;
    }

    100% {
        opacity: 0;
        transform: scale(1.15);
    }
}


/* =====================================
   MOBILE
===================================== */

@media (max-width: 600px) {

    #topHUD {

        top: 10px;
        left: 53px;

        min-width: 0;

        width: calc(100vw - 160px);

        padding: 8px 11px;
    }

    #title {
        font-size: 17px;
        letter-spacing: 0.6px;
    }

    #status {
        font-size: 10px;
        margin-top: 4px;
    }

    #instructions {

        top: 10px;
        right: 10px;

        width: 130px;

        padding: 9px 10px;

        font-size: 9px;

        line-height: 1.55;
    }

    #instructionHeader {
        font-size: 8px;
        margin-bottom: 3px;
    }

    #systemHUD {

        left: 10px;
        top: 88px;

        width: 150px;

        padding: 9px 10px;

        font-size: 9px;
    }

    #hudHeader {
        font-size: 8px;
        margin-bottom: 5px;
    }

    .hudLine {
        padding: 3px 0;
    }

    #cursor {

        width: 38px;
        height: 38px;
    }

    #startButton {

        padding: 15px 24px;

        font-size: 16px;
    }

    .corner {

        width: 38px;
        height: 38px;
    }

    .topLeft,
    .topRight {
        top: 7px;
    }

    .bottomLeft,
    .bottomRight {
        bottom: 7px;
    }

    .topLeft,
    .bottomLeft {
        left: 7px;
    }

    .topRight,
    .bottomRight {
        right: 7px;
    }
}


/* =====================================
   VERY SMALL PHONES
===================================== */

@media (max-width: 380px) {

    #topHUD {

        left: 48px;

        width: calc(100vw - 145px);
    }

    #title {
        font-size: 14px;
    }

    #status {
        font-size: 8px;
    }

    #instructions {

        width: 115px;

        font-size: 8px;
    }

    #systemHUD {

        width: 135px;

        font-size: 8px;
    }

}


/* =====================================
   LANDSCAPE MOBILE
===================================== */

@media (max-height: 500px) {

    #systemHUD {
        top: 72px;
    }

    #startButton {
        padding: 11px 21px;
        font-size: 14px;
    }

}

</style>
</head>


<body>


<!-- CAMERA -->

<video
    id="camera"
    autoplay
    playsinline>
</video>


<!-- GRID -->

<div id="grid"></div>


<!-- CANVAS -->

<canvas id="canvas"></canvas>


<!-- CORNER HUD -->

<div class="corner topLeft"></div>
<div class="corner topRight"></div>
<div class="corner bottomLeft"></div>
<div class="corner bottomRight"></div>


<!-- CURSOR -->

<div id="cursor">

    <div id="markTop" class="cursorMark"></div>
    <div id="markBottom" class="cursorMark"></div>
    <div id="markLeft" class="cursorMark"></div>
    <div id="markRight" class="cursorMark"></div>

</div>


<!-- TOP HUD -->

<div id="topHUD">

    <div id="title">
        ✨ AIR MATHS BOARD
    </div>

    <div id="status">
        Press START
    </div>

</div>


<!-- SYSTEM HUD -->

<div id="systemHUD">

    <div id="hudHeader">
        ◈ SYSTEM STATUS
    </div>

    <div class="hudLine">

        <span>
            <span id="handDot"></span>
            <span class="hudLabel">HAND</span>
        </span>

        <span
            id="handState"
            class="hudValue">
            SEARCHING
        </span>

    </div>


    <div class="hudLine">

        <span class="hudLabel">
            MODE
        </span>

        <span
            id="modeState"
            class="hudValue">
            STANDBY
        </span>

    </div>


    <div class="hudLine">

        <span class="hudLabel">
            SYSTEM
        </span>

        <span
            id="systemState"
            class="hudValue">
            OFFLINE
        </span>

    </div>

</div>


<!-- INSTRUCTIONS -->

<div id="instructions">

    <div id="instructionHeader">
        ◈ GESTURE CONTROL
    </div>

    ☝️ <b>Index</b> → Draw<br>

    🤏 <b>Pinch</b> → Stop<br>

    ✋ <b>Open Hand</b> → Clear

</div>


<!-- CLEAR EFFECT -->

<div id="clearFlash"></div>


<!-- START -->

<button id="startButton">
    START CAMERA
</button>


<!-- MEDIAPIPE -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>


<script>

/* =====================================
   ELEMENTS
===================================== */

const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const cursor =
    document.getElementById("cursor");

const startButton =
    document.getElementById("startButton");

const status =
    document.getElementById("status");

const handDot =
    document.getElementById("handDot");

const handState =
    document.getElementById("handState");

const modeState =
    document.getElementById("modeState");

const systemState =
    document.getElementById("systemState");

const clearFlash =
    document.getElementById("clearFlash");


let previousX = null;
let previousY = null;


/* =====================================
   FAST CURSOR SMOOTHING
===================================== */

let smoothX = null;
let smoothY = null;


function smoothPoint(targetX, targetY) {

    if (smoothX === null) {

        smoothX = targetX;
        smoothY = targetY;

        return;
    }


    const dx =
        targetX - smoothX;

    const dy =
        targetY - smoothY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    let adaptiveSmoothing;


    if (distance < 5) {

        adaptiveSmoothing = 0.75;

    }

    else if (distance < 20) {

        adaptiveSmoothing = 0.90;

    }

    else {

        adaptiveSmoothing = 0.97;

    }


    smoothX =
        smoothX +
        dx * adaptiveSmoothing;

    smoothY =
        smoothY +
        dy * adaptiveSmoothing;

}


/* =====================================
   CANVAS SIZE
===================================== */

function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

resizeCanvas();


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =====================================
   CLEAR BOARD
===================================== */

function clearCanvas() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    clearFlash.classList.remove("active");

    void clearFlash.offsetWidth;

    clearFlash.classList.add("active");

}


/* =====================================
   DISTANCE
===================================== */

function distance(a, b) {

    const dx =
        a.x - b.x;

    const dy =
        a.y - b.y;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =====================================
   FINGER UP
===================================== */

function fingerUp(
    landmarks,
    tip,
    joint
) {

    return (
        landmarks[tip].y <
        landmarks[joint].y
    );

}


/* =====================================
   CURSOR
===================================== */

function showCursor(x, y) {

    cursor.style.display =
        "block";

    cursor.style.left =
        x + "px";

    cursor.style.top =
        y + "px";

}


function hideCursor() {

    cursor.style.display =
        "none";

    cursor.classList.remove("drawing");
    cursor.classList.remove("pinch");

}


/* =====================================
   HAND HUD
===================================== */

function setHandDetected() {

    handDot.classList.add("active");

    handState.innerText =
        "DETECTED";

}


function setHandSearching() {

    handDot.classList.remove("active");

    handState.innerText =
        "SEARCHING";

}


/* =====================================
   DRAWING
===================================== */

function drawContinuousLine(
    x1,
    y1,
    x2,
    y2
) {

    const dx =
        x2 - x1;

    const dy =
        y2 - y1;


    const segmentDistance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const steps =
        Math.max(
            1,
            Math.ceil(
                segmentDistance / 3
            )
        );


    /* OUTER GLOW */

    ctx.beginPath();

    ctx.moveTo(x1, y1);


    for (
        let i = 1;
        i <= steps;
        i++
    ) {

        const t =
            i / steps;

        ctx.lineTo(
            x1 + dx * t,
            y1 + dy * t
        );

    }


    ctx.lineWidth = 13;

    ctx.lineCap = "round";

    ctx.lineJoin = "round";

    ctx.strokeStyle =
        "rgba(255, 0, 255, 0.35)";

    ctx.shadowColor =
        "#ff00ff";

    ctx.shadowBlur = 25;

    ctx.stroke();


    /* INNER NEON */

    ctx.beginPath();

    ctx.moveTo(x1, y1);


    for (
        let i = 1;
        i <= steps;
        i++
    ) {

        const t =
            i / steps;

        ctx.lineTo(
            x1 + dx * t,
            y1 + dy * t
        );

    }


    ctx.lineWidth = 5;

    ctx.lineCap = "round";

    ctx.lineJoin = "round";

    ctx.strokeStyle =
        "#ff66ff";

    ctx.shadowColor =
        "#ff00ff";

    ctx.shadowBlur = 12;

    ctx.stroke();


    /* WHITE CORE */

    ctx.beginPath();

    ctx.moveTo(x1, y1);


    for (
        let i = 1;
        i <= steps;
        i++
    ) {

        const t =
            i / steps;

        ctx.lineTo(
            x1 + dx * t,
            y1 + dy * t
        );

    }


    ctx.lineWidth = 2;

    ctx.lineCap = "round";

    ctx.lineJoin = "round";

    ctx.strokeStyle = "white";

    ctx.shadowColor = "white";

    ctx.shadowBlur = 5;

    ctx.stroke();


    ctx.shadowBlur = 0;

}


/* =====================================
   MEDIAPIPE
===================================== */

const hands =
    new Hands({

        locateFile:
        function(file) {

            return (
                "https://cdn.jsdelivr.net/npm/" +
                "@mediapipe/hands/" +
                file
            );

        }

    });


hands.setOptions({

    maxNumHands: 1,

    modelComplexity: 1,

    minDetectionConfidence: 0.6,

    minTrackingConfidence: 0.6

});


/* =====================================
   HAND RESULTS
===================================== */

hands.onResults(
function(results) {


    /* NO HAND */

    if (
        !results.multiHandLandmarks ||
        results.multiHandLandmarks.length === 0
    ) {

        previousX = null;
        previousY = null;

        smoothX = null;
        smoothY = null;

        hideCursor();

        setHandSearching();

        modeState.innerText =
            "STANDBY";

        status.innerText =
            "🖐️ Show your hand";

        return;

    }


    /* HAND DETECTED */

    setHandDetected();


    const hand =
        results.multiHandLandmarks[0];


    /* FINGER STATES */

    const indexUp =
        fingerUp(hand, 8, 6);

    const middleUp =
        fingerUp(hand, 12, 10);

    const ringUp =
        fingerUp(hand, 16, 14);

    const pinkyUp =
        fingerUp(hand, 20, 18);


    /* INDEX */

    const index =
        hand[8];


    const targetX =
        (1 - index.x) *
        canvas.width;


    const targetY =
        index.y *
        canvas.height;


    smoothPoint(
        targetX,
        targetY
    );


    const x =
        smoothX;

    const y =
        smoothY;


    showCursor(x, y);


    /* OPEN HAND */

    if (
        indexUp &&
        middleUp &&
        ringUp &&
        pinkyUp
    ) {

        clearCanvas();

        previousX = null;
        previousY = null;

        hideCursor();

        modeState.innerText =
            "CLEAR";

        status.innerText =
            "✋ BOARD CLEARED";

        return;

    }


    /* PINCH */

    const thumb =
        hand[4];


    const pinch =
        distance(
            thumb,
            index
        );


    /* DRAW */

    if (
        indexUp &&
        pinch > 0.07
    ) {

        cursor.classList.add("drawing");

        cursor.classList.remove("pinch");

        modeState.innerText =
            "DRAW";

        if (
            previousX !== null &&
            previousY !== null
        ) {

            drawContinuousLine(
                previousX,
                previousY,
                x,
                y
            );

        }


        previousX = x;
        previousY = y;


        status.innerText =
            "☝️ ✨ DRAWING IN AIR";

    }


    /* STOP */

    else {

        cursor.classList.remove("drawing");

        cursor.classList.add("pinch");

        previousX = null;
        previousY = null;

        modeState.innerText =
            "READY";

        status.innerText =
            "🤏 PINCH TO STOP • ☝️ POINT TO DRAW";

    }

});


/* =====================================
   START CAMERA
===================================== */

async function startCamera() {

    try {

        systemState.innerText =
            "STARTING";

        status.innerText =
            "🔄 INITIALIZING CAMERA...";


        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: "user"
                },

                audio: false

            });


        video.srcObject =
            stream;


        const camera =
            new Camera(
                video,
                {

                    onFrame:
                    async function() {

                        await hands.send({
                            image: video
                        });

                    },

                    width: 1280,

                    height: 720

                }
            );


        camera.start();


        startButton.style.display =
            "none";


        systemState.innerText =
            "ONLINE";

        status.innerText =
            "🟢 CAMERA READY • SHOW YOUR HAND";

    }


    catch(error) {

        console.error(error);


        systemState.innerText =
            "ERROR";

        status.innerText =
            "🔴 CAMERA PERMISSION DENIED";


        alert(
            "Camera could not be started. " +
            "Please allow camera permission " +
            "for this website."
        );

    }

}


/* =====================================
   START BUTTON
===================================== */

startButton.addEventListener(
    "click",
    startCamera
);

</script>
