<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Air Maths Board — Stage 1 Advanced v2</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}

#app {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

#video {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);
}

#canvas {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;
}

#cursor {
    position: absolute;

    width: 25px;
    height: 25px;

    border: 3px solid white;
    border-radius: 50%;

    transform: translate(-50%, -50%);

    pointer-events: none;

    display: none;

    will-change: left, top;
}

#controls {
    position: absolute;

    top: 15px;
    left: 15px;

    z-index: 20;

    display: flex;
    gap: 10px;
}

button {
    border: none;

    padding: 12px 18px;

    border-radius: 8px;

    background: white;
    color: black;

    font-size: 15px;
    font-weight: bold;
}

#status {
    position: absolute;

    bottom: 15px;
    left: 15px;

    z-index: 20;

    padding: 10px 14px;

    border-radius: 8px;

    background: rgba(0,0,0,0.7);

    color: white;

    font-size: 14px;
}
</style>
</head>

<body>

<div id="app">

    <video id="video"
           autoplay
           playsinline>
    </video>

    <canvas id="canvas"></canvas>

    <div id="cursor"></div>

    <div id="controls">
        <button id="startBtn">START</button>
        <button id="clearBtn">CLEAR</button>
    </div>

    <div id="status">
        Press START
    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const cursor =
    document.getElementById("cursor");

const startBtn =
    document.getElementById("startBtn");

const clearBtn =
    document.getElementById("clearBtn");

const status =
    document.getElementById("status");


/* =========================================================
   APPLICATION STATE
========================================================= */

let camera = null;

let running = false;

let gestureState = "IDLE";

let lastState = "IDLE";


/* =========================================================
   CURSOR FILTER
========================================================= */

let filteredX = null;
let filteredY = null;

let previousFilteredX = null;
let previousFilteredY = null;


/*
    Smaller = smoother
    Larger = faster

    We dynamically change this
    depending on hand movement.
*/

const SMOOTH_SLOW = 0.18;
const SMOOTH_FAST = 0.72;


/* =========================================================
   DRAWING
========================================================= */

let drawing = false;

let lastDrawX = null;
let lastDrawY = null;


/* =========================================================
   HAND LOSS
========================================================= */

let handMissingFrames = 0;

const HAND_LOSS_GRACE = 5;


/* =========================================================
   PINCH STATE
========================================================= */

let pinchEnterFrames = 0;
let pinchReleaseFrames = 0;

let pinchActive = false;


/*
    Hysteresis:

    Enter pinch:
    smaller distance

    Release pinch:
    larger distance

    This prevents flickering.
*/

const PINCH_ENTER = 0.055;
const PINCH_RELEASE = 0.085;

const PINCH_CONFIRM_FRAMES = 3;


/* =========================================================
   OPEN PALM
========================================================= */

let palmFrames = 0;

const PALM_CONFIRM_FRAMES = 7;

let lastClearTime = 0;

const CLEAR_COOLDOWN = 1000;


/* =========================================================
   CANVAS
========================================================= */

function resizeCanvas() {

    /*
        Preserve current drawing by
        copying it before resizing.
    */

    const oldCanvas =
        document.createElement("canvas");

    oldCanvas.width = canvas.width;
    oldCanvas.height = canvas.height;

    if (
        canvas.width > 0 &&
        canvas.height > 0
    ) {

        oldCanvas
            .getContext("2d")
            .drawImage(canvas, 0, 0);
    }


    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;


    ctx.lineWidth = 5;

    ctx.lineCap = "round";

    ctx.lineJoin = "round";


    /*
        Restore drawing using
        proportional scaling.
    */

    if (
        oldCanvas.width > 0 &&
        oldCanvas.height > 0
    ) {

        ctx.drawImage(
            oldCanvas,
            0,
            0,
            oldCanvas.width,
            oldCanvas.height,
            0,
            0,
            canvas.width,
            canvas.height
        );
    }
}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   CLEAR
========================================================= */

function clearBoard() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    resetDrawing();
}


/* =========================================================
   RESET DRAWING
========================================================= */

function resetDrawing() {

    drawing = false;

    lastDrawX = null;
    lastDrawY = null;
}


/* =========================================================
   RESET TRACKING
========================================================= */

function resetTracking() {

    filteredX = null;
    filteredY = null;

    previousFilteredX = null;
    previousFilteredY = null;

    resetDrawing();

    pinchEnterFrames = 0;
    pinchReleaseFrames = 0;

    pinchActive = false;

    palmFrames = 0;

    gestureState = "IDLE";
}


/* =========================================================
   DISTANCE
========================================================= */

function distance(a, b) {

    const dx =
        a.x - b.x;

    const dy =
        a.y - b.y;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


/* =========================================================
   FINGER DETECTION
========================================================= */

function fingerUp(
    hand,
    tip,
    pip
) {

    return (
        hand[tip].y <
        hand[pip].y
    );
}


/* =========================================================
   OPEN PALM
========================================================= */

function detectOpenPalm(hand) {

    const index =
        fingerUp(hand, 8, 6);

    const middle =
        fingerUp(hand, 12, 10);

    const ring =
        fingerUp(hand, 16, 14);

    const pinky =
        fingerUp(hand, 20, 18);


    return (
        index &&
        middle &&
        ring &&
        pinky
    );
}


/* =========================================================
   PINCH DISTANCE
========================================================= */

function getPinchDistance(hand) {

    return distance(
        hand[4],
        hand[8]
    );
}


/* =========================================================
   PINCH STATE MACHINE
========================================================= */

function updatePinch(hand) {

    const d =
        getPinchDistance(hand);


    /*
        Already pinching
    */

    if (pinchActive) {

        if (
            d > PINCH_RELEASE
        ) {

            pinchReleaseFrames++;

        }
        else {

            pinchReleaseFrames = 0;

        }


        if (
            pinchReleaseFrames >=
            PINCH_CONFIRM_FRAMES
        ) {

            pinchActive = false;

            pinchReleaseFrames = 0;

        }

        return pinchActive;
    }


    /*
        Not currently pinching
    */

    if (
        d < PINCH_ENTER
    ) {

        pinchEnterFrames++;

    }
    else {

        pinchEnterFrames = 0;

    }


    if (
        pinchEnterFrames >=
        PINCH_CONFIRM_FRAMES
    ) {

        pinchActive = true;

        pinchEnterFrames = 0;

    }


    return pinchActive;
}


/* =========================================================
   ADAPTIVE FINGERTIP FILTER
========================================================= */

function filterPosition(
    targetX,
    targetY
) {

    if (
        filteredX === null
    ) {

        filteredX = targetX;
        filteredY = targetY;

        previousFilteredX = targetX;
        previousFilteredY = targetY;

        return {
            x: filteredX,
            y: filteredY
        };
    }


    /*
        Estimate movement speed.
    */

    const movement =
        Math.sqrt(

            Math.pow(
                targetX - filteredX,
                2
            )

            +

            Math.pow(
                targetY - filteredY,
                2
            )

        );


    /*
        Convert movement into
        0 → 1.
    */

    const speed =
        Math.min(
            movement / 100,
            1
        );


    /*
        Slow hand:
        smoother

        Fast hand:
        more responsive
    */

    const alpha =
        SMOOTH_SLOW +

        (
            SMOOTH_FAST -
            SMOOTH_SLOW
        ) * speed;


    previousFilteredX =
        filteredX;

    previousFilteredY =
        filteredY;


    filteredX +=
        (
            targetX -
            filteredX
        ) * alpha;


    filteredY +=
        (
            targetY -
            filteredY
        ) * alpha;


    return {
        x: filteredX,
        y: filteredY
    };
}


/* =========================================================
   SAFE COORDINATES
========================================================= */

function safeCoordinates(
    x,
    y
) {

    /*
        Small edge buffer.

        Important:

        We DON'T shrink the
        usable drawing area.

        We only prevent impossible
        coordinates.
    */

    const margin = 2;


    return {

        x: Math.max(
            margin,
            Math.min(
                canvas.width - margin,
                x
            )
        ),

        y: Math.max(
            margin,
            Math.min(
                canvas.height - margin,
                y
            )
        )
    };
}


/* =========================================================
   GESTURE STATE MACHINE
========================================================= */

function updateGestureState(
    hand
) {

    const pinch =
        updatePinch(hand);


    /*
        Open palm gets priority.
    */

    const openPalm =
        detectOpenPalm(hand);


    if (openPalm) {

        palmFrames++;

    }
    else {

        palmFrames = 0;

    }


    /*
        CLEAR
    */

    if (
        palmFrames >=
        PALM_CONFIRM_FRAMES
    ) {

        if (
            Date.now() -
            lastClearTime >
            CLEAR_COOLDOWN
        ) {

            gestureState =
                "CLEAR";

            lastClearTime =
                Date.now();

            return;

        }
    }


    /*
        PINCH
    */

    if (pinch) {

        gestureState =
            "PINCH";

        return;

    }


    /*
        DRAW
    */

    gestureState =
        "DRAW";
}


/* =========================================================
   DRAW STROKE
========================================================= */

function drawAt(
    x,
    y
) {

    if (
        lastDrawX === null ||
        lastDrawY === null
    ) {

        lastDrawX = x;
        lastDrawY = y;

        return;
    }


    const movement =
        Math.sqrt(

            Math.pow(
                x - lastDrawX,
                2
            )

            +

            Math.pow(
                y - lastDrawY,
                2
            )
        );


    /*
        Ignore microscopic tracking noise.
    */

    if (
        movement < 1.5
    ) {

        return;

    }


    /*
        Prevent giant accidental
        strokes caused by tracking jumps.
    */

    if (
        movement > 100
    ) {

        lastDrawX = x;
        lastDrawY = y;

        return;
    }


    ctx.beginPath();

    ctx.moveTo(
        lastDrawX,
        lastDrawY
    );

    ctx.lineTo(
        x,
        y
    );

    ctx.stroke();


    lastDrawX = x;
    lastDrawY = y;
}


/* =========================================================
   MEDIAPIPE
========================================================= */

const hands =
    new Hands({

        locateFile:
            (file) => {

                return (
                    "https://cdn.jsdelivr.net/npm/" +
                    "@mediapipe/hands/" +
                    file
                );
            }
    });


hands.setOptions({

    maxNumHands: 1,

    modelComplexity: 1,

    minDetectionConfidence: 0.70,

    minTrackingConfidence: 0.70
});


/* =========================================================
   MEDIAPIPE RESULTS
========================================================= */

hands.onResults(
    (results) => {

        if (!running)
            return;


        /*
            NO HAND
        */

        if (
            !results.multiHandLandmarks ||
            results.multiHandLandmarks.length === 0
        ) {

            handMissingFrames++;


            /*
                Don't immediately kill
                tracking because one frame
                disappeared.
            */

            if (
                handMissingFrames <=
                HAND_LOSS_GRACE
            ) {

                return;
            }


            cursor.style.display =
                "none";


            resetTracking();


            status.textContent =
                "No hand detected";

            return;
        }


        handMissingFrames = 0;


        const hand =
            results.multiHandLandmarks[0];


        /*
            INDEX FINGERTIP
        */

        const index =
            hand[8];


        /*
            Mirror X
        */

        let targetX =
            (
                1 -
                index.x
            ) *
            canvas.width;


        let targetY =
            index.y *
            canvas.height;


        /*
            Clamp
        */

        const safe =
            safeCoordinates(
                targetX,
                targetY
            );


        targetX =
            safe.x;

        targetY =
            safe.y;


        /*
            FILTER
        */

        const position =
            filterPosition(
                targetX,
                targetY
            );


        const x =
            position.x;

        const y =
            position.y;


        /*
            CURSOR
        */

        cursor.style.display =
            "block";

        cursor.style.left =
            `${x}px`;

        cursor.style.top =
            `${y}px`;


        /*
            GESTURE ENGINE
        */

        updateGestureState(hand);


        /* =================================================
           CLEAR
        ================================================= */

        if (
            gestureState ===
            "CLEAR"
        ) {

            clearBoard();

            status.textContent =
                "Open palm — Board cleared";

            palmFrames = 0;

            gestureState =
                "IDLE";

            return;
        }


        /* =================================================
           PINCH
        ================================================= */

        if (
            gestureState ===
            "PINCH"
        ) {

            resetDrawing();

            status.textContent =
                "Pinch — Drawing OFF";

            return;
        }


        /* =================================================
           DRAW
        ================================================= */

        if (
            gestureState ===
            "DRAW"
        ) {

            drawing = true;

            status.textContent =
                "Index finger — Drawing";


            drawAt(
                x,
                y
            );

        }

    }
);


/* =========================================================
   START CAMERA
========================================================= */

startBtn.addEventListener(
    "click",
    () => {

        if (running)
            return;


        try {

            camera =
                new Camera(
                    video,
                    {

                        onFrame:
                            async () => {

                                await hands.send({
                                    image: video
                                });

                            },

                        width: 1280,

                        height: 720

                    }
                );


            camera.start();


            running = true;


            startBtn.textContent =
                "RUNNING";


            status.textContent =
                "Camera started — Show your hand";

        }

        catch (error) {

            console.error(error);

            status.textContent =
                "Camera failed to start";

        }

    }
);


/* =========================================================
   CLEAR BUTTON
========================================================= */

clearBtn.addEventListener(
    "click",
    () => {

        clearBoard();

        status.textContent =
            "Board cleared";

    }
);

</script>

</body>
</html>
