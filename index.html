<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Air Maths Board - Stage 1</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
    }

    #camera {
        position: fixed;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        transform: scaleX(-1);
        opacity: 0.35;
    }

    #canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
    }

    #title {
        position: fixed;
        top: 15px;
        left: 15px;
        z-index: 10;

        color: white;
        font-size: 25px;
        font-weight: bold;

        text-shadow:
            0 0 10px #ff00ff,
            0 0 20px #ff00ff;
    }

    #status {
        position: fixed;
        top: 55px;
        left: 15px;
        z-index: 10;

        color: white;
        font-size: 15px;
    }

    #startButton {
        position: fixed;
        z-index: 20;

        top: 50%;
        left: 50%;

        transform: translate(-50%, -50%);

        padding: 18px 30px;

        border: none;
        border-radius: 15px;

        background: #ff00ff;
        color: white;

        font-size: 20px;
        font-weight: bold;
    }

    #instructions {
        position: fixed;
        z-index: 10;

        right: 15px;
        top: 15px;

        color: white;

        background: rgba(0,0,0,0.6);

        padding: 12px;

        border-radius: 12px;

        font-size: 13px;
    }
</style>
</head>

<body>

<video id="camera" autoplay playsinline></video>

<canvas id="canvas"></canvas>

<div id="title">
    ✨ AIR MATHS BOARD
</div>

<div id="status">
    Press START
</div>

<div id="instructions">
    ☝️ Index finger = Draw<br>
    🤏 Pinch = Stop drawing<br>
    ✋ Open hand = Clear
</div>

<button id="startButton">
    START CAMERA
</button>


<!-- MediaPipe Hands -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>


<script>

const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const startButton =
    document.getElementById("startButton");

const status =
    document.getElementById("status");


let previousX = null;
let previousY = null;


// -------------------------------------
// CANVAS SIZE
// -------------------------------------

function resizeCanvas() {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


// -------------------------------------
// CLEAR
// -------------------------------------

function clearCanvas() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

}


// -------------------------------------
// DISTANCE
// -------------------------------------

function distance(a, b) {

    const dx = a.x - b.x;
    const dy = a.y - b.y;

    return Math.sqrt(
        dx * dx + dy * dy
    );

}


// -------------------------------------
// FINGER UP
// -------------------------------------

function fingerUp(
    landmarks,
    tip,
    joint
) {

    return (
        landmarks[tip].y <
        landmarks[joint].y
    );

}


// -------------------------------------
// MEDIAPIPE
// -------------------------------------

const hands =
    new Hands({

        locateFile: function(file) {

            return (
                "https://cdn.jsdelivr.net/npm/" +
                "@mediapipe/hands/" +
                file
            );

        }

    });


hands.setOptions({

    maxNumHands: 1,

    modelComplexity: 1,

    minDetectionConfidence: 0.6,

    minTrackingConfidence: 0.6

});


// -------------------------------------
// HAND RESULTS
// -------------------------------------

hands.onResults(function(results) {

    if (
        !results.multiHandLandmarks ||
        results.multiHandLandmarks.length === 0
    ) {

        previousX = null;
        previousY = null;

        status.innerText =
            "Show your hand";

        return;

    }


    const hand =
        results.multiHandLandmarks[0];


    // Index finger
    const indexUp =
        fingerUp(hand, 8, 6);


    // Other fingers
    const middleUp =
        fingerUp(hand, 12, 10);

    const ringUp =
        fingerUp(hand, 16, 14);

    const pinkyUp =
        fingerUp(hand, 20, 18);


    // ---------------------------------
    // OPEN PALM
    // ---------------------------------

    if (
        indexUp &&
        middleUp &&
        ringUp &&
        pinkyUp
    ) {

        clearCanvas();

        previousX = null;
        previousY = null;

        status.innerText =
            "✋ Open hand — board cleared";

        return;

    }


    // ---------------------------------
    // INDEX FINGER POSITION
    // ---------------------------------

    const index =
        hand[8];


    // Mirror X coordinate
    const x =
        (1 - index.x) *
        canvas.width;

    const y =
        index.y *
        canvas.height;


    // ---------------------------------
    // THUMB + INDEX PINCH
    // ---------------------------------

    const thumb =
        hand[4];

    const pinch =
        distance(
            thumb,
            index
        );


    // ---------------------------------
    // DRAWING
    // ---------------------------------

    if (
        indexUp &&
        pinch > 0.07
    ) {

        if (
            previousX !== null &&
            previousY !== null
        ) {

            ctx.beginPath();

            ctx.moveTo(
                previousX,
                previousY
            );

            ctx.lineTo(
                x,
                y
            );

            ctx.lineWidth = 7;

            ctx.lineCap = "round";

            ctx.lineJoin = "round";

            ctx.strokeStyle =
                "#ff00ff";

            ctx.shadowColor =
                "#ff00ff";

            ctx.shadowBlur = 15;

            ctx.stroke();

            ctx.shadowBlur = 0;

        }


        previousX = x;
        previousY = y;

        status.innerText =
            "☝️ Drawing in the air...";

    }

    else {

        previousX = null;
        previousY = null;

        status.innerText =
            "☝️ Point to draw";

    }

});


// -------------------------------------
// START CAMERA
// -------------------------------------

async function startCamera() {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: "user"
                },

                audio: false

            });


        video.srcObject =
            stream;


        const camera =
            new Camera(
                video,
                {

                    onFrame:
                    async function() {

                        await hands.send({
                            image: video
                        });

                    },

                    width: 1280,

                    height: 720

                }
            );


        camera.start();


        startButton.style.display =
            "none";


        status.innerText =
            "Camera ready! Show your hand.";

    }

    catch(error) {

        console.error(error);

        status.innerText =
            "Camera permission denied";

        alert(
            "Camera could not be started. " +
            "Please allow camera permission " +
            "for this website."
        );

    }

}


// -------------------------------------
// START BUTTON
// -------------------------------------

startButton.addEventListener(
    "click",
    startCamera
);

</script>

</body>
</html>
