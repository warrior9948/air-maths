<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Air Maths Board — Stage 1 Basic</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
        font-family: Arial, sans-serif;
    }

    #app {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
    }

    /* Camera */
    #video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
    }

    /* Drawing board */
    #canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }

    /* Simple cursor */
    #cursor {
        position: absolute;
        width: 24px;
        height: 24px;
        border: 3px solid white;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        display: none;
    }

    /* Controls */
    #controls {
        position: absolute;
        top: 15px;
        left: 15px;
        z-index: 10;
        display: flex;
        gap: 10px;
    }

    button {
        border: none;
        padding: 12px 18px;
        border-radius: 8px;
        background: white;
        color: black;
        font-size: 15px;
        font-weight: bold;
    }

    #status {
        position: absolute;
        bottom: 15px;
        left: 15px;
        z-index: 10;
        padding: 10px 14px;
        border-radius: 8px;
        background: rgba(0,0,0,0.65);
        color: white;
        font-size: 14px;
    }
</style>
</head>

<body>

<div id="app">

    <video id="video" autoplay playsinline></video>

    <canvas id="canvas"></canvas>

    <div id="cursor"></div>

    <div id="controls">
        <button id="startBtn">START</button>
        <button id="clearBtn">CLEAR</button>
    </div>

    <div id="status">Press START</div>

</div>


<!-- MediaPipe Hands -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>


<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const cursor = document.getElementById("cursor");
const startBtn = document.getElementById("startBtn");
const clearBtn = document.getElementById("clearBtn");
const status = document.getElementById("status");

let camera = null;
let running = false;

let drawing = false;

let lastX = null;
let lastY = null;


/* =========================
   CANVAS
========================= */

function resizeCanvas() {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);


/* =========================
   CLEAR BOARD
========================= */

function clearBoard() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    lastX = null;
    lastY = null;
}


/* =========================
   DISTANCE
========================= */

function distance(a, b) {

    const dx = a.x - b.x;
    const dy = a.y - b.y;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


/* =========================
   FINGER DETECTION
========================= */

function isFingerUp(landmarks, tip, pip) {

    return landmarks[tip].y <
           landmarks[pip].y;
}


/* =========================
   OPEN PALM
========================= */

function isOpenPalm(hand) {

    const index = isFingerUp(hand, 8, 6);
    const middle = isFingerUp(hand, 12, 10);
    const ring = isFingerUp(hand, 16, 14);
    const pinky = isFingerUp(hand, 20, 18);

    return index &&
           middle &&
           ring &&
           pinky;
}


/* =========================
   PINCH
========================= */

function isPinching(hand) {

    const thumb = hand[4];
    const index = hand[8];

    return distance(thumb, index) < 0.06;
}


/* =========================
   MEDIAPIPE
========================= */

const hands = new Hands({
    locateFile: (file) => {

        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

    }
});


hands.setOptions({

    maxNumHands: 1,

    modelComplexity: 1,

    minDetectionConfidence: 0.6,

    minTrackingConfidence: 0.6

});


/* =========================
   HAND RESULTS
========================= */

hands.onResults((results) => {

    if (!running) return;

    if (
        !results.multiHandLandmarks ||
        results.multiHandLandmarks.length === 0
    ) {

        cursor.style.display = "none";

        drawing = false;

        lastX = null;
        lastY = null;

        status.textContent = "No hand detected";

        return;
    }


    const hand =
        results.multiHandLandmarks[0];


    /* INDEX FINGER */

    const index = hand[8];


    /*
       MediaPipe coordinates:

       x = 0 → left
       x = 1 → right

       Because camera is mirrored,
       we reverse X.
    */

    const x =
        (1 - index.x) *
        canvas.width;

    const y =
        index.y *
        canvas.height;


    /* CURSOR */

    cursor.style.display = "block";

    cursor.style.left = `${x}px`;
    cursor.style.top = `${y}px`;


    /* =========================
       PINCH
    ========================= */

    if (isPinching(hand)) {

        drawing = false;

        lastX = null;
        lastY = null;

        status.textContent = "Pinch — Drawing OFF";

        return;
    }


    /* =========================
       OPEN PALM
    ========================= */

    if (isOpenPalm(hand)) {

        drawing = false;

        lastX = null;
        lastY = null;

        clearBoard();

        status.textContent =
            "Open palm — Board cleared";

        return;
    }


    /* =========================
       DRAWING
    ========================= */

    drawing = true;

    status.textContent =
        "Index finger — Drawing";


    if (lastX !== null && lastY !== null) {

        ctx.beginPath();

        ctx.moveTo(lastX, lastY);

        ctx.lineTo(x, y);

        ctx.stroke();

    }


    lastX = x;
    lastY = y;

});


/* =========================
   CAMERA
========================= */

startBtn.addEventListener("click", async () => {

    if (running) return;

    try {

        camera = new Camera(
            video,
            {
                onFrame: async () => {

                    await hands.send({
                        image: video
                    });

                },

                width: 1280,
                height: 720

            }
        );

        camera.start();

        running = true;

        startBtn.textContent = "RUNNING";

        status.textContent =
            "Camera started — Show your hand";

    }

    catch (error) {

        console.error(error);

        status.textContent =
            "Camera failed to start";

    }

});


/* =========================
   CLEAR BUTTON
========================= */

clearBtn.addEventListener(
    "click",
    clearBoard
);

</script>

</body>
</html>
