<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Air Maths Board</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05000a;
    font-family: Arial, sans-serif;
}

/* CAMERA */

#video {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);

    opacity: 0.30;

    z-index: 0;
}

/* GRID */

#grid {
    position: fixed;
    inset: 0;

    z-index: 1;

    pointer-events: none;

    background-image:
        linear-gradient(
            rgba(180, 80, 255, 0.12) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(180, 80, 255, 0.12) 1px,
            transparent 1px
        );

    background-size: 90px 90px;

    opacity: 0.45;

    mask-image:
        radial-gradient(
            circle,
            black 30%,
            transparent 90%
        );
}

/* DRAWING CANVAS */

#canvas {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 2;

    pointer-events: none;
}

/* TITLE */

#title {
    position: fixed;

    top: 25px;
    left: 50%;

    transform: translateX(-50%);

    color: white;

    font-size: 24px;
    font-weight: bold;

    letter-spacing: 3px;

    z-index: 10;

    text-shadow:
        0 0 8px #ff00ff,
        0 0 18px #ff00ff;
}

/* STATUS */

#status {
    position: fixed;

    top: 62px;
    left: 50%;

    transform: translateX(-50%);

    color: #ff66ff;

    font-size: 13px;

    letter-spacing: 2px;

    z-index: 10;
}

/* HUD */

#hud {
    position: fixed;

    top: 25px;
    left: 25px;

    width: 210px;

    padding: 15px;

    border:
        1px solid
        rgba(255, 80, 255, 0.35);

    background:
        rgba(10, 0, 20, 0.55);

    backdrop-filter: blur(8px);

    color: white;

    z-index: 10;

    font-size: 12px;
}

#hudHeader {
    color: #ff66ff;

    margin-bottom: 12px;

    letter-spacing: 2px;
}

.hudLine {
    display: flex;

    justify-content: space-between;

    margin-top: 8px;
}

.hudLabel {
    color: #aaa;
}

.hudValue {
    color: #fff;
}

#handDot {
    display: inline-block;

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #ff66ff;

    margin-right: 6px;

    box-shadow:
        0 0 8px #ff00ff;
}

/* GESTURE */

#gesture {
    position: fixed;

    bottom: 30px;
    left: 50%;

    transform: translateX(-50%);

    padding: 12px 20px;

    border:
        1px solid
        rgba(255, 80, 255, 0.35);

    background:
        rgba(10, 0, 20, 0.55);

    color: white;

    z-index: 10;

    font-size: 13px;

    letter-spacing: 1px;

    backdrop-filter: blur(8px);
}

#instructionHeader {
    color: #ff66ff;

    margin-bottom: 7px;

    text-align: center;

    font-size: 11px;

    letter-spacing: 2px;
}

/* START BUTTON */

#startButton {
    position: fixed;

    bottom: 95px;
    left: 50%;

    transform: translateX(-50%);

    padding: 12px 28px;

    border:
        1px solid
        #ff66ff;

    background:
        rgba(255, 0, 255, 0.12);

    color: white;

    border-radius: 8px;

    font-size: 14px;

    letter-spacing: 1px;

    z-index: 10;

    cursor: pointer;

    box-shadow:
        0 0 12px
        rgba(255, 0, 255, 0.35);
}

/* CURSOR */

#cursor {
    position: fixed;

    width: 42px;
    height: 42px;

    border:
        2px solid
        #ff66ff;

    border-radius: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 20;

    pointer-events: none;

    box-shadow:
        0 0 10px #ff00ff,
        inset 0 0 8px
        rgba(255, 0, 255, 0.35);
}

#cursor::after {
    content: "";

    position: absolute;

    width: 7px;
    height: 7px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    background: white;

    border-radius: 50%;

    box-shadow:
        0 0 8px white;
}

/* CURSOR MARKS */

.cursorMark {
    position: fixed;

    width: 8px;
    height: 8px;

    border-color: #ff66ff;

    z-index: 21;

    pointer-events: none;
}

#markTop {
    border-top: 2px solid;
}

#markBottom {
    border-bottom: 2px solid;
}

#markLeft {
    border-left: 2px solid;
}

#markRight {
    border-right: 2px solid;
}

</style>
</head>

<body>

<video id="video"
       autoplay
       playsinline>
</video>

<div id="grid"></div>

<canvas id="canvas"></canvas>

<div id="title">
    ✨ AIR MATHS BOARD
</div>

<div id="status">
    Press START
</div>

<div id="hud">

    <div id="hudHeader">
        ◈ SYSTEM STATUS
    </div>

    <div class="hudLine">
        <span>

            <span id="handDot"></span>

            <span class="hudLabel">
                HAND
            </span>

        </span>

        <span id="handState"
              class="hudValue">
            SEARCHING
        </span>
    </div>

    <div class="hudLine">

        <span class="hudLabel">
            MODE
        </span>

        <span id="modeState"
              class="hudValue">
            STANDBY
        </span>

    </div>

    <div class="hudLine">

        <span class="hudLabel">
            SYSTEM
        </span>

        <span id="systemState"
              class="hudValue">
            OFFLINE
        </span>

    </div>

</div>

<div id="gesture">

    <div id="instructionHeader">
        ◈ GESTURE
    </div>

    ☝️ <b>Draw</b>
    ·
    🤏 <b>Stop</b>
    ·
    ✋ <b>Clear</b>

</div>

<button id="startButton">
    START CAMERA
</button>

<div id="cursor"></div>

<div id="markTop"
     class="cursorMark"></div>

<div id="markBottom"
     class="cursorMark"></div>

<div id="markLeft"
     class="cursorMark"></div>

<div id="markRight"
     class="cursorMark"></div>


<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>


<script>

/* ================================
   ELEMENTS
================================ */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const cursor =
    document.getElementById("cursor");

const status =
    document.getElementById("status");

const startButton =
    document.getElementById("startButton");

const handState =
    document.getElementById("handState");

const modeState =
    document.getElementById("modeState");

const systemState =
    document.getElementById("systemState");


/* ================================
   CANVAS SIZE
================================ */

function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


/* ================================
   DRAWING STATE
================================ */

let isDrawing = false;

let previousX = null;
let previousY = null;

let smoothX = null;
let smoothY = null;

let previousRawX = null;
let previousRawY = null;

let previousTime = null;


/* ================================
   V3 DRAWING SETTINGS
================================ */

/*
   Slow movement:
   stronger smoothing

   Fast movement:
   weaker smoothing

   This gives us
   velocity-aware drawing.
*/

const SLOW_SMOOTHING = 0.28;

const FAST_SMOOTHING = 0.78;


/*
   Movement considered fast.
*/

const FAST_SPEED = 850;


/*
   Maximum realistic tracking jump.

   Larger movements are not
   immediately drawn as one huge line.
*/

const MAX_REASONABLE_JUMP = 320;


/*
   Interpolation step.

   Smaller number =
   more points in fast lines.
*/

const INTERPOLATION_STEP = 10;


/* ================================
   CLEAR SETTINGS
================================ */

let clearFrames = 0;

const CLEAR_REQUIRED_FRAMES = 5;

let clearCooldown = 0;

const CLEAR_COOLDOWN_FRAMES = 15;


/* ================================
   GESTURE HELPERS
================================ */

function isFingerUp(
    landmarks,
    tip,
    pip
) {

    return (
        landmarks[tip].y <
        landmarks[pip].y
    );

}


/* ================================
   CURSOR
================================ */

function updateCursor(x, y) {

    cursor.style.left =
        x + "px";

    cursor.style.top =
        y + "px";

}


function hideCursor() {

    cursor.style.display =
        "none";

}


function showCursor() {

    cursor.style.display =
        "block";

}


/* ================================
   RESET DRAWING
================================ */

function resetDrawingState() {

    isDrawing = false;

    previousX = null;
    previousY = null;

    smoothX = null;
    smoothY = null;

    previousRawX = null;
    previousRawY = null;

    previousTime = null;

}


/* ================================
   STOP DRAWING
================================ */

function stopDrawing() {

    resetDrawingState();

}


/* ================================
   CLEAR CANVAS
================================ */

function clearCanvas() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    resetDrawingState();

}


/* ================================
   VELOCITY-AWARE SMOOTHING
================================ */

function getSmoothing(speed) {

    if (speed <= 50) {

        return SLOW_SMOOTHING;

    }

    if (speed >= FAST_SPEED) {

        return FAST_SMOOTHING;

    }

    const ratio =
        speed / FAST_SPEED;

    return (
        SLOW_SMOOTHING +
        (
            FAST_SMOOTHING -
            SLOW_SMOOTHING
        ) *
        ratio
    );

}


/* ================================
   SMOOTH POINT
================================ */

function getSmoothPoint(
    targetX,
    targetY,
    speed
) {

    if (
        smoothX === null ||
        smoothY === null
    ) {

        smoothX = targetX;
        smoothY = targetY;

        return;

    }

    const smoothing =
        getSmoothing(speed);

    smoothX +=
        (
            targetX -
            smoothX
        ) *
        smoothing;

    smoothY +=
        (
            targetY -
            smoothY
        ) *
        smoothing;

}


/* ================================
   DRAW SEGMENT
================================ */

function drawSegment(
    x1,
    y1,
    x2,
    y2
) {

    /*
       GLOW
    */

    ctx.beginPath();

    ctx.moveTo(x1, y1);

    ctx.lineTo(x2, y2);

    ctx.strokeStyle =
        "rgba(255,0,255,0.35)";

    ctx.lineWidth = 13;

    ctx.lineCap = "round";

    ctx.lineJoin = "round";

    ctx.shadowColor =
        "#ff00ff";

    ctx.shadowBlur = 25;

    ctx.stroke();


    /*
       NEON
    */

    ctx.beginPath();

    ctx.moveTo(x1, y1);

    ctx.lineTo(x2, y2);

    ctx.strokeStyle =
        "#ff66ff";

    ctx.lineWidth = 5;

    ctx.lineCap = "round";

    ctx.lineJoin = "round";

    ctx.shadowColor =
        "#ff00ff";

    ctx.shadowBlur = 12;

    ctx.stroke();


    /*
       WHITE CORE
    */

    ctx.beginPath();

    ctx.moveTo(x1, y1);

    ctx.lineTo(x2, y2);

    ctx.strokeStyle =
        "#ffffff";

    ctx.lineWidth = 2;

    ctx.lineCap = "round";

    ctx.lineJoin = "round";

    ctx.shadowColor =
        "#ffffff";

    ctx.shadowBlur = 5;

    ctx.stroke();


    /*
       RESET shadow.
    */

    ctx.shadowBlur = 0;

}


/* ================================
   INTERPOLATED LINE
================================ */

function drawInterpolatedLine(
    x1,
    y1,
    x2,
    y2
) {

    const dx =
        x2 - x1;

    const dy =
        y2 - y1;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    /*
       Very small movement.
    */

    if (
        distance <=
        INTERPOLATION_STEP
    ) {

        drawSegment(
            x1,
            y1,
            x2,
            y2
        );

        return;

    }


    /*
       Number of interpolation
       points.
    */

    const steps =
        Math.ceil(
            distance /
            INTERPOLATION_STEP
        );


    let lastX = x1;
    let lastY = y1;


    for (
        let i = 1;
        i <= steps;
        i++
    ) {

        const t =
            i / steps;

        const currentX =
            x1 + dx * t;

        const currentY =
            y1 + dy * t;

        drawSegment(
            lastX,
            lastY,
            currentX,
            currentY
        );

        lastX = currentX;
        lastY = currentY;

    }

}


/* ================================
   V3 DRAW LINE
================================ */

function drawLine(
    targetX,
    targetY
) {

    const now =
        performance.now();


    /*
       FIRST POINT
    */

    if (
        previousRawX === null ||
        previousRawY === null
    ) {

        smoothX = targetX;
        smoothY = targetY;

        previousX = targetX;
        previousY = targetY;

        previousRawX = targetX;
        previousRawY = targetY;

        previousTime = now;

        isDrawing = true;

        return;

    }


    /*
       RAW MOVEMENT
    */

    const rawDX =
        targetX -
        previousRawX;

    const rawDY =
        targetY -
        previousRawY;

    const rawDistance =
        Math.sqrt(
            rawDX * rawDX +
            rawDY * rawDY
        );


    /*
       TIME
    */

    let deltaTime =
        now -
        previousTime;

    if (
        deltaTime < 1
    ) {

        deltaTime = 1;

    }


    /*
       VELOCITY
       pixels / second
    */

    const speed =
        (
            rawDistance /
            deltaTime
        ) *
        1000;


    /*
       SAVE RAW POINT
    */

    previousRawX =
        targetX;

    previousRawY =
        targetY;

    previousTime =
        now;


    /*
       JUMP PROTECTION
    */

    if (
        rawDistance >
        MAX_REASONABLE_JUMP
    ) {

        /*
           Do not create
           a massive unwanted
           line.

           Instead, re-anchor
           the pen.
        */

        smoothX =
            targetX;

        smoothY =
            targetY;

        previousX =
            targetX;

        previousY =
            targetY;

        return;

    }


    /*
       VELOCITY-AWARE
       SMOOTHING
    */

    getSmoothPoint(
        targetX,
        targetY,
        speed
    );


    /*
       DRAW DISTANCE
    */

    const drawDX =
        smoothX -
        previousX;

    const drawDY =
        smoothY -
        previousY;

    const drawDistance =
        Math.sqrt(
            drawDX * drawDX +
            drawDY * drawDY
        );


    /*
       Ignore tiny
       movements.
    */

    if (
        drawDistance <
        0.5
    ) {

        return;

    }


    /*
       FAST-LINE
       INTERPOLATION
    */

    drawInterpolatedLine(
        previousX,
        previousY,
        smoothX,
        smoothY
    );


    /*
       UPDATE DRAW POINT
    */

    previousX =
        smoothX;

    previousY =
        smoothY;

}


/* ================================
   MEDIAPIPE
================================ */

const hands =
    new Hands({

        locateFile:
        function(file) {

            return (
                "https://cdn.jsdelivr.net/npm/" +
                "@mediapipe/hands/" +
                file
            );

        }

    });


hands.setOptions({

    maxNumHands: 1,

    modelComplexity: 1,

    minDetectionConfidence: 0.6,

    minTrackingConfidence: 0.6

});


/* ================================
   RESULTS
================================ */

hands.onResults(
    function(results) {

        if (
            clearCooldown > 0
        ) {

            clearCooldown--;

        }


        /*
           NO HAND
        */

        if (
            !results.multiHandLandmarks ||
            results.multiHandLandmarks.length === 0
        ) {

            handState.textContent =
                "SEARCHING";

            modeState.textContent =
                "STANDBY";

            stopDrawing();

            hideCursor();

            clearFrames = 0;

            return;

        }


        const landmarks =
            results.multiHandLandmarks[0];


        showCursor();

        handState.textContent =
            "DETECTED";


        /*
           FINGERS
        */

        const indexUp =
            isFingerUp(
                landmarks,
                8,
                6
            );

        const middleUp =
            isFingerUp(
                landmarks,
                12,
                10
            );

        const ringUp =
            isFingerUp(
                landmarks,
                16,
                14
            );

        const pinkyUp =
            isFingerUp(
                landmarks,
                20,
                18
            );


        /*
           OPEN HAND
        */

        const fingersUp =
            Number(indexUp) +
            Number(middleUp) +
            Number(ringUp) +
            Number(pinkyUp);

        const openHand =
            fingersUp >= 3;


        /*
           PINCH
        */

        const thumbTip =
            landmarks[4];

        const indexTip =
            landmarks[8];


        const dx =
            thumbTip.x -
            indexTip.x;

        const dy =
            thumbTip.y -
            indexTip.y;


        const pinchDistance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        const isPinching =
            pinchDistance < 0.055;


        /*
           INDEX POSITION

           Camera is mirrored,
           so X is reversed.
        */

        const x =
            (
                1 -
                indexTip.x
            ) *
            window.innerWidth;

        const y =
            indexTip.y *
            window.innerHeight;


        updateCursor(
            x,
            y
        );


        /* ============================
           CLEAR — HIGHEST PRIORITY
        ============================ */

        if (openHand) {

            stopDrawing();

            modeState.textContent =
                "CLEARING";

            clearFrames++;

            if (
                clearFrames >=
                CLEAR_REQUIRED_FRAMES
            ) {

                if (
                    clearCooldown <= 0
                ) {

                    clearCanvas();

                    clearCooldown =
                        CLEAR_COOLDOWN_FRAMES;

                }

                clearFrames = 0;

            }

            return;

        }


        /*
           Reset clear counter
           if hand isn't open.
        */

        clearFrames = 0;


        /* ============================
           PINCH — STOP
        ============================ */

        if (isPinching) {

            stopDrawing();

            modeState.textContent =
                "STOP";

            return;

        }


        /* ============================
           DRAW
        ============================ */

        if (
            indexUp &&
            !middleUp &&
            !ringUp &&
            !pinkyUp &&
            !isPinching
        ) {

            modeState.textContent =
                "DRAWING";

            drawLine(
                x,
                y
            );

            return;

        }


        /*
           UNKNOWN HAND POSITION
        */

        stopDrawing();

        modeState.textContent =
            "STANDBY";

    });


/* ================================
   START CAMERA
================================ */

startButton.addEventListener(
    "click",
    async function() {

        try {

            status.textContent =
                "Starting camera...";

            systemState.textContent =
                "STARTING";

            const stream =
                await navigator.mediaDevices
                .getUserMedia({

                    video: {
                        facingMode: "user"
                    },

                    audio: false

                });


            video.srcObject =
                stream;


            const camera =
                new Camera(
                    video,
                    {

                        onFrame:
                        async function() {

                            await hands.send({
                                image: video
                            });

                        },

                        width: 1280,

                        height: 720

                    }
                );


            camera.start();


            status.textContent =
                "SYSTEM ONLINE";

            systemState.textContent =
                "ONLINE";

            startButton.style.display =
                "none";

        }

        catch(error) {

            console.error(error);

            status.textContent =
                "CAMERA ERROR";

            systemState.textContent =
                "ERROR";

        }

    });


/* ================================
   INITIAL STATE
================================ */

hideCursor();

</script>

</body>
</html>
