<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Air Maths Board</title>

<style>

/* =========================================================
   PROFESSIONAL UI FOUNDATION
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #101214;

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    color: #f5f7f9;
}


/* =========================================================
   CAMERA
========================================================= */

#video {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);

    opacity: 0.16;

    z-index: 0;
}


/* =========================================================
   PROFESSIONAL BOARD BACKGROUND
========================================================= */

#professionalBackground {
    position: fixed;
    inset: 0;

    z-index: 0;

    pointer-events: none;

    background:

        radial-gradient(
            circle at 50% 45%,
            rgba(255,255,255,0.025),
            transparent 42%
        ),

        linear-gradient(
            180deg,
            #151719 0%,
            #101214 100%
        );
}


/* =========================================================
   SUBTLE BOARD GRID
========================================================= */

#grid {
    position: fixed;
    inset: 0;

    z-index: 1;

    pointer-events: none;

    opacity: 0.16;

    background-image:

        linear-gradient(
            rgba(255,255,255,0.045) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,0.045) 1px,
            transparent 1px
        );

    background-size: 80px 80px;

    -webkit-mask-image:
        radial-gradient(
            ellipse at center,
            black 35%,
            transparent 92%
        );

    mask-image:
        radial-gradient(
            ellipse at center,
            black 35%,
            transparent 92%
        );
}


/* =========================================================
   BOARD VIGNETTE
========================================================= */

#vignette {
    position: fixed;
    inset: 0;

    z-index: 1;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 55%,
            rgba(0,0,0,0.24) 100%
        );
}


/* =========================================================
   TOP BAR
========================================================= */

#topBar {
    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    height: 68px;

    z-index: 10;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0 22px;

    background:
        rgba(15,17,19,0.86);

    border-bottom:
        1px solid
        rgba(255,255,255,0.07);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);
}


/* =========================================================
   BRAND
========================================================= */

#brand {
    display: flex;

    align-items: center;

    gap: 11px;
}

#brandMark {
    width: 30px;
    height: 30px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 8px;

    background:
        rgba(255,255,255,0.06);

    border:
        1px solid
        rgba(255,255,255,0.10);

    color: #ffffff;

    font-size: 14px;

    font-weight: 600;
}

#brandName {
    font-size: 14px;

    font-weight: 600;

    letter-spacing: 0.2px;

    color: #f4f5f6;
}

#brandSub {
    margin-left: 7px;

    color: #777d84;

    font-size: 11px;

    font-weight: 400;
}


/* =========================================================
   SYSTEM STATUS
========================================================= */

#topStatus {
    display: flex;

    align-items: center;

    gap: 8px;

    color: #9ba1a8;

    font-size: 11px;

    letter-spacing: 0.2px;
}

#systemIndicator {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #656a70;

    box-shadow:
        0 0 0 3px
        rgba(255,255,255,0.025);
}


/* =========================================================
   STATUS TEXT
========================================================= */

#status {
    position: fixed;

    top: 84px;
    left: 50%;

    transform:
        translateX(-50%);

    z-index: 10;

    padding:
        7px 12px;

    border-radius: 6px;

    color: #969ca3;

    background:
        rgba(20,22,24,0.72);

    border:
        1px solid
        rgba(255,255,255,0.06);

    font-size: 10px;

    letter-spacing: 0.6px;
}


/* =========================================================
   PROFESSIONAL HUD
========================================================= */

#hud {
    position: fixed;

    top: 86px;
    left: 20px;

    z-index: 10;

    width: 190px;

    padding: 14px;

    border-radius: 10px;

    background:
        rgba(19,21,23,0.86);

    border:
        1px solid
        rgba(255,255,255,0.075);

    box-shadow:
        0 8px 30px
        rgba(0,0,0,0.18);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);
}

#hudHeader {
    margin-bottom: 12px;

    color: #777e86;

    font-size: 9px;

    font-weight: 600;

    letter-spacing: 1.2px;

    text-transform: uppercase;
}

.hudLine {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    margin-top: 9px;

    font-size: 10px;
}

.hudLabel {
    color: #777e86;

    letter-spacing: 0.5px;
}

.hudValue {
    color: #dce0e4;

    letter-spacing: 0.2px;
}

#handDot {
    display: inline-block;

    width: 6px;
    height: 6px;

    margin-right: 6px;

    border-radius: 50%;

    background: #5f646a;

    box-shadow: none;
}


/* =========================================================
   GESTURE BAR
========================================================= */

#gesture {
    position: fixed;

    bottom: 20px;
    left: 50%;

    transform:
        translateX(-50%);

    z-index: 10;

    display: flex;

    align-items: center;

    gap: 18px;

    padding:
        10px 16px;

    border-radius: 8px;

    background:
        rgba(19,21,23,0.88);

    border:
        1px solid
        rgba(255,255,255,0.075);

    box-shadow:
        0 8px 30px
        rgba(0,0,0,0.20);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    color: #858b92;

    font-size: 10px;

    letter-spacing: 0.2px;

    white-space: nowrap;
}

#instructionHeader {
    color: #b7bdc4;

    font-size: 9px;

    font-weight: 600;

    letter-spacing: 0.9px;

    text-transform: uppercase;
}

#gesture b {
    color: #d9dde1;

    font-weight: 500;
}


/* =========================================================
   START BUTTON
========================================================= */

#startButton {
    position: fixed;

    bottom: 72px;
    left: 50%;

    transform:
        translateX(-50%);

    z-index: 10;

    padding:
        10px 20px;

    border:
        1px solid
        rgba(255,255,255,0.12);

    border-radius: 7px;

    background:
        rgba(31,34,37,0.94);

    color: #eef0f2;

    font-size: 10px;

    font-weight: 600;

    letter-spacing: 0.7px;

    cursor: pointer;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,0.25);

    transition:
        background 160ms ease,
        border-color 160ms ease,
        transform 160ms ease;
}

#startButton:hover {

    background:
        rgba(42,45,48,0.98);

    border-color:
        rgba(255,255,255,0.18);
}

#startButton:active {

    transform:
        translateX(-50%)
        translateY(1px);
}


/* =========================================================
   CURSOR
========================================================= */

#cursor {
    position: fixed;

    width: 30px;
    height: 30px;

    border:
        1px solid
        rgba(255,255,255,0.90);

    border-radius: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 8;

    pointer-events: none;

    box-shadow:
        0 0 0 4px
        rgba(255,255,255,0.035);

    transition:
        width 100ms ease,
        height 100ms ease;
}

#cursor::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 4px;
    height: 4px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: #ffffff;
}


/* =========================================================
   CURSOR MARKERS
========================================================= */

.cursorMark {
    position: fixed;

    width: 7px;
    height: 7px;

    z-index: 9;

    border-color:
        rgba(255,255,255,0.65);

    pointer-events: none;
}

#markTop {
    border-top: 1px solid;
    border-left: 1px solid;
}

#markBottom {
    border-bottom: 1px solid;
    border-right: 1px solid;
}

#markLeft {
    border-left: 1px solid;
    border-bottom: 1px solid;
}

#markRight {
    border-right: 1px solid;
    border-top: 1px solid;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    #topBar {
        height: 58px;

        padding:
            0 14px;
    }

    #brandSub {
        display: none;
    }

    #brandName {
        font-size: 13px;
    }

    #hud {
        top: 70px;
        left: 12px;

        width: 165px;

        padding: 11px;
    }

    #status {
        top: 68px;

        font-size: 9px;
    }

    #gesture {
        bottom: 12px;

        gap: 10px;

        padding:
            9px 11px;

        font-size: 9px;
    }

    #instructionHeader {
        display: none;
    }

    #startButton {
        bottom: 58px;
    }

    #cursor {
        width: 26px;
        height: 26px;
    }
}


.hidden {
    display: none !important;
}

</style>
</head>


<body>


<!-- =======================================================

<div id="professionalBackground"></div>

<div id="topBar">

<!-- =======================================================

======================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const cursor =
    document.getElementById("cursor");

const startButton =
    document.getElementById("startButton");

const statusText =
    document.getElementById("status");

const handState =
    document.getElementById("handState");

const modeState =
    document.getElementById("modeState");

const systemState =
    document.getElementById("systemState");

const handDot =
    document.getElementById("handDot");

const systemIndicator =
    document.getElementById(
        "systemIndicator"
    );

const topStatusText =
    document.getElementById(
        "topStatusText"
    );


/* =========================================================
   CANVAS SETUP
========================================================= */

function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   DRAWING STATE
========================================================= */

let isDrawing = false;

let previousX = null;
let previousY = null;

let smoothX = null;
let smoothY = null;

let previousRawX = null;
let previousRawY = null;

let previousTime = null;

let currentSpeed = 0;

let currentDirection = null;

let strokeBuffer = [];


/* =========================================================
   ADVANCED SETTINGS
========================================================= */

const SLOW_SMOOTHING = 0.20;

const FAST_SMOOTHING = 0.88;

const FAST_SPEED = 850;

const MAX_REASONABLE_JUMP = 400;

const MICRO_JITTER_DISTANCE = 0.65;

const MIN_POINT_DISTANCE = 1.0;

const MIN_INK_WIDTH = 2.6;

const MAX_INK_WIDTH = 5.4;

const CURVE_TENSION = 1 / 6;

let clearFrames = 0;

const CLEAR_REQUIRED_FRAMES = 5;

let clearCooldown = 0;

const CLEAR_COOLDOWN_FRAMES = 15;


/* =========================================================
   DISTANCE
========================================================= */

function distanceBetween(
    x1,
    y1,
    x2,
    y2
) {

    const dx =
        x2 - x1;

    const dy =
        y2 - y1;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


/* =========================================================
   ANGLE DIFFERENCE
========================================================= */

function angleDifference(
    a,
    b
) {

    let difference =
        a - b;


    while (
        difference > Math.PI
    ) {

        difference -=
            Math.PI * 2;
    }


    while (
        difference < -Math.PI
    ) {

        difference +=
            Math.PI * 2;
    }


    return Math.abs(
        difference
    );
}


/* =========================================================
   DIRECTION
========================================================= */

function getDirection(
    p1,
    p2
) {

    if (
        !p1 ||
        !p2
    ) {

        return null;
    }


    return Math.atan2(

        p2.y - p1.y,

        p2.x - p1.x

    );
}


/* =========================================================
   ADAPTIVE SMOOTHING
========================================================= */

function getSmoothing(
    speed,
    directionChange
) {

    if (
        speed <= 50
    ) {

        return SLOW_SMOOTHING;
    }


    if (
        speed >= FAST_SPEED
    ) {

        return FAST_SMOOTHING;
    }


    const ratio =
        (
            speed - 50
        ) /
        (
            FAST_SPEED - 50
        );


    let smoothing =
        SLOW_SMOOTHING +

        (
            FAST_SMOOTHING -
            SLOW_SMOOTHING
        ) *

        ratio;


    if (
        directionChange > 1.6
    ) {

        smoothing *= 0.78;
    }


    return Math.max(
        0.15,
        Math.min(
            smoothing,
            0.90
        )
    );
}


/* =========================================================
   SMOOTH POINT
========================================================= */

function getSmoothPoint(
    targetX,
    targetY,
    speed,
    directionChange
) {

    if (
        smoothX === null ||
        smoothY === null
    ) {

        smoothX =
            targetX;

        smoothY =
            targetY;


        return {
            x: smoothX,
            y: smoothY
        };
    }


    const smoothing =
        getSmoothing(
            speed,
            directionChange
        );


    smoothX +=
        (
            targetX -
            smoothX
        ) *
        smoothing;


    smoothY +=
        (
            targetY -
            smoothY
        ) *
        smoothing;


    return {
        x: smoothX,
        y: smoothY
    };
}


/* =========================================================
   DYNAMIC PEN WIDTH
========================================================= */

function getPenWidth(
    speed,
    directionChange
) {

    const ratio =
        Math.min(
            speed / FAST_SPEED,
            1
        );


    let width =
        MAX_INK_WIDTH -

        (
            MAX_INK_WIDTH -
            MIN_INK_WIDTH
        ) *

        ratio;


    if (
        directionChange > 1.7
    ) {

        width *= 1.06;
    }


    return width;
}


/* =========================================================
   NATURAL GLOW
========================================================= */

function getGlowAlpha(
    speed
) {

    const ratio =
        Math.min(
            speed / FAST_SPEED,
            1
        );


    return (
        0.23 -
        ratio * 0.09
    );
}


/* =========================================================
   DRAW CURVE
========================================================= */

function drawCurve(
    p0,
    p1,
    p2,
    p3,
    speed,
    directionChange
) {

    const cp1x =
        p1.x +
        (
            p2.x -
            p0.x
        ) *
        CURVE_TENSION;


    const cp1y =
        p1.y +
        (
            p2.y -
            p0.y
        ) *
        CURVE_TENSION;


    const cp2x =
        p2.x -
        (
            p3.x -
            p1.x
        ) *
        CURVE_TENSION;


    const cp2y =
        p2.y -
        (
            p3.y -
            p1.y
        ) *
        CURVE_TENSION;


    const width =
        getPenWidth(
            speed,
            directionChange
        );


    const glowAlpha =
        getGlowAlpha(
            speed
        );


    ctx.beginPath();

    ctx.moveTo(
        p1.x,
        p1.y
    );

    ctx.bezierCurveTo(

        cp1x,
        cp1y,

        cp2x,
        cp2y,

        p2.x,
        p2.y

    );


    ctx.strokeStyle =
        `rgba(120,190,255,${glowAlpha})`;

    ctx.lineWidth =
        width * 2.6;

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.shadowColor =
        "rgba(100,180,255,0.45)";

    ctx.shadowBlur =
        18;

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        p1.x,
        p1.y
    );

    ctx.bezierCurveTo(

        cp1x,
        cp1y,

        cp2x,
        cp2y,

        p2.x,
        p2.y

    );


    ctx.strokeStyle =
        "rgba(150,210,255,0.96)";

    ctx.lineWidth =
        width;

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.shadowColor =
        "rgba(100,190,255,0.60)";

    ctx.shadowBlur =
        7;

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        p1.x,
        p1.y
    );

    ctx.bezierCurveTo(

        cp1x,
        cp1y,

        cp2x,
        cp2y,

        p2.x,
        p2.y

    );


    ctx.strokeStyle =
        "rgba(255,255,255,0.90)";

    ctx.lineWidth =
        Math.max(
            1.15,
            width * 0.30
        );

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.shadowColor =
        "rgba(255,255,255,0.35)";

    ctx.shadowBlur =
        3;

    ctx.stroke();


    ctx.shadowBlur = 0;
}


/* =========================================================
   DOT
========================================================= */

function drawDot(
    point
) {

    ctx.beginPath();

    ctx.arc(
        point.x,
        point.y,
        MAX_INK_WIDTH / 2,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "rgba(255,255,255,0.92)";

    ctx.shadowColor =
        "rgba(130,200,255,0.75)";

    ctx.shadowBlur =
        8;

    ctx.fill();

    ctx.shadowBlur = 0;
}


/* =========================================================
   ADD POINT
========================================================= */

function addStrokePoint(
    point
) {

    const last =
        strokeBuffer[
            strokeBuffer.length - 1
        ];


    if (last) {

        const d =
            distanceBetween(

                last.x,
                last.y,

                point.x,
                point.y
            );


        if (
            d <
            MICRO_JITTER_DISTANCE
        ) {

            return;
        }


        if (
            d <
            MIN_POINT_DISTANCE
        ) {

            return;
        }
    }


    strokeBuffer.push(
        point
    );


    if (
        strokeBuffer.length === 4
    ) {

        const p0 =
            strokeBuffer[0];

        const p1 =
            strokeBuffer[1];

        const p2 =
            strokeBuffer[2];

        const p3 =
            strokeBuffer[3];


        const direction1 =
            getDirection(
                p0,
                p1
            );


        const direction2 =
            getDirection(
                p1,
                p2
            );


        let corner =
            0;


        if (
            direction1 !== null &&
            direction2 !== null
        ) {

            corner =
                angleDifference(
                    direction1,
                    direction2
                );
        }


        drawCurve(
            p0,
            p0,
            p1,
            p2,
            currentSpeed,
            corner
        );


        drawCurve(
            p0,
            p1,
            p2,
            p3,
            currentSpeed,
            corner
        );


        strokeBuffer.shift();
    }
}


/* =========================================================
   FLUSH FINAL POINTS
========================================================= */

function flushStrokeBuffer() {

    const count =
        strokeBuffer.length;


    if (
        count === 0
    ) {

        return;
    }


    if (
        count === 1
    ) {

        drawDot(
            strokeBuffer[0]
        );

        return;
    }


    if (
        count === 2
    ) {

        const p0 =
            strokeBuffer[0];

        const p1 =
            strokeBuffer[1];


        ctx.beginPath();

        ctx.moveTo(
            p0.x,
            p0.y
        );

        ctx.lineTo(
            p1.x,
            p1.y
        );


        ctx.strokeStyle =
            "rgba(150,210,255,0.96)";

        ctx.lineWidth =
            MAX_INK_WIDTH;

        ctx.lineCap =
            "round";

        ctx.lineJoin =
            "round";

        ctx.shadowColor =
            "rgba(100,190,255,0.60)";

        ctx.shadowBlur =
            8;

        ctx.stroke();

        ctx.shadowBlur = 0;

        return;
    }


    if (
        count === 3
    ) {

        const p0 =
            strokeBuffer[0];

        const p1 =
            strokeBuffer[1];

        const p2 =
            strokeBuffer[2];


        drawCurve(
            p0,
            p0,
            p1,
            p2,
            currentSpeed,
            0
        );


        drawCurve(
            p0,
            p1,
            p2,
            p2,
            currentSpeed,
            0
        );


        return;
    }


    const p0 =
        strokeBuffer[
            count - 3
        ];

    const p1 =
        strokeBuffer[
            count - 2
        ];

    const p2 =
        strokeBuffer[
            count - 1
        ];


    drawCurve(
        p0,
        p1,
        p2,
        p2,
        currentSpeed,
        0
    );
}


/* =========================================================
   RESET
========================================================= */

function resetDrawingState() {

    isDrawing = false;

    previousX = null;
    previousY = null;

    smoothX = null;
    smoothY = null;

    previousRawX = null;
    previousRawY = null;

    previousTime = null;

    currentSpeed = 0;

    currentDirection = null;

    strokeBuffer = [];
}


/* =========================================================
   STOP
========================================================= */

function stopDrawing() {

    if (
        isDrawing
    ) {

        flushStrokeBuffer();
    }


    resetDrawingState();
}


/* =========================================================
   CLEAR
========================================================= */

function clearCanvas() {

    ctx.clearRect(

        0,
        0,

        canvas.width,
        canvas.height

    );


    resetDrawingState();
}


/* =========================================================
   MAIN DRAW FUNCTION
========================================================= */

function drawLine(
    targetX,
    targetY
) {

    const now =
        performance.now();


    if (
        previousRawX === null
    ) {

        previousRawX =
            targetX;

        previousRawY =
            targetY;

        previousTime =
            now;


        smoothX =
            targetX;

        smoothY =
            targetY;


        previousX =
            targetX;

        previousY =
            targetY;


        currentDirection =
            null;


        strokeBuffer = [

            {
                x: targetX,
                y: targetY
            }

        ];


        isDrawing = true;

        return;
    }


    const rawDistance =
        distanceBetween(

            previousRawX,
            previousRawY,

            targetX,
            targetY
        );


    const deltaTime =
        Math.max(

            now -
            previousTime,

            1
        );


    const instantSpeed =
        (
            rawDistance /
            deltaTime
        ) *
        1000;


    currentSpeed =

        currentSpeed *
        0.65 +

        instantSpeed *
        0.35;


    const newDirection =
        Math.atan2(

            targetY -
            previousRawY,

            targetX -
            previousRawX

        );


    let directionChange = 0;


    if (
        currentDirection !== null
    ) {

        directionChange =
            angleDifference(

                currentDirection,
                newDirection

            );
    }


    currentDirection =
        newDirection;


    previousRawX =
        targetX;

    previousRawY =
        targetY;

    previousTime =
        now;


    if (
        rawDistance >
        MAX_REASONABLE_JUMP
    ) {

        smoothX =
            targetX;

        smoothY =
            targetY;


        previousX =
            targetX;

        previousY =
            targetY;


        strokeBuffer = [

            {
                x: targetX,
                y: targetY
            }

        ];


        return;
    }


    const smoothPoint =
        getSmoothPoint(

            targetX,
            targetY,

            currentSpeed,
            directionChange
        );


    if (
        previousX !== null &&
        previousY !== null
    ) {

        const movement =
            distanceBetween(

                previousX,
                previousY,

                smoothPoint.x,
                smoothPoint.y

            );


        if (
            movement <
            MICRO_JITTER_DISTANCE
        ) {

            return;
        }
    }


    previousX =
        smoothPoint.x;

    previousY =
        smoothPoint.y;


    addStrokePoint({

        x: smoothPoint.x,

        y: smoothPoint.y

    });


    isDrawing = true;
}


/* =========================================================
   CURSOR
========================================================= */

function updateCursor(
    x,
    y
) {

    cursor.style.left =
        x + "px";

    cursor.style.top =
        y + "px";


    cursor.classList.remove(
        "hidden"
    );
}


function hideCursor() {

    cursor.classList.add(
        "hidden"
    );
}


/* =========================================================
   FINGER DETECTION
========================================================= */

function isFingerUp(
    landmarks,
    tip,
    pip
) {

    return (
        landmarks[tip].y <
        landmarks[pip].y
    );
}


/* =========================================================
   MEDIAPIPE
========================================================= */

const hands =
    new Hands({

        locateFile:
        function(file) {

            return (

                "https://cdn.jsdelivr.net/npm/" +
                "@mediapipe/hands/" +
                file

            );
        }

    });


hands.setOptions({

    maxNumHands: 1,

    modelComplexity: 1,

    minDetectionConfidence: 0.6,

    minTrackingConfidence: 0.6

});


/* =========================================================
   HAND RESULTS
========================================================= */

hands.onResults(
function(results) {


    if (
        clearCooldown > 0
    ) {

        clearCooldown--;
    }


    if (

        !results.multiHandLandmarks ||

        results.multiHandLandmarks.length === 0

    ) {

        handState.textContent =
            "Searching";

        modeState.textContent =
            "Standby";

        handDot.style.background =
            "#5f646a";

        handDot.style.boxShadow =
            "none";

        stopDrawing();

        hideCursor();

        clearFrames = 0;

        return;
    }


    const landmarks =
        results.multiHandLandmarks[0];


    const indexUp =
        isFingerUp(
            landmarks,
            8,
            6
        );


    const middleUp =
        isFingerUp(
            landmarks,
            12,
            10
        );


    const ringUp =
        isFingerUp(
            landmarks,
            16,
            14
        );


    const pinkyUp =
        isFingerUp(
            landmarks,
            20,
            18
        );


    const fingersUp =

        Number(indexUp) +
        Number(middleUp) +
        Number(ringUp) +
        Number(pinkyUp);


    const openHand =
        fingersUp >= 3;


    const thumb =
        landmarks[4];

    const indexTip =
        landmarks[8];


    const pinchDistance =
        Math.sqrt(

            Math.pow(
                thumb.x -
                indexTip.x,
                2
            ) +

            Math.pow(
                thumb.y -
                indexTip.y,
                2
            )

        );


    const isPinching =
        pinchDistance < 0.055;


    const x =
        (
            1 -
            indexTip.x
        ) *
        window.innerWidth;


    const y =
        indexTip.y *
        window.innerHeight;


    updateCursor(
        x,
        y
    );


    handState.textContent =
        "Active";


    handDot.style.background =
        "#8bbcff";

    handDot.style.boxShadow =
        "0 0 0 3px rgba(139,188,255,0.10)";


    if (
        openHand
    ) {

        stopDrawing();

        modeState.textContent =
            "Clearing";

        clearFrames++;


        if (
            clearFrames >=
            CLEAR_REQUIRED_FRAMES
        ) {

            if (
                clearCooldown <= 0
            ) {

                clearCanvas();

                clearCooldown =
                    CLEAR_COOLDOWN_FRAMES;
            }


            clearFrames = 0;
        }


        return;
    }


    clearFrames = 0;


    if (
        isPinching
    ) {

        stopDrawing();

        modeState.textContent =
            "Paused";

        return;
    }


    if (

        indexUp &&

        !middleUp &&

        !ringUp &&

        !pinkyUp &&

        !isPinching

    ) {

        modeState.textContent =
            "Drawing";

        drawLine(
            x,
            y
        );

        return;
    }


    stopDrawing();

    modeState.textContent =
        "Standby";

});


/* =========================================================
   START CAMERA
========================================================= */

startButton.addEventListener(
"click",
async function() {

    try {

        statusText.textContent =
            "Starting camera...";

        systemState.textContent =
            "Starting";

        topStatusText.textContent =
            "Starting";


        const stream =
            await navigator
            .mediaDevices
            .getUserMedia({

                video: {

                    facingMode:
                        "user"

                },

                audio: false

            });


        video.srcObject =
            stream;


        const camera =
            new Camera(

                video,

                {

                    onFrame:
                    async function() {

                        await hands.send({

                            image:
                                video

                        });

                    },

                    width: 1280,

                    height: 720

                }

            );


        camera.start();


        statusText.textContent =
            "SYSTEM READY";

        systemState.textContent =
            "Online";

        topStatusText.textContent =
            "Ready";

        systemIndicator.style.background =
            "#8bbcff";

        systemIndicator.style.boxShadow =
            "0 0 0 3px rgba(139,188,255,0.10)";


        startButton.style.display =
            "none";

    }
    catch (error) {

        console.error(
            error
        );


        statusText.textContent =
            "CAMERA ERROR";

        systemState.textContent =
            "Error";

        topStatusText.textContent =
            "Camera error";


        systemIndicator.style.background =
            "#d46b6b";


        alert(

            "Failed to start camera.\n\n" +
            error.message

        );
    }

});

</script>
