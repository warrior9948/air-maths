<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>Air Maths Board — Stage 1 Core</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    touch-action: none;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================================
   CAMERA
========================================================= */

#video {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);

    background: #000;

    pointer-events: none;
}


/* =========================================================
   BOARD
========================================================= */

#canvas {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: 5;
}


/* =========================================================
   CURSOR
========================================================= */

#cursor {

    position: fixed;

    width: 28px;
    height: 28px;

    border-radius: 50%;

    border: 3px solid white;

    transform:
        translate(-50%, -50%);

    pointer-events: none;

    display: none;

    z-index: 10;

    box-shadow:
        0 0 6px rgba(255,255,255,.9);
}


/* =========================================================
   UI
========================================================= */

#controls {

    position: fixed;

    top:
        calc(12px + env(safe-area-inset-top));

    left: 50%;

    transform: translateX(-50%);

    display: flex;

    gap: 10px;

    z-index: 20;
}

button {

    border: 1px solid
        rgba(255,255,255,.3);

    background:
        rgba(15,15,15,.82);

    color: white;

    border-radius: 10px;

    padding: 10px 17px;

    font-size: 14px;

    font-weight: bold;
}

button:active {

    transform: scale(.96);
}

button:disabled {

    opacity: .6;
}


#instructions {

    position: fixed;

    top:
        calc(60px + env(safe-area-inset-top));

    left: 50%;

    transform: translateX(-50%);

    z-index: 20;

    color: white;

    background:
        rgba(0,0,0,.55);

    padding: 7px 12px;

    border-radius: 9px;

    font-size: 12px;

    white-space: nowrap;

    pointer-events: none;
}


#status {

    position: fixed;

    bottom:
        calc(14px + env(safe-area-inset-bottom));

    left: 50%;

    transform: translateX(-50%);

    z-index: 20;

    color: white;

    background:
        rgba(0,0,0,.65);

    padding: 8px 13px;

    border-radius: 10px;

    font-size: 13px;

    white-space: nowrap;

    pointer-events: none;
}

</style>
</head>


<body>

<video
    id="video"
    autoplay
    muted
    playsinline>
</video>

<canvas id="canvas"></canvas>

<div id="cursor"></div>


<div id="controls">

    <button id="startBtn">
        START
    </button>

    <button id="clearBtn">
        CLEAR
    </button>

</div>


<div id="instructions">
    ☝ Draw &nbsp; • &nbsp;
    🤏 Pinch = Stop &nbsp; • &nbsp;
    ✋ Open Palm = Clear
</div>


<div id="status">
    Press START
</div>


<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>


<script>

/* =========================================================
   AIR MATHS BOARD
   STAGE 1 — ADVANCED TRACKING CORE
========================================================= */


/* =========================================================
   DOM
========================================================= */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d", {
        alpha: true
    });

const cursor =
    document.getElementById("cursor");

const startBtn =
    document.getElementById("startBtn");

const clearBtn =
    document.getElementById("clearBtn");

const statusEl =
    document.getElementById("status");


/* =========================================================
   CONFIGURATION
========================================================= */

const CONFIG = {

    camera: {

        width: 1280,

        height: 720

    },


    tracking: {

        /*
            Minimum and maximum adaptive filter response.

            Lower = smoother
            Higher = faster
        */

        minAlpha: 0.12,

        maxAlpha: 0.82,

        speedGain: 7.5,


        /*
            Maximum believable frame-to-frame
            normalized movement.
        */

        maxJump: 0.13,


        /*
            Boundary margin.
        */

        edgeMargin: 0.004,


        /*
            Hand-loss tolerance.
        */

        handLossMs: 180

    },


    pinch: {

        enter: 0.42,

        exit: 0.63,

        confirmFrames: 3,

        releaseFrames: 2

    },


    palm: {

        confirmFrames: 6,

        cooldownMs: 1000

    },


    drawing: {

        minPointDistance: 0.0018,

        maxPointDistance: 0.055,

        lineWidth: 4,

        maxPointsPerStroke: 3000

    }

};


/* =========================================================
   APPLICATION STATE
========================================================= */

const APP = {

    running: false,

    hands: null,

    camera: null,

    lastHandTime: 0,

    lastResultTime: 0,

    handDetected: false

};


/* =========================================================
   TRACKER STATE
========================================================= */

const TRACKER = {

    raw: {

        x: null,

        y: null

    },

    filtered: {

        x: null,

        y: null

    },

    previousRaw: {

        x: null,

        y: null

    },

    previousFiltered: {

        x: null,

        y: null

    },

    velocity: {

        x: 0,

        y: 0,

        magnitude: 0

    }

};


/* =========================================================
   GESTURE STATE
========================================================= */

const GESTURE = {

    state: "NO_HAND",

    pinch: {

        active: false,

        candidate: false,

        frames: 0,

        releaseFrames: 0

    },

    palm: {

        active: false,

        frames: 0,

        locked: false,

        lastClear: 0

    }

};


/* =========================================================
   DRAWING STATE
========================================================= */

const BOARD = {

    strokes: [],

    activeStroke: null,

    width: 0,

    height: 0,

    dpr: 1

};


/* =========================================================
   STATUS
========================================================= */

function setStatus(message) {

    statusEl.textContent =
        message;

}


/* =========================================================
   CANVAS SETUP
========================================================= */

function resizeCanvas() {

    BOARD.width =
        window.innerWidth;

    BOARD.height =
        window.innerHeight;

    BOARD.dpr =
        Math.min(
            window.devicePixelRatio || 1,
            3
        );


    canvas.width =
        Math.round(
            BOARD.width *
            BOARD.dpr
        );

    canvas.height =
        Math.round(
            BOARD.height *
            BOARD.dpr
        );

    canvas.style.width =
        BOARD.width + "px";

    canvas.style.height =
        BOARD.height + "px";


    ctx.setTransform(
        BOARD.dpr,
        0,
        0,
        BOARD.dpr,
        0,
        0
    );


    configureBrush();

    renderBoard();

}


function configureBrush() {

    ctx.lineWidth =
        CONFIG.drawing.lineWidth;

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.strokeStyle =
        "#ffffff";

}


window.addEventListener(
    "resize",
    () => {

        resizeCanvas();

        /*
            Do not allow a resize/orientation change
            to connect two unrelated points.
        */

        Drawing.endStroke();

        Tracker.reset();

    }
);


/* =========================================================
   COORDINATE MAPPER
========================================================= */

/*
    IMPORTANT:

    MediaPipe gives coordinates relative to the
    original camera image.

    The browser may display that image using
    object-fit: cover.

    Therefore the visible portion can be cropped.

    This mapper accounts for that crop.
*/

const CoordinateMapper = {

    getDisplayRect() {

        const vw =
            video.videoWidth ||
            CONFIG.camera.width;

        const vh =
            video.videoHeight ||
            CONFIG.camera.height;


        const sw =
            window.innerWidth;

        const sh =
            window.innerHeight;


        const videoRatio =
            vw / vh;

        const screenRatio =
            sw / sh;


        let displayWidth;
        let displayHeight;


        if (screenRatio > videoRatio) {

            /*
                Screen is wider.

                Height fills screen.
            */

            displayWidth =
                sh * videoRatio;

            displayHeight =
                sh;

        } else {

            /*
                Screen is taller.

                Width fills screen.
            */

            displayWidth =
                sw;

            displayHeight =
                sw / videoRatio;

        }


        const offsetX =
            (sw - displayWidth) / 2;

        const offsetY =
            (sh - displayHeight) / 2;


        return {

            x: offsetX,

            y: offsetY,

            width: displayWidth,

            height: displayHeight

        };

    },


    map(landmark) {

        const rect =
            this.getDisplayRect();


        /*
            MediaPipe X is camera-space.

            CSS mirrors the video.

            So X is reversed.
        */

        const cameraX =
            1 - landmark.x;

        const cameraY =
            landmark.y;


        let x =
            rect.x +
            cameraX *
            rect.width;

        let y =
            rect.y +
            cameraY *
            rect.height;


        /*
            Clamp to screen.
        */

        x =
            Math.max(
                0,
                Math.min(
                    window.innerWidth,
                    x
                )
            );

        y =
            Math.max(
                0,
                Math.min(
                    window.innerHeight,
                    y
                )
            );


        return {

            x:
                x /
                window.innerWidth,

            y:
                y /
                window.innerHeight

        };

    }

};


/* =========================================================
   TRACKER
========================================================= */

const Tracker = {


    reset() {

        TRACKER.raw.x = null;
        TRACKER.raw.y = null;

        TRACKER.filtered.x = null;
        TRACKER.filtered.y = null;

        TRACKER.previousRaw.x = null;
        TRACKER.previousRaw.y = null;

        TRACKER.previousFiltered.x = null;
        TRACKER.previousFiltered.y = null;

        TRACKER.velocity.x = 0;
        TRACKER.velocity.y = 0;
        TRACKER.velocity.magnitude = 0;

    },


    rejectSpike(x, y) {

        if (
            TRACKER.filtered.x === null ||
            TRACKER.filtered.y === null
        ) {

            return false;

        }


        const dx =
            x -
            TRACKER.filtered.x;

        const dy =
            y -
            TRACKER.filtered.y;

        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        return (
            distance >
            CONFIG.tracking.maxJump
        );

    },


    update(x, y) {

        /*
            First frame.
        */

        if (
            TRACKER.filtered.x === null ||
            TRACKER.filtered.y === null
        ) {

            TRACKER.raw.x = x;
            TRACKER.raw.y = y;

            TRACKER.filtered.x = x;
            TRACKER.filtered.y = y;

            TRACKER.previousRaw.x = x;
            TRACKER.previousRaw.y = y;

            TRACKER.previousFiltered.x = x;
            TRACKER.previousFiltered.y = y;

            return {

                x,
                y

            };

        }


        /*
            Calculate raw velocity.
        */

        const dx =
            x -
            TRACKER.previousRaw.x;

        const dy =
            y -
            TRACKER.previousRaw.y;

        const speed =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        TRACKER.velocity.x = dx;
        TRACKER.velocity.y = dy;

        TRACKER.velocity.magnitude =
            speed;


        /*
            Save raw position.
        */

        TRACKER.previousRaw.x = x;
        TRACKER.previousRaw.y = y;


        /*
            Adaptive alpha.

            Slow movement:
                more smoothing

            Fast movement:
                more responsiveness
        */

        const alpha =
            Math.max(
                CONFIG.tracking.minAlpha,

                Math.min(
                    CONFIG.tracking.maxAlpha,

                    CONFIG.tracking.minAlpha +
                    speed *
                    CONFIG.tracking.speedGain
                )
            );


        TRACKER.filtered.x +=
            (x -
             TRACKER.filtered.x) *
            alpha;


        TRACKER.filtered.y +=
            (y -
             TRACKER.filtered.y) *
            alpha;


        /*
            Save filtered position.
        */

        TRACKER.previousFiltered.x =
            TRACKER.filtered.x;

        TRACKER.previousFiltered.y =
            TRACKER.filtered.y;


        TRACKER.raw.x = x;
        TRACKER.raw.y = y;


        return {

            x:
                TRACKER.filtered.x,

            y:
                TRACKER.filtered.y

        };

    }

};


/* =========================================================
   HAND GEOMETRY
========================================================= */

const HandGeometry = {


    distance(a, b) {

        const dx =
            a.x - b.x;

        const dy =
            a.y - b.y;

        const dz =
            (a.z || 0) -
            (b.z || 0);


        return Math.sqrt(
            dx * dx +
            dy * dy +
            dz * dz
        );

    },


    palmScale(lm) {

        const wrist =
            lm[0];

        const indexMCP =
            lm[5];

        const middleMCP =
            lm[9];


        return Math.max(

            (
                this.distance(
                    wrist,
                    indexMCP
                )

                +

                this.distance(
                    wrist,
                    middleMCP
                )

            ) / 2,

            0.0001

        );

    },


    fingerExtended(
        lm,
        tip,
        pip
    ) {

        const wrist =
            lm[0];

        const tipPoint =
            lm[tip];

        const pipPoint =
            lm[pip];


        const tipDistance =
            this.distance(
                tipPoint,
                wrist
            );

        const pipDistance =
            this.distance(
                pipPoint,
                wrist
            );


        return (
            tipDistance >
            pipDistance * 1.14
        );

    }

};


/* =========================================================
   PINCH ENGINE
========================================================= */

const PinchEngine = {


    update(lm) {

        const thumb =
            lm[4];

        const index =
            lm[8];


        const rawDistance =
            HandGeometry.distance(
                thumb,
                index
            );


        const scale =
            HandGeometry.palmScale(lm);


        const ratio =
            rawDistance /
            scale;


        const state =
            GESTURE.pinch;


        /*
            ENTER
        */

        if (!state.active) {

            state.releaseFrames = 0;


            if (
                ratio <
                CONFIG.pinch.enter
            ) {

                state.candidate = true;

                state.frames++;


                if (
                    state.frames >=
                    CONFIG.pinch.confirmFrames
                ) {

                    state.active = true;

                    state.candidate = false;

                    state.frames = 0;

                }

            } else {

                state.candidate = false;

                state.frames = 0;

            }

        }


        /*
            RELEASE
        */

        else {

            if (
                ratio >
                CONFIG.pinch.exit
            ) {

                state.releaseFrames++;


                if (
                    state.releaseFrames >=
                    CONFIG.pinch.releaseFrames
                ) {

                    state.active = false;

                    state.releaseFrames = 0;

                }

            } else {

                state.releaseFrames = 0;

            }

        }


        return state.active;

    },


    reset() {

        GESTURE.pinch.active = false;

        GESTURE.pinch.candidate = false;

        GESTURE.pinch.frames = 0;

        GESTURE.pinch.releaseFrames = 0;

    }

};


/* =========================================================
   PALM ENGINE
========================================================= */

const PalmEngine = {


    update(lm) {

        const fingers = [

            HandGeometry.fingerExtended(
                lm, 8, 6
            ),

            HandGeometry.fingerExtended(
                lm, 12, 10
            ),

            HandGeometry.fingerExtended(
                lm, 16, 14
            ),

            HandGeometry.fingerExtended(
                lm, 20, 18
            )

        ];


        const extended =
            fingers.filter(Boolean).length;


        const state =
            GESTURE.palm;


        if (extended >= 4) {

            state.frames++;


            if (
                state.frames >=
                CONFIG.palm.confirmFrames
            ) {

                state.active = true;

            }

        } else {

            state.frames = 0;

            state.active = false;

            state.locked = false;

        }


        return state.active;

    },


    shouldClear() {

        const state =
            GESTURE.palm;


        const now =
            performance.now();


        if (!state.active) {

            return false;

        }


        if (state.locked) {

            return false;

        }


        if (
            now -
            state.lastClear <
            CONFIG.palm.cooldownMs
        ) {

            return false;

        }


        state.locked = true;

        state.lastClear = now;


        return true;

    },


    reset() {

        GESTURE.palm.active = false;

        GESTURE.palm.frames = 0;

        GESTURE.palm.locked = false;

    }

};


/* =========================================================
   GESTURE ENGINE
========================================================= */

const GestureEngine = {


    update(lm) {

        const pinch =
            PinchEngine.update(lm);

        const palm =
            PalmEngine.update(lm);


        /*
            Palm has priority.
        */

        if (palm) {

            GESTURE.state =
                "PALM";

            return "PALM";

        }


        /*
            Pinch next.
        */

        if (pinch) {

            GESTURE.state =
                "PINCH";

            return "PINCH";

        }


        /*
            Otherwise draw.
        */

        GESTURE.state =
            "DRAW";

        return "DRAW";

    },


    reset() {

        GESTURE.state =
            "NO_HAND";

        PinchEngine.reset();

        PalmEngine.reset();

    }

};


/* =========================================================
   DRAWING ENGINE
========================================================= */

const Drawing = {


    clear() {

        BOARD.strokes = [];

        BOARD.activeStroke = null;

        renderBoard();

    },


    startStroke(point) {

        BOARD.activeStroke = [];

        BOARD.strokes.push(
            BOARD.activeStroke
        );


        BOARD.activeStroke.push({

            x: point.x,

            y: point.y

        });

    },


    endStroke() {

        BOARD.activeStroke =
            null;

    },


    addPoint(point) {

        if (
            !BOARD.activeStroke
        ) {

            this.startStroke(point);

            renderBoard();

            return;

        }


        const stroke =
            BOARD.activeStroke;


        const last =
            stroke[
                stroke.length - 1
            ];


        const dx =
            point.x - last.x;

        const dy =
            point.y - last.y;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        /*
            Ignore tiny movement.
        */

        if (
            distance <
            CONFIG.drawing.minPointDistance
        ) {

            return;

        }


        /*
            Tracking jumped.

            Break the stroke rather than
            drawing a massive line.
        */

        if (
            distance >
            CONFIG.drawing.maxPointDistance
        ) {

            this.endStroke();

            this.startStroke(point);

            renderBoard();

            return;

        }


        stroke.push({

            x: point.x,

            y: point.y

        });


        /*
            Protect memory.
        */

        if (
            stroke.length >
            CONFIG.drawing.maxPointsPerStroke
        ) {

            stroke.shift();

        }


        renderBoard();

    }

};


/* =========================================================
   RENDER ENGINE
========================================================= */

function renderBoard() {

    ctx.clearRect(
        0,
        0,
        BOARD.width,
        BOARD.height
    );


    configureBrush();


    for (
        const stroke
        of BOARD.strokes
    ) {

        renderStroke(stroke);

    }

}


/* =========================================================
   SMOOTH STROKE RENDERING
========================================================= */

function renderStroke(points) {

    if (!points.length) {

        return;

    }


    if (points.length === 1) {

        const p =
            points[0];


        ctx.beginPath();

        ctx.arc(

            p.x *
                BOARD.width,

            p.y *
                BOARD.height,

            CONFIG.drawing.lineWidth / 2,

            0,

            Math.PI * 2

        );

        ctx.fillStyle =
            "#ffffff";

        ctx.fill();

        return;

    }


    ctx.beginPath();


    const first =
        points[0];


    ctx.moveTo(

        first.x *
            BOARD.width,

        first.y *
            BOARD.height

    );


    /*
        Quadratic midpoint interpolation.

        This creates smoother curves than simply
        connecting every MediaPipe point.
    */

    for (
        let i = 1;
        i < points.length - 1;
        i++
    ) {

        const current =
            points[i];

        const next =
            points[i + 1];


        const midpointX =
            (
                current.x +
                next.x
            ) / 2;


        const midpointY =
            (
                current.y +
                next.y
            ) / 2;


        ctx.quadraticCurveTo(

            current.x *
                BOARD.width,

            current.y *
                BOARD.height,

            midpointX *
                BOARD.width,

            midpointY *
                BOARD.height

        );

    }


    const last =
        points[
            points.length - 1
        ];


    ctx.lineTo(

        last.x *
            BOARD.width,

        last.y *
            BOARD.height

    );


    ctx.stroke();

}


/* =========================================================
   CURSOR
========================================================= */

const Cursor = {


    show(point) {

        cursor.style.left =
            (
                point.x *
                window.innerWidth
            ) + "px";


        cursor.style.top =
            (
                point.y *
                window.innerHeight
            ) + "px";


        cursor.style.display =
            "block";

    },


    hide() {

        cursor.style.display =
            "none";

    }

};


/* =========================================================
   PROCESS HAND
========================================================= */

function processHand(lm) {

    APP.handDetected =
        true;

    APP.lastHandTime =
        performance.now();


    /*
        Index fingertip.
    */

    const landmark =
        lm[8];


    /*
        Camera → screen mapping.
    */

    const mapped =
        CoordinateMapper.map(
            landmark
        );


    /*
        Reject impossible tracking spikes.
    */

    if (
        Tracker.rejectSpike(
            mapped.x,
            mapped.y
        )
    ) {

        return;

    }


    /*
        Stabilize.
    */

    const point =
        Tracker.update(
            mapped.x,
            mapped.y
        );


    /*
        Cursor.
    */

    Cursor.show(point);


    /*
        Gestures.
    */

    const gesture =
        GestureEngine.update(lm);


    /* -----------------------------------------------------
       PALM
    ----------------------------------------------------- */

    if (
        gesture === "PALM"
    ) {

        Drawing.endStroke();


        if (
            PalmEngine.shouldClear()
        ) {

            Drawing.clear();

            setStatus(
                "✋ Board cleared"
            );

        } else {

            setStatus(
                "✋ Open palm"
            );

        }

        return;

    }


    /* -----------------------------------------------------
       PINCH
    ----------------------------------------------------- */

    if (
        gesture === "PINCH"
    ) {

        Drawing.endStroke();

        setStatus(
            "🤏 Drawing OFF"
        );

        return;

    }


    /* -----------------------------------------------------
       DRAW
    ----------------------------------------------------- */

    Drawing.addPoint(point);

    setStatus(
        "☝ Drawing"
    );

}


/* =========================================================
   NO HAND HANDLER
========================================================= */

function handleNoHand() {

    const now =
        performance.now();


    /*
        Ignore very short tracking gaps.
    */

    if (
        now -
        APP.lastHandTime <
        CONFIG.tracking.handLossMs
    ) {

        return;

    }


    if (
        APP.handDetected
    ) {

        Drawing.endStroke();

    }


    APP.handDetected =
        false;


    GestureEngine.reset();

    Tracker.reset();

    Cursor.hide();


    setStatus(
        "🖐 Hand not detected"
    );

}


/* =========================================================
   MEDIAPIPE RESULTS
========================================================= */

function onResults(results) {

    if (!APP.running) {

        return;

    }


    APP.lastResultTime =
        performance.now();


    if (
        results.multiHandLandmarks &&

        results.multiHandLandmarks.length > 0
    ) {

        processHand(
            results.multiHandLandmarks[0]
        );

    } else {

        handleNoHand();

    }

}


/* =========================================================
   INITIALIZE MEDIAPIPE
========================================================= */

function initializeHands() {

    APP.hands =
        new Hands({

            locateFile: function(file) {

                return (
                    "https://cdn.jsdelivr.net/npm/" +
                    "@mediapipe/hands/" +
                    file
                );

            }

        });


    APP.hands.setOptions({

        maxNumHands: 1,

        modelComplexity: 1,

        minDetectionConfidence:
            0.72,

        minTrackingConfidence:
            0.72

    });


    APP.hands.onResults(
        onResults
    );

}


/* =========================================================
   START CAMERA
========================================================= */

async function startCamera() {

    if (APP.running) {

        return;

    }


    try {

        setStatus(
            "Starting camera..."
        );


        initializeHands();


        APP.camera =
            new Camera(

                video,

                {

                    onFrame:
                        async function() {

                            if (
                                !APP.running
                            ) {

                                return;

                            }


                            try {

                                await APP.hands.send({

                                    image:
                                        video

                                });

                            } catch (error) {

                                console.error(
                                    error
                                );

                            }

                        },


                    width:
                        CONFIG.camera.width,


                    height:
                        CONFIG.camera.height

                }

            );


        APP.running =
            true;


        APP.camera.start();


        startBtn.textContent =
            "RUNNING";

        startBtn.disabled =
            true;


        setStatus(
            "Camera ready — show your hand"
        );

    }

    catch (error) {

        console.error(error);


        APP.running =
            false;


        setStatus(
            "Camera failed — check permission"
        );

    }

}


/* =========================================================
   BUTTONS
========================================================= */

startBtn.addEventListener(
    "click",
    startCamera
);


clearBtn.addEventListener(
    "click",
    function() {

        Drawing.clear();

        setStatus(
            "Board cleared"
        );

    }
);


/* =========================================================
   TOUCH PROTECTION
========================================================= */

document.addEventListener(

    "touchmove",

    function(event) {

        event.preventDefault();

    },

    {
        passive: false
    }

);


/* =========================================================
   INITIALIZE
========================================================= */

resizeCanvas();

setStatus(
    "Press START"
);

</script>

</body>
