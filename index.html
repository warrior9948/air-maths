<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Air Maths Board</title>

<style>

/* =========================================================
   PROFESSIONAL ENGINEERING UI
========================================================= */

:root {

    --bg: #111315;
    --surface: #181a1d;
    --surface-2: #1d2023;

    --border: #2a2e32;
    --border-light: #34383d;

    --text: #e7e9eb;
    --text-secondary: #a3a8ae;
    --text-muted: #6f757c;

    --accent: #8eaed3;
    --accent-soft: rgba(142,174,211,0.12);

    --danger: #c97979;

    --toolbar-height: 46px;
    --status-height: 28px;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: var(--bg);

    color: var(--text);

    font-family:
        Inter,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    -webkit-font-smoothing: antialiased;
}


/* =========================================================
   CAMERA
========================================================= */

#video {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);

    opacity: 0.055;

    z-index: 0;

    pointer-events: none;
}


/* =========================================================
   WORKSPACE
========================================================= */

#workspace {

    position: fixed;

    inset: 0;

    background: #111315;

    z-index: 0;

    pointer-events: none;
}


/* =========================================================
   TECHNICAL GRID
========================================================= */

#grid {

    position: fixed;

    inset: 0;

    z-index: 1;

    pointer-events: none;

    opacity: 0.11;

    background-image:

        linear-gradient(
            rgba(255,255,255,0.055) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,0.055) 1px,
            transparent 1px
        );

    background-size: 64px 64px;
}


/* =========================================================
   CANVAS
========================================================= */

#canvas {

    position: fixed;

    inset: 0;

    z-index: 3;

    pointer-events: none;
}


/* =========================================================
   TOP APPLICATION BAR
========================================================= */

#appBar {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    height: var(--toolbar-height);

    z-index: 20;

    display: flex;

    align-items: center;

    background: #181a1d;

    border-bottom:
        1px solid var(--border);
}


/* =========================================================
   APPLICATION NAME
========================================================= */

#appIdentity {

    height: 100%;

    min-width: 190px;

    padding: 0 16px;

    display: flex;

    align-items: center;

    border-right:
        1px solid var(--border);
}

#appName {

    font-size: 12px;

    font-weight: 600;

    letter-spacing: 0.25px;

    color: #e5e7e9;
}

#appVersion {

    margin-left: 8px;

    color: var(--text-muted);

    font-size: 10px;

    font-weight: 400;
}


/* =========================================================
   TOOLBAR
========================================================= */

#toolbar {

    height: 100%;

    display: flex;

    align-items: center;

    gap: 2px;

    padding: 0 8px;
}

.tool {

    height: 30px;

    min-width: 30px;

    padding: 0 9px;

    border: 1px solid transparent;

    background: transparent;

    color: var(--text-secondary);

    border-radius: 4px;

    font-size: 10px;

    cursor: default;

    display: flex;

    align-items: center;

    justify-content: center;

    transition:
        background 120ms ease,
        border-color 120ms ease,
        color 120ms ease;
}

.tool:hover {

    background: var(--surface-2);

    border-color: var(--border);

    color: var(--text);
}

.tool.active {

    background: var(--accent-soft);

    border-color:
        rgba(142,174,211,0.25);

    color: #c8d8e9;
}


/* =========================================================
   TOP RIGHT
========================================================= */

#appStatus {

    margin-left: auto;

    height: 100%;

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 0 14px;
}

.statusItem {

    display: flex;

    align-items: center;

    gap: 6px;

    color: var(--text-muted);

    font-size: 9px;

    letter-spacing: 0.2px;
}

.statusDot {

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #5d6369;
}

.statusDot.online {

    background: #8cae91;
}


/* =========================================================
   LEFT TOOL PANEL
========================================================= */

#sidePanel {

    position: fixed;

    top: 58px;

    left: 12px;

    width: 42px;

    z-index: 15;

    display: flex;

    flex-direction: column;

    background: rgba(24,26,29,0.92);

    border:
        1px solid var(--border);

    border-radius: 5px;

    overflow: hidden;

    backdrop-filter: blur(10px);
}

.sideTool {

    width: 40px;
    height: 40px;

    display: flex;

    align-items: center;
    justify-content: center;

    color: var(--text-muted);

    font-size: 13px;

    border-bottom:
        1px solid var(--border);

}

.sideTool:last-child {

    border-bottom: none;
}

.sideTool.active {

    color: var(--accent);

    background:
        rgba(142,174,211,0.07);
}


/* =========================================================
   INFORMATION PANEL
========================================================= */

#infoPanel {

    position: fixed;

    top: 58px;

    right: 12px;

    width: 205px;

    z-index: 15;

    background:
        rgba(24,26,29,0.94);

    border:
        1px solid var(--border);

    border-radius: 5px;

    backdrop-filter: blur(10px);
}

.panelHeader {

    height: 31px;

    padding: 0 11px;

    display: flex;

    align-items: center;

    border-bottom:
        1px solid var(--border);

    color: var(--text-secondary);

    font-size: 9px;

    font-weight: 600;

    letter-spacing: 0.5px;

    text-transform: uppercase;
}

.infoRow {

    height: 27px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 11px;

    border-bottom:
        1px solid
        rgba(255,255,255,0.035);

    font-size: 9px;
}

.infoRow:last-child {

    border-bottom: none;
}

.infoLabel {

    color: var(--text-muted);
}

.infoValue {

    color: var(--text-secondary);
}

.infoValue.active {

    color: #b8cbbd;
}


/* =========================================================
   CENTER STATUS
========================================================= */

#status {

    position: fixed;

    top: 58px;

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 15;

    height: 25px;

    padding: 0 10px;

    display: flex;

    align-items: center;

    background:
        rgba(24,26,29,0.82);

    border:
        1px solid var(--border);

    border-radius: 4px;

    color: var(--text-muted);

    font-size: 9px;

    letter-spacing: 0.3px;
}


/* =========================================================
   CAMERA BUTTON
========================================================= */

#startButton {

    position: fixed;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 30;

    height: 34px;

    padding: 0 18px;

    border:
        1px solid #3a4046;

    border-radius: 4px;

    background: #1d2023;

    color: #dfe3e6;

    font-family: inherit;

    font-size: 10px;

    font-weight: 600;

    letter-spacing: 0.5px;

    cursor: pointer;

    transition:
        background 120ms ease,
        border-color 120ms ease;
}

#startButton:hover {

    background: #23272b;

    border-color: #4a5057;
}


/* =========================================================
   BOTTOM STATUS BAR
========================================================= */

#bottomBar {

    position: fixed;

    bottom: 0;

    left: 0;

    width: 100%;

    height: var(--status-height);

    z-index: 20;

    display: flex;

    align-items: center;

    padding: 0 10px;

    background: #181a1d;

    border-top:
        1px solid var(--border);

    color: var(--text-muted);

    font-size: 9px;
}

.bottomSection {

    display: flex;

    align-items: center;

    gap: 7px;

    padding-right: 14px;

    margin-right: 14px;

    border-right:
        1px solid var(--border);
}

.bottomSection:last-child {

    margin-left: auto;

    margin-right: 0;

    padding-right: 0;

    border-right: none;
}

.key {

    min-width: 18px;

    height: 16px;

    padding: 0 4px;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    border:
        1px solid #34383d;

    border-radius: 3px;

    background: #202327;

    color: #a4a9ae;

    font-size: 8px;
}


/* =========================================================
   CURSOR
========================================================= */

#cursor {

    position: fixed;

    width: 22px;
    height: 22px;

    z-index: 12;

    transform:
        translate(-50%, -50%);

    border:
        1px solid rgba(220,228,236,0.88);

    border-radius: 50%;

    pointer-events: none;

    box-shadow:
        0 0 0 1px
        rgba(0,0,0,0.35);

}

#cursor::before {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 4px;
    height: 4px;

    transform:
        translate(-50%, -50%);

    background: #e8edf1;

    border-radius: 50%;
}


/* =========================================================
   CURSOR CROSSHAIR
========================================================= */

#cursor::after {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 30px;
    height: 1px;

    transform:
        translate(-50%, -50%);

    background:
        rgba(220,228,236,0.22);
}


/* =========================================================
   CORNER MARKERS
========================================================= */

.cursorMark {

    position: fixed;

    width: 5px;
    height: 5px;

    z-index: 12;

    border-color:
        rgba(220,228,236,0.5);

    pointer-events: none;
}

#markTop {

    border-top: 1px solid;
    border-left: 1px solid;
}

#markBottom {

    border-bottom: 1px solid;
    border-right: 1px solid;
}

#markLeft {

    border-left: 1px solid;
    border-bottom: 1px solid;
}

#markRight {

    border-right: 1px solid;
    border-top: 1px solid;
}


/* =========================================================
   REMOVE OLD DECORATIVE LAYERS
========================================================= */

#ambientGlow,
#particles,
#scanLine {

    display: none !important;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    :root {

        --toolbar-height: 44px;
        --status-height: 25px;
    }

    #appIdentity {

        min-width: auto;

        border-right: none;

        padding: 0 11px;
    }

    #appVersion {

        display: none;
    }

    #toolbar {

        display: none;
    }

    #appStatus {

        padding-right: 10px;
    }

    #sidePanel {

        left: 8px;

        top: 53px;

        width: 38px;
    }

    .sideTool {

        width: 36px;
        height: 36px;
    }

    #infoPanel {

        right: 8px;

        top: 53px;

        width: 175px;
    }

    #status {

        top: 52px;

        font-size: 8px;
    }

    .bottomSection {

        padding-right: 8px;

        margin-right: 8px;
    }

    .hideMobile {

        display: none;
    }

    #cursor {

        width: 19px;
        height: 19px;
    }
}


.hidden {

    display: none !important;
}

</style>
</head>


<body>

<!-- =======================================================
     MEDIAPIPE
======================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const cursor =
    document.getElementById("cursor");

const startButton =
    document.getElementById("startButton");

const statusText =
    document.getElementById("status");

const handState =
    document.getElementById("handState");

const modeState =
    document.getElementById("modeState");

const systemState =
    document.getElementById("systemState");

const systemIndicator =
    document.getElementById(
        "systemIndicator"
    );

const topStatusText =
    document.getElementById(
        "topStatusText"
    );


/* =========================================================
   CANVAS
========================================================= */

function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   DRAWING STATE
========================================================= */

let isDrawing = false;

let previousX = null;
let previousY = null;

let smoothX = null;
let smoothY = null;

let previousRawX = null;
let previousRawY = null;

let previousTime = null;

let currentSpeed = 0;

let currentDirection = null;

let strokeBuffer = [];


/* =========================================================
   V5 SETTINGS
========================================================= */

const SLOW_SMOOTHING = 0.20;

const FAST_SMOOTHING = 0.88;

const FAST_SPEED = 850;

const MAX_REASONABLE_JUMP = 400;

const MICRO_JITTER_DISTANCE = 0.65;

const MIN_POINT_DISTANCE = 1.0;

const MIN_INK_WIDTH = 2.6;

const MAX_INK_WIDTH = 5.4;

const CURVE_TENSION = 1 / 6;

let clearFrames = 0;

const CLEAR_REQUIRED_FRAMES = 5;

let clearCooldown = 0;

const CLEAR_COOLDOWN_FRAMES = 15;


/* =========================================================
   DISTANCE
========================================================= */

function distanceBetween(
    x1,
    y1,
    x2,
    y2
) {

    const dx =
        x2 - x1;

    const dy =
        y2 - y1;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


/* =========================================================
   ANGLE DIFFERENCE
========================================================= */

function angleDifference(
    a,
    b
) {

    let difference =
        a - b;

    while (
        difference > Math.PI
    ) {

        difference -=
            Math.PI * 2;
    }

    while (
        difference < -Math.PI
    ) {

        difference +=
            Math.PI * 2;
    }

    return Math.abs(
        difference
    );
}


/* =========================================================
   DIRECTION
========================================================= */

function getDirection(
    p1,
    p2
) {

    if (
        !p1 ||
        !p2
    ) {

        return null;
    }

    return Math.atan2(
        p2.y - p1.y,
        p2.x - p1.x
    );
}


/* =========================================================
   ADAPTIVE SMOOTHING
========================================================= */

function getSmoothing(
    speed,
    directionChange
) {

    if (
        speed <= 50
    ) {

        return SLOW_SMOOTHING;
    }

    if (
        speed >= FAST_SPEED
    ) {

        return FAST_SMOOTHING;
    }

    const ratio =
        (
            speed - 50
        ) /
        (
            FAST_SPEED - 50
        );

    let smoothing =
        SLOW_SMOOTHING +
        (
            FAST_SMOOTHING -
            SLOW_SMOOTHING
        ) *
        ratio;

    if (
        directionChange > 1.6
    ) {

        smoothing *= 0.78;
    }

    return Math.max(
        0.15,
        Math.min(
            smoothing,
            0.90
        )
    );
}


/* =========================================================
   SMOOTH POINT
========================================================= */

function getSmoothPoint(
    targetX,
    targetY,
    speed,
    directionChange
) {

    if (
        smoothX === null ||
        smoothY === null
    ) {

        smoothX =
            targetX;

        smoothY =
            targetY;

        return {
            x: smoothX,
            y: smoothY
        };
    }

    const smoothing =
        getSmoothing(
            speed,
            directionChange
        );

    smoothX +=
        (
            targetX -
            smoothX
        ) *
        smoothing;

    smoothY +=
        (
            targetY -
            smoothY
        ) *
        smoothing;

    return {
        x: smoothX,
        y: smoothY
    };
}


/* =========================================================
   PEN WIDTH
========================================================= */

function getPenWidth(
    speed,
    directionChange
) {

    const ratio =
        Math.min(
            speed / FAST_SPEED,
            1
        );

    let width =
        MAX_INK_WIDTH -
        (
            MAX_INK_WIDTH -
            MIN_INK_WIDTH
        ) *
        ratio;

    if (
        directionChange > 1.7
    ) {

        width *= 1.06;
    }

    return width;
}


/* =========================================================
   GLOW
========================================================= */

function getGlowAlpha(
    speed
) {

    const ratio =
        Math.min(
            speed / FAST_SPEED,
            1
        );

    return (
        0.23 -
        ratio * 0.09
    );
}


/* =========================================================
   CURVE
========================================================= */

function drawCurve(
    p0,
    p1,
    p2,
    p3,
    speed,
    directionChange
) {

    const cp1x =
        p1.x +
        (
            p2.x -
            p0.x
        ) *
        CURVE_TENSION;

    const cp1y =
        p1.y +
        (
            p2.y -
            p0.y
        ) *
        CURVE_TENSION;

    const cp2x =
        p2.x -
        (
            p3.x -
            p1.x
        ) *
        CURVE_TENSION;

    const cp2y =
        p2.y -
        (
            p3.y -
            p1.y
        ) *
        CURVE_TENSION;

    const width =
        getPenWidth(
            speed,
            directionChange
        );

    const glowAlpha =
        getGlowAlpha(
            speed
        );


    ctx.beginPath();

    ctx.moveTo(
        p1.x,
        p1.y
    );

    ctx.bezierCurveTo(
        cp1x,
        cp1y,
        cp2x,
        cp2y,
        p2.x,
        p2.y
    );

    ctx.strokeStyle =
        `rgba(120,180,225,${glowAlpha})`;

    ctx.lineWidth =
        width * 2.6;

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.shadowColor =
        "rgba(100,170,220,0.45)";

    ctx.shadowBlur =
        18;

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        p1.x,
        p1.y
    );

    ctx.bezierCurveTo(
        cp1x,
        cp1y,
        cp2x,
        cp2y,
        p2.x,
        p2.y
    );

    ctx.strokeStyle =
        "rgba(160,205,235,0.96)";

    ctx.lineWidth =
        width;

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.shadowColor =
        "rgba(100,180,230,0.55)";

    ctx.shadowBlur =
        7;

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        p1.x,
        p1.y
    );

    ctx.bezierCurveTo(
        cp1x,
        cp1y,
        cp2x,
        cp2y,
        p2.x,
        p2.y
    );

    ctx.strokeStyle =
        "rgba(245,248,250,0.88)";

    ctx.lineWidth =
        Math.max(
            1.15,
            width * 0.30
        );

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.shadowColor =
        "rgba(255,255,255,0.30)";

    ctx.shadowBlur =
        3;

    ctx.stroke();

    ctx.shadowBlur = 0;
}


/* =========================================================
   DOT
========================================================= */

function drawDot(point) {

    ctx.beginPath();

    ctx.arc(
        point.x,
        point.y,
        MAX_INK_WIDTH / 2,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "rgba(245,248,250,0.92)";

    ctx.shadowColor =
        "rgba(120,180,225,0.65)";

    ctx.shadowBlur =
        8;

    ctx.fill();

    ctx.shadowBlur = 0;
}


/* =========================================================
   ADD POINT
========================================================= */

function addStrokePoint(point) {

    const last =
        strokeBuffer[
            strokeBuffer.length - 1
        ];

    if (last) {

        const d =
            distanceBetween(
                last.x,
                last.y,
                point.x,
                point.y
            );

        if (
            d <
            MICRO_JITTER_DISTANCE
        ) {

            return;
        }

        if (
            d <
            MIN_POINT_DISTANCE
        ) {

            return;
        }
    }

    strokeBuffer.push(point);

    if (
        strokeBuffer.length === 4
    ) {

        const p0 =
            strokeBuffer[0];

        const p1 =
            strokeBuffer[1];

        const p2 =
            strokeBuffer[2];

        const p3 =
            strokeBuffer[3];

        const direction1 =
            getDirection(
                p0,
                p1
            );

        const direction2 =
            getDirection(
                p1,
                p2
            );

        let corner = 0;

        if (
            direction1 !== null &&
            direction2 !== null
        ) {

            corner =
                angleDifference(
                    direction1,
                    direction2
                );
        }

        drawCurve(
            p0,
            p0,
            p1,
            p2,
            currentSpeed,
            corner
        );

        drawCurve(
            p0,
            p1,
            p2,
            p3,
            currentSpeed,
            corner
        );

        strokeBuffer.shift();
    }
}


/* =========================================================
   FLUSH
========================================================= */

function flushStrokeBuffer() {

    const count =
        strokeBuffer.length;

    if (
        count === 0
    ) {

        return;
    }

    if (
        count === 1
    ) {

        drawDot(
            strokeBuffer[0]
        );

        return;
    }

    if (
        count === 2
    ) {

        const p0 =
            strokeBuffer[0];

        const p1 =
            strokeBuffer[1];

        ctx.beginPath();

        ctx.moveTo(
            p0.x,
            p0.y
        );

        ctx.lineTo(
            p1.x,
            p1.y
        );

        ctx.strokeStyle =
            "rgba(160,205,235,0.96)";

        ctx.lineWidth =
            MAX_INK_WIDTH;

        ctx.lineCap =
            "round";

        ctx.lineJoin =
            "round";

        ctx.shadowColor =
            "rgba(100,180,230,0.50)";

        ctx.shadowBlur =
            8;

        ctx.stroke();

        ctx.shadowBlur = 0;

        return;
    }

    if (
        count === 3
    ) {

        const p0 =
            strokeBuffer[0];

        const p1 =
            strokeBuffer[1];

        const p2 =
            strokeBuffer[2];

        drawCurve(
            p0,
            p0,
            p1,
            p2,
            currentSpeed,
            0
        );

        drawCurve(
            p0,
            p1,
            p2,
            p2,
            currentSpeed,
            0
        );

        return;
    }

    const p0 =
        strokeBuffer[
            count - 3
        ];

    const p1 =
        strokeBuffer[
            count - 2
        ];

    const p2 =
        strokeBuffer[
            count - 1
        ];

    drawCurve(
        p0,
        p1,
        p2,
        p2,
        currentSpeed,
        0
    );
}


/* =========================================================
   RESET
========================================================= */

function resetDrawingState() {

    isDrawing = false;

    previousX = null;
    previousY = null;

    smoothX = null;
    smoothY = null;

    previousRawX = null;
    previousRawY = null;

    previousTime = null;

    currentSpeed = 0;

    currentDirection = null;

    strokeBuffer = [];
}


/* =========================================================
   STOP
========================================================= */

function stopDrawing() {

    if (
        isDrawing
    ) {

        flushStrokeBuffer();
    }

    resetDrawingState();
}


/* =========================================================
   CLEAR
========================================================= */

function clearCanvas() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    resetDrawingState();
}


/* =========================================================
   DRAW
========================================================= */

function drawLine(
    targetX,
    targetY
) {

    const now =
        performance.now();

    if (
        previousRawX === null
    ) {

        previousRawX =
            targetX;

        previousRawY =
            targetY;

        previousTime =
            now;

        smoothX =
            targetX;

        smoothY =
            targetY;

        previousX =
            targetX;

        previousY =
            targetY;

        currentDirection =
            null;

        strokeBuffer = [
            {
                x: targetX,
                y: targetY
            }
        ];

        isDrawing = true;

        return;
    }

    const rawDistance =
        distanceBetween(
            previousRawX,
            previousRawY,
            targetX,
            targetY
        );

    const deltaTime =
        Math.max(
            now -
            previousTime,
            1
        );

    const instantSpeed =
        (
            rawDistance /
            deltaTime
        ) * 1000;

    currentSpeed =
        currentSpeed * 0.65 +
        instantSpeed * 0.35;

    const newDirection =
        Math.atan2(
            targetY -
            previousRawY,
            targetX -
            previousRawX
        );

    let directionChange = 0;

    if (
        currentDirection !== null
    ) {

        directionChange =
            angleDifference(
                currentDirection,
                newDirection
            );
    }

    currentDirection =
        newDirection;

    previousRawX =
        targetX;

    previousRawY =
        targetY;

    previousTime =
        now;

    if (
        rawDistance >
        MAX_REASONABLE_JUMP
    ) {

        smoothX =
            targetX;

        smoothY =
            targetY;

        previousX =
            targetX;

        previousY =
            targetY;

        strokeBuffer = [
            {
                x: targetX,
                y: targetY
            }
        ];

        return;
    }

    const smoothPoint =
        getSmoothPoint(
            targetX,
            targetY,
            currentSpeed,
            directionChange
        );

    if (
        previousX !== null &&
        previousY !== null
    ) {

        const movement =
            distanceBetween(
                previousX,
                previousY,
                smoothPoint.x,
                smoothPoint.y
            );

        if (
            movement <
            MICRO_JITTER_DISTANCE
        ) {

            return;
        }
    }

    previousX =
        smoothPoint.x;

    previousY =
        smoothPoint.y;

    addStrokePoint({
        x: smoothPoint.x,
        y: smoothPoint.y
    });

    isDrawing = true;
}


/* =========================================================
   CURSOR
========================================================= */

function updateCursor(
    x,
    y
) {

    cursor.style.left =
        x + "px";

    cursor.style.top =
        y + "px";

    cursor.classList.remove(
        "hidden"
    );
}


function hideCursor() {

    cursor.classList.add(
        "hidden"
    );
}


/* =========================================================
   FINGER DETECTION
========================================================= */

function isFingerUp(
    landmarks,
    tip,
    pip
) {

    return (
        landmarks[tip].y <
        landmarks[pip].y
    );
}


/* =========================================================
   MEDIAPIPE
========================================================= */

const hands =
    new Hands({

        locateFile:
        function(file) {

            return (
                "https://cdn.jsdelivr.net/npm/" +
                "@mediapipe/hands/" +
                file
            );
        }

    });


hands.setOptions({

    maxNumHands: 1,

    modelComplexity: 1,

    minDetectionConfidence: 0.6,

    minTrackingConfidence: 0.6

});


/* =========================================================
   RESULTS
========================================================= */

hands.onResults(
function(results) {

    if (
        clearCooldown > 0
    ) {

        clearCooldown--;
    }


    if (
        !results.multiHandLandmarks ||
        results.multiHandLandmarks.length === 0
    ) {

        handState.textContent =
            "Searching";

        modeState.textContent =
            "Standby";

        handState.className =
            "infoValue";

        stopDrawing();

        hideCursor();

        clearFrames = 0;

        return;
    }


    const landmarks =
        results.multiHandLandmarks[0];


    const indexUp =
        isFingerUp(
            landmarks,
            8,
            6
        );

    const middleUp =
        isFingerUp(
            landmarks,
            12,
            10
        );

    const ringUp =
        isFingerUp(
            landmarks,
            16,
            14
        );

    const pinkyUp =
        isFingerUp(
            landmarks,
            20,
            18
        );


    const fingersUp =
        Number(indexUp) +
        Number(middleUp) +
        Number(ringUp) +
        Number(pinkyUp);


    const openHand =
        fingersUp >= 3;


    const thumb =
        landmarks[4];

    const indexTip =
        landmarks[8];


    const pinchDistance =
        Math.sqrt(

            Math.pow(
                thumb.x -
                indexTip.x,
                2
            ) +

            Math.pow(
                thumb.y -
                indexTip.y,
                2
            )

        );


    const isPinching =
        pinchDistance < 0.055;


    const x =
        (
            1 -
            indexTip.x
        ) *
        window.innerWidth;


    const y =
        indexTip.y *
        window.innerHeight;


    updateCursor(
        x,
        y
    );


    handState.textContent =
        "Detected";

    handState.className =
        "infoValue active";


    if (
        openHand
    ) {

        stopDrawing();

        modeState.textContent =
            "Clearing";

        clearFrames++;


        if (
            clearFrames >=
            CLEAR_REQUIRED_FRAMES
        ) {

            if (
                clearCooldown <= 0
            ) {

                clearCanvas();

                clearCooldown =
                    CLEAR_COOLDOWN_FRAMES;
            }

            clearFrames = 0;
        }

        return;
    }


    clearFrames = 0;


    if (
        isPinching
    ) {

        stopDrawing();

        modeState.textContent =
            "Paused";

        return;
    }


    if (

        indexUp &&
        !middleUp &&
        !ringUp &&
        !pinkyUp &&
        !isPinching

    ) {

        modeState.textContent =
            "Drawing";

        drawLine(
            x,
            y
        );

        return;
    }


    stopDrawing();

    modeState.textContent =
        "Standby";

});


/* =========================================================
   CAMERA START
========================================================= */

startButton.addEventListener(
"click",
async function() {

    try {

        statusText.textContent =
            "INITIALIZING CAMERA";

        systemState.textContent =
            "Starting";

        topStatusText.textContent =
            "STARTING";


        const stream =
            await navigator
            .mediaDevices
            .getUserMedia({

                video: {
                    facingMode: "user"
                },

                audio: false

            });


        video.srcObject =
            stream;


        const camera =
            new Camera(

                video,

                {

                    onFrame:
                    async function() {

                        await hands.send({
                            image: video
                        });

                    },

                    width: 1280,

                    height: 720

                }

            );


        camera.start();


        statusText.textContent =
            "SYSTEM READY";

        systemState.textContent =
            "Online";

        topStatusText.textContent =
            "READY";

        systemIndicator.classList.add(
            "online"
        );


        startButton.style.display =
            "none";

    }

    catch (error) {

        console.error(error);


        statusText.textContent =
            "CAMERA INITIALIZATION FAILED";

        systemState.textContent =
            "Error";

        topStatusText.textContent =
            "ERROR";


        alert(
            "Failed to start camera.\n\n" +
            error.message
        );

    }

});

</script>
