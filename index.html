<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Air Maths Board — Stage 1 Advanced</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
        touch-action: none;
    }

    #video {
        position: fixed;
        inset: 0;

        width: 100%;
        height: 100%;

        object-fit: cover;

        transform: scaleX(-1);

        background: #000;

        pointer-events: none;
    }

    #canvas {
        position: fixed;
        inset: 0;

        width: 100%;
        height: 100%;

        pointer-events: none;
    }

    #cursor {
        position: fixed;

        width: 28px;
        height: 28px;

        border: 3px solid white;
        border-radius: 50%;

        transform: translate(-50%, -50%);

        pointer-events: none;

        display: none;

        z-index: 10;

        box-shadow:
            0 0 5px rgba(255,255,255,0.8);
    }

    #controls {
        position: fixed;

        top: 15px;
        left: 50%;

        transform: translateX(-50%);

        z-index: 20;

        display: flex;
        gap: 10px;
    }

    button {
        border: none;

        padding: 10px 18px;

        border-radius: 10px;

        background: rgba(20,20,20,0.8);
        color: white;

        font-size: 15px;

        font-weight: bold;

        border: 1px solid rgba(255,255,255,0.25);
    }

    button:active {
        transform: scale(0.96);
    }

    #status {
        position: fixed;

        bottom: 18px;
        left: 50%;

        transform: translateX(-50%);

        z-index: 20;

        color: white;

        background: rgba(0,0,0,0.65);

        padding: 8px 14px;

        border-radius: 10px;

        font-size: 14px;

        text-align: center;

        white-space: nowrap;
    }

    #instructions {
        position: fixed;

        left: 50%;
        top: 65px;

        transform: translateX(-50%);

        z-index: 20;

        color: white;

        background: rgba(0,0,0,0.55);

        padding: 8px 12px;

        border-radius: 10px;

        font-size: 12px;

        text-align: center;

        pointer-events: none;
    }
</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>

<canvas id="canvas"></canvas>

<div id="cursor"></div>

<div id="controls">
    <button id="startBtn">START</button>
    <button id="clearBtn">CLEAR</button>
</div>

<div id="instructions">
    ☝ Index = Draw &nbsp; | &nbsp;
    🤏 Pinch = Stop &nbsp; | &nbsp;
    ✋ Open Palm = Clear
</div>

<div id="status">Press START</div>


<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>


<script>

"use strict";


/* =========================================================
   ELEMENTS
========================================================= */

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const cursor = document.getElementById("cursor");

const startBtn = document.getElementById("startBtn");
const clearBtn = document.getElementById("clearBtn");

const statusText = document.getElementById("status");


/* =========================================================
   GLOBAL STATE
========================================================= */

let camera = null;
let hands = null;

let running = false;

let lastFrameTime = performance.now();

let lastHandSeenTime = 0;

let handVisible = false;


/* =========================================================
   CANVAS / DPR
========================================================= */

let dpr = Math.min(window.devicePixelRatio || 1, 3);

let canvasWidth = 0;
let canvasHeight = 0;


/*
    Strokes are stored as normalized coordinates.

    This means if the phone rotates or the screen
    resizes, the drawing can be reconstructed correctly.
*/

let strokes = [];

let currentStroke = null;


/* =========================================================
   TRACKING STATE
========================================================= */

let filteredX = null;
let filteredY = null;

let previousFilteredX = null;
let previousFilteredY = null;

let previousRawX = null;
let previousRawY = null;


/* =========================================================
   HAND LOSS
========================================================= */

const HAND_LOSS_GRACE_MS = 180;


/* =========================================================
   ADAPTIVE FILTER
========================================================= */

/*
    Low movement:
        stronger smoothing

    Fast movement:
        weaker smoothing

    This gives stability without making the cursor
    feel excessively delayed.
*/

const FILTER_MIN = 0.16;
const FILTER_MAX = 0.78;

const FILTER_SPEED_SCALE = 0.035;


/* =========================================================
   TRACKING SPIKE PROTECTION
========================================================= */

const MAX_NORMALIZED_JUMP = 0.16;


/* =========================================================
   PINCH DETECTION
========================================================= */

const PINCH_ENTER = 0.48;
const PINCH_RELEASE = 0.68;

let pinchState = false;

let pinchCandidate = false;

let pinchFrames = 0;

let releaseFrames = 0;

const PINCH_CONFIRM_FRAMES = 3;
const RELEASE_CONFIRM_FRAMES = 2;


/* =========================================================
   PALM DETECTION
========================================================= */

let palmState = false;

let palmCandidateFrames = 0;

const PALM_CONFIRM_FRAMES = 6;

let palmClearLocked = false;


/* =========================================================
   GESTURE STATES
========================================================= */

const GESTURE = {

    NO_HAND: "NO_HAND",

    DRAW: "DRAW",

    PINCH: "PINCH",

    PALM: "PALM"

};

let gestureState = GESTURE.NO_HAND;


/* =========================================================
   DRAWING SETTINGS
========================================================= */

const LINE_WIDTH = 4;

const MIN_DRAW_DISTANCE = 0.0025;

const MAX_DRAW_DISTANCE = 0.075;


/* =========================================================
   STATUS
========================================================= */

function setStatus(text) {

    statusText.textContent = text;

}


/* =========================================================
   CANVAS RESIZE
========================================================= */

function resizeCanvas() {

    dpr = Math.min(window.devicePixelRatio || 1, 3);

    canvasWidth = window.innerWidth;
    canvasHeight = window.innerHeight;

    canvas.width = Math.round(canvasWidth * dpr);
    canvas.height = Math.round(canvasHeight * dpr);

    canvas.style.width = canvasWidth + "px";
    canvas.style.height = canvasHeight + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    redrawAll();

}


window.addEventListener("resize", () => {

    resizeCanvas();

    resetDrawingTracking();

});


/* =========================================================
   DRAWING HELPERS
========================================================= */

function clearBoard() {

    strokes = [];

    currentStroke = null;

    ctx.clearRect(0, 0, canvasWidth, canvasHeight);

    resetDrawingTracking();

}


function resetDrawingTracking() {

    previousFilteredX = null;
    previousFilteredY = null;

}


/* =========================================================
   NORMALIZED → SCREEN
========================================================= */

function screenX(nx) {

    return nx * canvasWidth;

}


function screenY(ny) {

    return ny * canvasHeight;

}


/* =========================================================
   REDRAW STORED STROKES
========================================================= */

function redrawAll() {

    ctx.clearRect(0, 0, canvasWidth, canvasHeight);

    ctx.lineWidth = LINE_WIDTH;

    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.strokeStyle = "#ffffff";

    for (const stroke of strokes) {

        if (!stroke || stroke.length < 2) continue;

        drawSmoothStroke(stroke);

    }

}


/* =========================================================
   SMOOTH STROKE RENDERER
========================================================= */

function drawSmoothStroke(points) {

    if (points.length < 2) return;

    ctx.beginPath();

    const first = points[0];

    ctx.moveTo(
        screenX(first.x),
        screenY(first.y)
    );

    if (points.length === 2) {

        const p = points[1];

        ctx.lineTo(
            screenX(p.x),
            screenY(p.y)
        );

    } else {

        for (let i = 1; i < points.length - 1; i++) {

            const current = points[i];
            const next = points[i + 1];

            const midX =
                (screenX(current.x) +
                 screenX(next.x)) / 2;

            const midY =
                (screenY(current.y) +
                 screenY(next.y)) / 2;

            ctx.quadraticCurveTo(
                screenX(current.x),
                screenY(current.y),
                midX,
                midY
            );

        }

        const last = points[points.length - 1];

        ctx.lineTo(
            screenX(last.x),
            screenY(last.y)
        );

    }

    ctx.stroke();

}


/* =========================================================
   ADD DRAW POINT
========================================================= */

function addDrawPoint(x, y) {

    if (!currentStroke) {

        currentStroke = [];

        strokes.push(currentStroke);

        currentStroke.push({
            x,
            y
        });

        redrawAll();

        return;
    }


    const last =
        currentStroke[currentStroke.length - 1];


    const dx = x - last.x;
    const dy = y - last.y;

    const distance =
        Math.sqrt(dx * dx + dy * dy);


    /*
        Ignore microscopic movement.
    */

    if (distance < MIN_DRAW_DISTANCE) {

        return;

    }


    /*
        If tracking suddenly jumps,
        do NOT draw a giant unwanted line.
    */

    if (distance > MAX_DRAW_DISTANCE) {

        currentStroke = null;

        resetDrawingTracking();

        return;

    }


    currentStroke.push({
        x,
        y
    });


    /*
        Keep enough history for smooth curves,
        but avoid unlimited memory growth.
    */

    if (currentStroke.length > 1200) {

        currentStroke.shift();

    }


    redrawAll();

}


/* =========================================================
   END CURRENT STROKE
========================================================= */

function endStroke() {

    currentStroke = null;

    resetDrawingTracking();

}


/* =========================================================
   DISTANCE BETWEEN LANDMARKS
========================================================= */

function distance3D(a, b) {

    const dx = a.x - b.x;
    const dy = a.y - b.y;
    const dz = (a.z || 0) - (b.z || 0);

    return Math.sqrt(
        dx * dx +
        dy * dy +
        dz * dz
    );

}


/* =========================================================
   PALM SIZE
========================================================= */

/*
    We normalize pinch distance using hand size.

    This makes pinch detection much less dependent
    on how close the hand is to the camera.
*/

function getPalmScale(lm) {

    const wrist = lm[0];

    const middleMCP = lm[9];

    const indexMCP = lm[5];

    const a = distance3D(wrist, middleMCP);
    const b = distance3D(wrist, indexMCP);

    return Math.max(
        (a + b) / 2,
        0.0001
    );

}


/* =========================================================
   PINCH DETECTION
========================================================= */

function detectPinch(lm) {

    const thumb = lm[4];

    const index = lm[8];

    const rawDistance =
        distance3D(thumb, index);

    const palmScale =
        getPalmScale(lm);

    const normalized =
        rawDistance / palmScale;


    /*
        Hysteresis:

        Enter pinch at a smaller distance.

        Once pinched, require a noticeably larger
        distance before releasing.

        This prevents rapid ON/OFF fluctuation.
    */

    if (!pinchState) {

        if (normalized < PINCH_ENTER) {

            if (!pinchCandidate) {

                pinchCandidate = true;
                pinchFrames = 0;

            }

            pinchFrames++;

            if (pinchFrames >= PINCH_CONFIRM_FRAMES) {

                pinchState = true;

                pinchCandidate = false;
                pinchFrames = 0;

            }

        } else {

            pinchCandidate = false;
            pinchFrames = 0;

        }

    } else {

        if (normalized > PINCH_RELEASE) {

            releaseFrames++;

            if (releaseFrames >= RELEASE_CONFIRM_FRAMES) {

                pinchState = false;

                releaseFrames = 0;

            }

        } else {

            releaseFrames = 0;

        }

    }


    return pinchState;

}


/* =========================================================
   FINGER EXTENSION
========================================================= */

function fingerExtended(lm, tipIndex, pipIndex) {

    const wrist = lm[0];

    const tip = lm[tipIndex];

    const pip = lm[pipIndex];

    const tipDistance =
        distance3D(tip, wrist);

    const pipDistance =
        distance3D(pip, wrist);


    /*
        Tip must be sufficiently farther from wrist
        than the PIP joint.
    */

    return tipDistance >
           pipDistance * 1.13;

}


/* =========================================================
   OPEN PALM DETECTION
========================================================= */

function detectOpenPalm(lm) {

    const index =
        fingerExtended(lm, 8, 6);

    const middle =
        fingerExtended(lm, 12, 10);

    const ring =
        fingerExtended(lm, 16, 14);

    const pinky =
        fingerExtended(lm, 20, 18);


    let extendedCount = 0;

    if (index) extendedCount++;
    if (middle) extendedCount++;
    if (ring) extendedCount++;
    if (pinky) extendedCount++;


    /*
        Require all four main fingers extended.
    */

    if (extendedCount === 4) {

        palmCandidateFrames++;

        if (palmCandidateFrames >= PALM_CONFIRM_FRAMES) {

            palmState = true;

        }

    } else {

        palmCandidateFrames = 0;

        palmState = false;

        palmClearLocked = false;

    }


    return palmState;

}


/* =========================================================
   ADAPTIVE FILTER
========================================================= */

function adaptiveFilter(rawX, rawY) {

    if (
        filteredX === null ||
        filteredY === null
    ) {

        filteredX = rawX;
        filteredY = rawY;

        previousRawX = rawX;
        previousRawY = rawY;

        return {
            x: filteredX,
            y: filteredY
        };

    }


    const dx =
        rawX - previousRawX;

    const dy =
        rawY - previousRawY;

    const speed =
        Math.sqrt(dx * dx + dy * dy);


    previousRawX = rawX;
    previousRawY = rawY;


    /*
        Faster movement → higher alpha.

        Higher alpha means the filter catches up
        faster and feels more responsive.
    */

    const alpha =
        Math.min(
            FILTER_MAX,
            FILTER_MIN +
            speed * FILTER_SPEED_SCALE * 100
        );


    filteredX +=
        (rawX - filteredX) * alpha;

    filteredY +=
        (rawY - filteredY) * alpha;


    return {
        x: filteredX,
        y: filteredY
    };

}


/* =========================================================
   RESET FILTER
========================================================= */

function resetFilter() {

    filteredX = null;
    filteredY = null;

    previousRawX = null;
    previousRawY = null;

}


/* =========================================================
   SAFE COORDINATE
========================================================= */

function clamp(value, min, max) {

    return Math.max(
        min,
        Math.min(max, value)
    );

}


/* =========================================================
   LANDMARK → SCREEN COORDINATES
========================================================= */

function getFingerPosition(lm) {

    /*
        MediaPipe camera image is mirrored through CSS.

        Therefore X is reversed here.
    */

    let x = 1 - lm[8].x;
    let y = lm[8].y;


    /*
        Keep the fingertip inside a very small safe
        boundary so it cannot disappear due to
        numerical noise at the extreme edge.
    */

    x = clamp(x, 0.005, 0.995);
    y = clamp(y, 0.005, 0.995);


    return {
        x,
        y
    };

}


/* =========================================================
   PROCESS LANDMARKS
========================================================= */

function processHand(lm) {

    if (!lm || lm.length < 21) {

        handleNoHand();

        return;

    }


    handVisible = true;

    lastHandSeenTime =
        performance.now();


    /* -----------------------------------------------
       RAW FINGER POSITION
    ------------------------------------------------ */

    const raw =
        getFingerPosition(lm);


    /* -----------------------------------------------
       SPIKE REJECTION
    ------------------------------------------------ */

    if (
        previousFilteredX !== null &&
        previousFilteredY !== null
    ) {

        const jumpX =
            raw.x - previousFilteredX;

        const jumpY =
            raw.y - previousFilteredY;

        const jump =
            Math.sqrt(
                jumpX * jumpX +
                jumpY * jumpY
            );


        if (jump > MAX_NORMALIZED_JUMP) {

            /*
                Ignore this frame.

                Tracking probably jumped.
            */

            return;

        }

    }


    /* -----------------------------------------------
       FILTER
    ------------------------------------------------ */

    const filtered =
        adaptiveFilter(
            raw.x,
            raw.y
        );


    previousFilteredX = filtered.x;
    previousFilteredY = filtered.y;


    /* -----------------------------------------------
       CURSOR
    ------------------------------------------------ */

    const cx =
        screenX(filtered.x);

    const cy =
        screenY(filtered.y);


    cursor.style.left =
        cx + "px";

    cursor.style.top =
        cy + "px";

    cursor.style.display =
        "block";


    /* -----------------------------------------------
       GESTURES
    ------------------------------------------------ */

    const isPinching =
        detectPinch(lm);

    const isPalm =
        detectOpenPalm(lm);


    /* -----------------------------------------------
       OPEN PALM
    ------------------------------------------------ */

    if (isPalm && !palmClearLocked) {

        gestureState =
            GESTURE.PALM;

        palmClearLocked = true;

        clearBoard();

        setStatus("✋ Board cleared");

        return;

    }


    /* -----------------------------------------------
       PINCH
    ------------------------------------------------ */

    if (isPinching) {

        gestureState =
            GESTURE.PINCH;

        endStroke();

        setStatus("🤏 Pinch — Drawing OFF");

        return;

    }


    /* -----------------------------------------------
       DRAW
    ------------------------------------------------ */

    gestureState =
        GESTURE.DRAW;


    setStatus("☝ Drawing");


    addDrawPoint(
        filtered.x,
        filtered.y
    );

}


/* =========================================================
   HAND LOSS
========================================================= */

function handleNoHand() {

    handVisible = false;


    const now =
        performance.now();


    /*
        Do not immediately reset everything.

        MediaPipe can occasionally miss a frame.
    */

    if (
        now - lastHandSeenTime <
        HAND_LOSS_GRACE_MS
    ) {

        return;

    }


    gestureState =
        GESTURE.NO_HAND;


    endStroke();

    resetFilter();

    pinchState = false;

    pinchCandidate = false;

    pinchFrames = 0;

    releaseFrames = 0;

    palmState = false;

    palmCandidateFrames = 0;

    palmClearLocked = false;


    cursor.style.display =
        "none";


    setStatus("🖐 Hand not detected");

}


/* =========================================================
   MEDIAPIPE RESULTS
========================================================= */

function onResults(results) {

    if (!running) return;


    if (
        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0
    ) {

        processHand(
            results.multiHandLandmarks[0]
        );

    } else {

        handleNoHand();

    }

}


/* =========================================================
   INITIALIZE MEDIAPIPE
========================================================= */

function initializeHands() {

    hands = new Hands({

        locateFile: (file) => {

            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

        }

    });


    hands.setOptions({

        maxNumHands: 1,

        modelComplexity: 1,

        minDetectionConfidence: 0.70,

        minTrackingConfidence: 0.70

    });


    hands.onResults(onResults);

}


/* =========================================================
   START CAMERA
========================================================= */

async function startCamera() {

    if (running) return;


    try {

        setStatus("Starting camera...");

        running = true;

        initializeHands();


        camera = new Camera(
            video,
            {

                onFrame: async () => {

                    if (!running) return;

                    try {

                        await hands.send({
                            image: video
                        });

                    } catch (error) {

                        console.error(
                            "MediaPipe frame error:",
                            error
                        );

                    }

                },

                width: 1280,

                height: 720

            }
        );


        camera.start();


        startBtn.textContent =
            "RUNNING";

        startBtn.disabled =
            true;


        setStatus(
            "Camera ready — show your hand"
        );


    } catch (error) {

        console.error(error);

        running = false;

        setStatus(
            "Camera error — allow camera permission"
        );

    }

}


/* =========================================================
   START BUTTON
========================================================= */

startBtn.addEventListener(
    "click",
    startCamera
);


/* =========================================================
   CLEAR BUTTON
========================================================= */

clearBtn.addEventListener(
    "click",
    () => {

        clearBoard();

        setStatus(
            "Board cleared"
        );

    }
);


/* =========================================================
   PREVENT TOUCH SCROLLING
========================================================= */

document.addEventListener(
    "touchmove",
    (event) => {

        event.preventDefault();

    },
    {
        passive: false
    }
);


/* =========================================================
   INITIAL CANVAS
========================================================= */

resizeCanvas();


/* =========================================================
   INITIAL STATUS
========================================================= */

setStatus(
    "Press START"
);

</script>

</body>
</html>
